年，______ 軍隊攻陷巴格達，阿拔斯王朝滅亡。", "a": ["蒙古"], "e": "蒙古西征攻陷巴格達，結束阿拔斯王朝，也重創了伊斯蘭世界的學術中心。", "_v": "b3", "_vn": "世界史", "_c": "第 3 章 伊斯蘭與世界", "_u": "b3c3.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "七世紀中葉，伊斯蘭軍隊進入耶路撒冷。哈里發烏瑪爾與城內基督教會領袖簽訂條約，內容承諾保障當地居民的財產、教堂與十字架，教堂不會被穆斯林占住或摧毀，居民也不會被強迫改信伊斯蘭教。條約同時要求非穆斯林繳納規定的稅賦，並在若干公共場合遵守一定的規範。", "subs": [{"q": "這份條約最能反映伊斯蘭統治初期的哪一項特徵？", "o": ["以強制改信作為統治手段", "對『有經人』採取宗教寬容並課稅的政策", "完全廢除稅制以爭取人心", "要求所有居民遷離耶路撒冷"], "a": 1, "e": "保障信仰與財產、同時課徵人頭稅，正是典型的「有經人」政策，讓穆斯林得以統治宗教複雜的廣大地區。"}, {"q": "就統治效率而言，這種做法帶來的最大好處是：", "o": ["可以立即消滅其他宗教", "降低被征服者的反抗，並取得穩定稅收", "使伊斯蘭教義更接近基督教", "讓阿拉伯人不必再經商"], "a": 1, "e": "寬容政策減少抵抗成本、換取穩定財源，是伊斯蘭帝國能在短時間內統治廣土眾民的重要原因。"}], "_v": "b3", "_vn": "世界史", "_c": "第 3 章 伊斯蘭與世界", "_u": "b3c3.html"}, {"t": "mc", "q": "美洲原住民人口在歐洲人抵達後一世紀內銳減，最主要的原因是：", "o": ["歐洲人的火器屠殺", "舊大陸傳入的天花、麻疹等傳染病", "原住民大量遷往非洲", "氣候突然劇烈變化"], "a": 1, "e": "軍事征服固然殘酷，但對缺乏免疫力的美洲人口造成最大損失的是傳染病，這也是少數歐洲人能征服大帝國的關鍵因素。", "_v": "b3", "_vn": "世界史", "_c": "第 4 章 西方與世界", "_u": "b3c4.html"}, {"t": "mc", "q": "美洲白銀大量流入中國，對明清最直接的影響是：", "o": ["使中國放棄農業", "促成賦稅與貨幣的白銀化（如一條鞭法）", "導致中國人口銳減", "使中國開始工業革命"], "a": 1, "e": "白銀成為主要通貨，賦稅折銀徵收，明清的財政與市場因此深度捲入全球貿易體系。", "_v": "b3", "_vn": "世界史", "_c": "第 4 章 西方與世界", "_u": "b3c4.html"}, {"t": "mc", "q": "十九世紀後期「新帝國主義」與早期商業殖民最大的不同在於：", "o": ["不再需要海軍", "從沿海商站深入內陸進行領土統治，以取得原料與市場", "完全放棄使用武力", "只由葡萄牙與西班牙進行"], "a": 1, "e": "工業化提高了對原料與市場的需求，蒸汽船、鐵路、電報與奎寧則使深入內陸成為可能，殖民因此從商站轉為大規模領土統治。", "_v": "b3", "_vn": "世界史", "_c": "第 4 章 西方與世界", "_u": "b3c4.html"}, {"t": "mc", "q": "1884–85 年柏林會議的主要內容是：", "o": ["結束第一次世界大戰", "由列強議定瓜分非洲的規則", "成立國際聯盟", "廢除大西洋奴隸貿易"], "a": 1, "e": "柏林會議由歐洲列強議定在非洲劃分勢力範圍的原則，非洲人本身完全沒有參與，其後數十年非洲幾乎被瓜分殆盡。", "_v": "b3", "_vn": "世界史", "_c": "第 4 章 西方與世界", "_u": "b3c4.html"}, {"t": "mc", "q": "《凡爾賽和約》被視為第二次世界大戰遠因之一，主要理由是：", "o": ["它讓德國取得大片殖民地", "它對德國課以嚴苛賠償與限制，助長復仇情緒與極端勢力", "它解散了所有歐洲軍隊", "它使美國成為戰敗國"], "a": 1, "e": "沉重賠償與領土、軍備限制造成德國社會的屈辱感；經濟大恐慌後，納粹得以利用這股情緒取得政權。", "_v": "b3", "_vn": "世界史", "_c": "第 4 章 西方與世界", "_u": "b3c4.html"}, {"t": "mc", "q": "下列何者最能說明兩次世界 萬隆會議提出和平共處與反殖民的主張，是第三世界外交的重要起點。", "_v": "b3", "_vn": "世界史", "_c": "第 4 章 西方與世界", "_u": "b3c4.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "一位十九世紀末的英國殖民支持者寫下這樣的詩句大意：士兵帶著祈禱書與來福槍前進異教徒的土地，沿著商貿之路乘風破浪，用機關槍「傳播和平的福音」；如果對方不聽勸告，就讓機槍替他們講道。另一份隨軍記者的日記則記載，某場戰役結束後，機關槍前躺著兩萬具屍體。", "subs": [{"q": "這段材料最能揭露新帝國主義的哪一項特徵？", "o": ["殖民擴張完全出於宗教熱誠", "宗教、商業與軍事技術優勢交織，並以「文明使命」加以合理化", "歐洲列強在軍事上處於劣勢", "殖民地人民普遍歡迎歐洲人到來"], "a": 1, "e": "詩句同時出現祈禱書（宗教）、商貿之路（經濟）與機關槍（軍事技術），並以「傳播和平福音」包裝，正是新帝國主義的典型修辭。"}, {"q": "閱讀這類史料時，最需要注意的是：", "o": ["它一定是客觀事實的完整紀錄", "它反映了作者的立場，應與被殖民者留下的紀錄對照閱讀", "只要是同時代的文字都可以直接引用", "詩歌不能作為史料"], "a": 1, "e": "任何史料都帶有立場。理解殖民史必須同時檢視殖民者與被殖民者的紀錄，才能避免單一視角。"}], "_v": "b3", "_vn": "世界史", "_c": "第 4 章 西方與世界", "_u": "b3c4.html"}, {"t": "mc", "q": "馬歇爾計畫除了經濟重建，還具有哪一項冷戰意義？", "o": ["促使西歐加入共產陣營", "以經濟援助鞏固西歐、防止共產主義擴散", "解除西歐所有軍備", "使美國退出歐洲事務"], "a": 1, "e": "經濟穩定被視為抵抗共產主義最有效的方式，馬歇爾計畫因此兼具重建與圍堵的雙重目的。", "_v": "b3", "_vn": "世界史", "_c": "第 5 章 冷戰及後冷戰時期的世界局勢", "_u": "b3c5.html"}, {"t": "mc", "q": "「相互保證毀滅」之所以維持了長期的和平，其邏輯是：", "o": ["雙方都沒有核武", "雙方核武都足以摧毀對方，因此誰也不敢先發動攻擊", "聯合國強制銷毀了所有核武", "雙方簽訂了永久和平條約"], "a": 1, "e": "這是一種恐怖平衡：先發動核攻擊也無法避免被報復性毀滅，於是核戰在理性計算上變得不可行。", "_v": "b3", "_vn": "世界史", "_c": "第 5 章 冷戰及後冷戰時期的世界局勢", "_u": "b3c5.html"}, {"t": "mc", "q": "韓戰爆發對臺灣最直接的影響是：", "o": ["臺灣被納入共產陣營", "美國派第七艦隊巡弋臺灣海峽，臺灣被納入美國西太平洋防線", "臺灣立即解除戒嚴", "臺灣加入華沙公約組織"], "a": 1, "e": "韓戰使美國重新評估臺灣的戰略價值，派遣第七艦隊協防，並展開長期美援，深刻影響了臺灣戰後的政經走向。", "_v": "b3", "_vn": "世界史", "_c": "第 5 章 冷戰及後冷戰時期的世界局勢", "_u": "b3c5.html"}, {"t": "mc", "q": "1968 年的布拉格之春與法國五月風暴，共同反映了什麼時代氛圍？", "o": ["兩大陣營內部都出現挑戰既有權威的聲音", "共產陣營與資本陣營即將合併", "兩國都宣布中立", "歐洲已完全消除階級差異"], "a": 0, "e": "同一年，東方的改革嘗試與西方的學生運動都在挑戰既有體制，顯示 1960 年代的抗議浪潮跨越了陣營界線。", "_v": "b3", "_vn": "世界史", "_c": "第 5 章 冷戰及後冷戰時期的世界局勢", "_u": "b3c5.html"}, {"t": "mc", "q": "戈巴契夫推動「重建」與「開放」的原意是：", "o": ["主動解散蘇聯", "改革經濟與政治以挽救蘇聯體制", "加入北約", "恢復史達林時期的統治"], "a": 1, "e": "戈巴契夫的目的是改革以延續體制，但公開化釋放了長期壓抑的訴求，加上放棄武力干預東歐，反而加速了蘇聯瓦解。", "_v": "b3", "_vn": "世界史", "_c": "第 5 章 冷戰及後冷戰時期的世界局勢", "_u": "b3c5.html"}, {"t": "mc", "q ": "b3c6.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "研究者拍攝了世界各地的同一家速食連鎖店：中國福建的分店開在傳統土樓造型的建築裡；泰國分店門口的招牌人物以當地合十禮的姿勢迎客，菜單上有南洋風的飯食；摩洛哥的分店外觀結合伊斯蘭風格並考量當地乾燥氣候；伊斯蘭世界的分店則提供符合清真規範的烤雞肉皮塔餅。", "subs": [{"q": "這組照片最適合用來說明下列哪一個概念？", "o": ["文化完全同質化", "全球在地化", "閉關自守", "文明衝突"], "a": 1, "e": "同一個全球品牌在各地依當地建築、飲食與禮俗調整，正是「全球在地化」最常被引用的例證。"}, {"q": "有人以此主張「全球化不會消滅地方文化」。要檢驗這個主張，最需要進一步了解的是：", "o": ["這家連鎖店的股價", "在地化的是表面形式，還是實質的生產與消費結構也由在地決定", "照片的拍攝時間", "店員的制服顏色"], "a": 1, "e": "外觀與菜單的在地化不等於經濟主導權的在地化。要判斷全球化的文化效果，必須同時檢視資本、供應鏈與決策權的歸屬。"}], "_v": "b3", "_vn": "世界史", "_c": "第 6 章 當代世界新局面", "_u": "b3c6.html"}, {"t": "mc", "q": "希波克拉底學派在醫學史上最關鍵的貢獻是：", "o": ["首先發現細菌是疾病的病原", "主張疾病有自然原因，而非神明降災", "發明了疫苗接種技術", "建立了世界上第一所醫學院"], "a": 1, "e": "細菌學說要到十九世紀才成立。希波克拉底學派的突破在方法論：把疾病從神譴、巫術的解釋中拉出來，改以人體自然狀態來理解，這是醫學成為一門學問的起點。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 1 章 疾病與醫療", "_u": "b4c1.html"}, {"t": "mc", "q": "「檢疫（quarantine）」制度最早的形成背景是：", "o": ["十九世紀倫敦霍亂流行", "十四世紀黑死病期間港市要求船隻在外海停泊觀察", "一九一八年流感期間各國封鎖邊境", "二〇〇三年 SARS 之後的國際合作"], "a": 1, "e": "黑死病時期地中海港市為阻止疫病上岸，要求疫區船隻停泊觀察，時間後來固定為四十日，義大利文的「四十」即是這個字的來源。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 1 章 疾病與醫療", "_u": "b4c1.html"}, {"t": "mc", "q": "下列關於金納牛痘接種的敘述，何者正確？", "o": ["他發現了天花病毒並加以培養", "他以牛痘使人獲得對天花的免疫力，開啟疫苗時代", "他證明天花是由瘴氣傳播", "他主張以放血治療天花"], "a": 1, "e": "金納並未看到病毒（病毒要到二十世紀才被觀察到），他是以經驗觀察加實驗，證明感染牛痘者可獲得對天花的保護力。vaccine 的字根即來自拉丁文的「牛」。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 1 章 疾病與醫療", "_u": "b4c1.html"}, {"t": "mc", "q": "一九一八年的流感大流行被稱為「西班牙流感」，主要原因是：", "o": ["病毒確實最早出現於西班牙", "西班牙的死亡率遠高於其他國家", "西班牙為中立國、新聞未受戰時審查，疫情報導最完整", "西班牙醫師最早分離出病原體"], "a": 2, "e": "參戰國基於士氣考量壓低疫情報導，中立的西班牙則大量報導，外界因此產生「疫情來自西班牙」的印象。這個名稱本身就是媒體與戰時審查交互作用的產物。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 1 章 疾病與醫療", "_u": "b4c1.html"}, {"t": "mc", "q": "史諾在一八五四年倫敦霍亂疫情中把病例標示在地圖上，這項工作最重要的意義是：", "o": ["首次以顯微鏡觀察到霍亂弧菌", "以病例的空間分布推論汙染來源，開創流行病學的分析方法", "證明瘴氣說完全正確", "促使英國立刻制定《公共衛生法》"], "a": 1, "e": "史諾當時並未看到病原體，他是以病例集中於某一水井的分布，推論水源才是傳播途徑。這種「用資料推論因果」的作法，是流行病學的核心方法。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 1 章 疾病與醫療", "_u": "b4c1.html"}, {"t": "mc", "q": "後藤新平主張依「生物學原則」治理臺灣，其具體意涵最接近下列何者？", "o": ["以生物學研究取代所有社會制度", "先調查臺灣既有習慣與條件，再據以設計制度，不強行移植日本體制", "只重視醫療衛生，不處理其他政務", "主張臺灣人生理上不適合現代制度"], "a": 1, "e": "後藤主張制度如同生物，必須適應環境才能存活，因此推動大規模舊慣調查後再訂政策。這使殖民統治更有效率，但目的仍是穩固日本的統治。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 1 章 疾病與醫療", "_u": "b4c1.html"}, {"t": "mc", "q": "下列關於殖民醫學的敘述，何者最為周延？", "o": ["殖民醫學純粹是人道救助，沒有統治目的", "殖民醫學毫無正面效果，只是壓迫手段", "殖民醫學同時具有維護殖民者健康、鞏固統治，以及改善當地醫療條件等多重作用", "殖民醫學只在非洲出現，亞洲並無此現象"], "a": 2, "e": "歷史評價需要同時看動機、手段與結果。熱帶醫學的發展確實與帝國需求密不可分，但它也留下醫院、醫學教育與防疫制度。關鍵在追問：誰得到好處、誰承擔代價。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 1 章 疾病與醫療", "_u": "b4c1.html"}, {"t": "tf", "q": "世界衛生組織於一九八〇年宣布根除的傳染病是天花。", "a": true, "e": "天花是目前唯一被人類徹底根除的人類傳染病，靠的是疫苗有效、病毒無動物宿主，以及長期的全球接種行動。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 1 章 疾病與醫療", "_u": "b4c1.html"}, {"t": "tf", "q": "細菌致病學說成立以前，歐洲主流認為疾病來自腐敗空氣所形成的「瘴氣」。", "a": true, "e": "瘴氣說雖然病因判斷錯誤，但它推動了清除汙物、興建下水道等措施，實際上確實降低了傳染病的傳播。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 1 章 疾病與醫療", "_u": "b4c1.html"}, {"t": "tf", "q": "臺灣的全民健康保險於一九九五年開辦，在此之前臺灣完全沒有任何醫療保險制度。", "a": false, "e": "在健保之前已有勞保、公保、農保等職業別保險，但涵蓋範圍有限，許多人未被納入。健保的突破是強制全民納保與單一保險人制度。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 1 章 疾病與醫療", "_u": "b4c1.html"}, {"t": "order", "q": "請把下列醫療與公共衛生史上的發展依時間先後排序：", "items": ["黑死病橫掃歐洲", "金納進行牛痘接種實驗", "史諾繪製倫敦霍亂地圖", "科赫發現結核桿菌", "世界衛生組織宣布天花根除"], "e": "1347–1351 黑死病 → 1796 牛痘接種 → 1854 霍亂地圖 → 1882 結核桿菌 → 1980 天花根除。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 1 章 疾病與醫療", "_u": "b4c1.html"}, {"t": "order", "q": "請把下列臺灣醫療衛生史的事件依時間先後排序：", "items": ["鼠疫傳入臺灣", "臺灣總督府醫學校設立", "世界衛生組織確認臺灣根除瘧疾", "全民健康保險開辦", "SARS 疫情爆發"], "e": "1896 鼠疫傳入 → 1899 醫學校設立 → 1965 根除瘧疾 → 1995 健保開辦 → 2003 SARS。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 1 章 疾病與醫療", "_u": "b4c1.html"}, {"t": "match", "q": "請把人物或制度與其相關內容配對：", "pairs": [["張仲景", "《傷寒雜病論》，奠定辨證論治"], ["蓋倫", "整理四體液說，影響歐洲醫學千餘年"], ["巴斯德", "推翻自然發生說，發展加熱殺菌與狂犬病疫苗"], ["科赫", "分離結核桿菌，提出病原判定原則"], ["李斯特", "提倡外科消毒，降低術後感染死亡率"], ["後藤新平", "依生物學原則治臺，推動衛生工程與公醫制度"]], "e": "注意區分「理論建構者」（蓋倫、張仲景）、「實驗確立者」（巴斯德、科赫）、「臨床應用者」（李斯特）與「制度推動者」（後藤新平）四種不同的貢獻類型。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 1 章 疾病與醫療", "_u": "b4c1.html"}, {"t": "fill", "q": "日治臺灣把受過現代醫學訓練的醫師派駐各地，兼辦診療、防疫與衛生調查，這項制度稱為 ______ 制度。", "a": ["公醫"], "e": "公醫是總督府深入基層掌握衛生狀況的觸角，既提供醫療服務，也是行政監控的一環。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 1 章 疾病與醫療", "_u": "b4c1.html"}, {"t": "fill", "q": "一九六五年，臺灣經世界衛生組織確認為 ______ 根除地區，這是戰後公共衛生最常被引用的成果。", "a": ["瘧疾"], "e": "這項成果結合了戰後的美援資源、殺蟲劑噴灑與全面血液篩檢投藥，是臺灣公共衛生史上最常被引用的案例。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 1 章 疾病與醫療", "_u": "b4c1.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "一九〇〇年前後，臺灣中部某地方官廳的衛生報告這樣寫著：本月查獲疑似病家三戶，患者即日移送隔離所，同居者留置觀察；病家什物一律焚燬，牆壁地面以藥水灑消，房屋兩棟因構造低窪、通風不良，經勘定後拆除，另給予補助金若干。報告末尾另記：近日民間傳言隔離所有去無回，故常有匿報情事，已飭保正逐戶查察，並曉諭病家焚燬什物得請領補助，以杜疑懼。", "subs": [{"q": "報告中「焚燬什物、拆除房屋並給予補助金」的作法，最能說明殖民地公共衛生的哪一項特徵？", "o": ["純粹以金錢補償取代防疫措施", "防疫由民間自發進行，官方僅提供補助", "防疫措施直接處分人民財產，再以補助降低反抗", "官方並無強制力，只能勸導民眾配合"], "a": 2, "e": "焚燬與拆除都是對私人財產的強制處分，補助金則是降低抗拒的配套。這正顯示公共衛生在殖民地是以行政強制力推動的治理技術。"}, {"q": "報告提到「民間傳言隔離所有去無回，故常有匿報情事」，這段記載最適合用來說明什麼？", "o": ["當時的隔離所確實會殺害病人", "被統治者對防疫措施存在恐懼與不信任，官方紀錄本身留下了抵抗的痕跡", "臺灣人完全不了解傳染病", "保正制度在防疫上毫無作用"], "a": 1, "e": "史料未證實傳言為真，但「匿報」這個行政困擾本身，就是民眾以日常方式抵抗的證據。閱讀官方文書時，這類「被抱怨的現象」往往最能反映被統治者的處境。"}], "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 1 章 疾病與醫療", "_u": "b4c1.html"}, {"t": "mc", "q": "歐洲金屬活字印刷術普及後，最直接且影響最深遠的社會後果是：", "o": ["立即消滅了文盲", "書籍成本大幅下降，有助於知識傳播、宗教改革與民族語言文學", "使拉丁文成為唯一的書寫語言", "讓教會完全掌控了所有出版品"], "a": 1, "e": "印刷術降低了複製成本，使論戰文字得以快速大量散布。宗教改革的主張能迅速傳遍德意志各邦，印刷是重要條件；同時方言印刷品也強化了民族語言意識。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 2 章 科技與社會", "_u": "b4c2.html"}, {"t": "mc", "q": "瓦特改良蒸汽機對工業革命最關鍵的影響是：", "o": ["使工廠不必再依賴水力，可設在煤礦與市場附近", "讓紡織品的品質大幅提升", "使英國不再需要進口原料", "讓工人可以縮短工時"], "a": 0, "e": "水力必須靠近河流，限制了工廠選址。蒸汽動力解除了這個限制，加上能轉換為旋轉運動，使機械化能擴散到更多產業與地區。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 2 章 科技與社會", "_u": "b4c2.html"}, {"t": "mc", "q": "十九世紀鐵路普及之後，各國陸續採用「標準時間」，其主要原因是：", "o": ["天文學研究的需要", "鐵路時刻表必須跨地區統一，地方時造成調度混亂", "宗教儀式需要統一時間", "電報必須使用同一時區才能運作"], "a": 1, "e": "在鐵路出現前，各城鎮依日照訂定自己的時間，彼此相差幾分鐘無妨；但列車跨越多地時，時刻表就需要共同基準。時間的統一是交通技術逼出來的社會制度。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 2 章 科技與社會", "_u": "b4c2.html"}, {"t": "mc", "q": "下列關於「第二次工業革命」的敘述，何者最為正確？", "o": ["以蒸汽與煤為核心動力", "以電力、石油、化工與鋼鐵為主，且科學研究直接導入生產", "主要發生在十八世紀的英國", "完全沒有改變勞動組織的方式"], "a": 1, "e": "第一次工業革命多由工匠依經驗改良機器；第二次工業革命則出現企業實驗室與專業研發，科學知識成為生產的直接來源，主導國家也擴及德國與美國。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 2 章 科技與社會", "_u": "b4c2.html"}, {"t": "mc", "q": "網際網路最初採用「封包交換」的設計，其核心考量是：", "o": ["讓網路能由單一中心統一管理", "把資料切成小封包分送，任一節點故障仍能繞道傳遞", "降低使用者的上網費用", "方便政府監控所有通訊內容"], "a": 1, "e": "去中心化的架構讓網路具有高度韌性，這個技術特性後來也深刻影響了資訊傳播的權力結構——訊息不再需要通過少數守門人。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 2 章 科技與社會", "_u": "b4c2.html"}, {"t": "mc", "q": "台積電所開創的「晶圓代工」模式，對全球半導體產業最重要的影響是：", "o": ["讓臺灣壟斷了所有晶片設計", "使企業可以專注於晶片設計而不必自建晶圓廠，催生大量無廠設計公司", "使積體電路的成本上升", "終結了摩爾定律"], "a": 1, "e": "在此之前，半導體公司必須同時設計與製造，門檻極高。代工模式把製造獨立出來，設計公司只要有好構想就能進入市場，整個產業的分工方式因此改變。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 2 章 科技與社會", "_u": "b4c2.html"}, {"t": "mc", "q": "討論人工智慧的「演算法偏見」時，下列理解何者最恰當？", "o": ["電腦只處理數字，因此結果必然客觀中立", "偏見可能來自訓練資料或設計選擇，使既有歧視被複製甚至放大", "偏見只會出現在影像辨識，不影響文字處理", "只要增加資料量，偏見就會自動消失"], "a": 1, "e": "演算法學習的是人類留下的資料，若資料本身反映歷史上的不平等，模型就會把它學起來。單純增加資料量不必然解決問題，還需要檢視資料來源與評估標準。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 2 章 科技與社會", "_u": "b4c2.html"}, {"t": "tf", "q": "指南針、火藥與印刷術三項技術都起源於中國，後來才傳入歐洲。", "a": true, "e": "三者均源於中國，經由蒙古西征、阿拉伯世界等途徑傳播。但它們在歐洲產生的社會效果，與當地的軍事競爭、宗教衝突與商業條件密切相關。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 2 章 科技與社會", "_u": "b4c2.html"}, {"t": "tf", "q": "英國的盧德運動是工人單純出於厭惡科技而破壞機器，與工資、失業並無關聯。", "a": false, "e": "盧德派攻擊的多半是取代熟練工、壓低工資的特定機器。其訴求核心是生計與勞動條件，把它化約為「反科技」會錯失重點。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 2 章 科技與社會", "_u": "b4c2.html"}, {"t": "tf", "q": "石油在十九世紀中葉最初被大量開採時，主要用途就是作為汽車燃料。", "a": false, "e": "早期石油主要提煉煤油作為照明之用。要到內燃機與汽車普及後，汽油才成為主要產品，石油的戰略地位也隨之上升。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 2 章 科技與社會", "_u": "b4c2.html"}, {"t": "order", "q": "請把下列技術發展依時間先後排序：", "items": ["瓦特取得蒸汽機改良專利", "利物浦至曼徹斯特鐵路通車", "貝爾取得電話專利", "電晶體問世", ", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 4 章 文明與環境", "_u": "b4c4.html"}, {"t": "fill", "q": "臺灣於二〇二三年公布《氣候變遷因應法》，明定 ______ 年達成淨零排放的目標。", "a": ["2050", "二〇五〇", "2050年"], "e": "這是把長期減碳目標法制化，並配套推動碳定價等經濟誘因工具，使減碳從政策宣示變成法律義務。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 4 章 文明與環境", "_u": "b4c4.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "某縣環保稽查紀錄摘要如下：民眾陳情指工業區夜間異味頻繁，經設站連續監測一個月，區內三處測站有兩處於凌晨時段數值明顯偏高，惟未超過現行法規管制標準。廠方表示已依法設置防制設備，並提出自主監測報告佐證。地方衛生單位另引述近三年門診統計，指該鄉呼吸道就診比率高於全縣平均，但研究者說明統計無法直接推論因果，尚須考量人口年齡結構、吸菸率與其他汙染來源。", "subs": [{"q": "根據材料，「監測數值偏高但未超過管制標準」這一點最能說明什麼？", "o": ["表示完全沒有汙染問題", "法規標準是人為訂定的門檻，合法不等於無害，標準是否合宜本身就是可討論的議題", "表示監測儀器故障", "表示陳情民眾在說謊"], "a": 1, "e": "管制標準是依當時的科學評估與政策考量訂出的界線。合乎標準只代表「未違法」，不等於「無風險」。標準該訂在哪裡，本身就是公共決策。"}, {"q": "研究者強調「統計無法直接推論因果，尚須考量人口年齡結構、吸菸率與其他汙染來源」，這段話的用意最接近：", "o": ["否定居民的健康受到影響", "提醒相關性不等於因果，需要排除其他可能的解釋變因", "主張不必再做任何研究", "認為門診統計完全沒有價值"], "a": 1, "e": "就診率偏高是值得追查的線索，但要建立因果，必須控制其他可能造成差異的因素。這正是環境爭議中「事實認定」如此困難的原因。"}], "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 4 章 文明與環境", "_u": "b4c4.html"}, {"t": "mc", "q": "埃及陵墓壁畫中人物比例依身分大小而定、姿態高度程式化，這個現象最能說明：", "o": ["當時的畫家技術不足", "作品的首要目的在服務信仰與身分秩序，而非追求視覺寫實", "埃及人視力有問題", "這些畫是兒童所作"], "a": 1, "e": "圖像的規範反映的是功能。既然目的是確保來世與彰顯地位，重要人物就必須畫得大、姿態必須合乎規範，寫實與否並非評價標準。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 5 章 藝術與人文", "_u": "b4c5.html"}, {"t": "mc", "q": "十七世紀荷蘭繪畫出現大量風景、靜物與風俗畫，且尺幅普遍不大，主要原因是：", "o": ["教會禁止繪製宗教題材以外的作品", "市民階層興起，繪畫進入公開市場，作品需適合懸掛於一般住家", "荷蘭缺乏大型畫布", "王室下令統一規格"], "a": 1, "e": "贊助結構改變了作品樣貌。當買家從教會與宮廷換成市民家庭，題材、尺寸與價格自然跟著調整，這是藝術史上市場影響創作的經典案例。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 5 章 藝術與人文", "_u": "b4c5.html"}, {"t": "mc", "q": "攝影術普及對十九世紀繪畫最重要的影響是：", "o": ["畫家全面改行從事攝影", "寫實記錄不再是繪畫的專屬價值，促使畫家轉向光影、形式與主觀經驗", "繪畫從此完全消失", "畫家被禁止畫肖像"], "a": 1, "e": "攝影搶走了「忠實記錄」這項功能，也搶走了肖像畫的市場。繪畫因此需要重新界定自身價值，印象派與其後的現代主義正是在這個壓力下展開。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 5 章 藝術與人文", "_u": "b4c5.html"}, {"t": "mc", "q": "班雅明所說的「靈光（aura）」在機械複製時代消散，其主要意涵是：", "o": ["複製品的印刷品質一定很差", "原作因與特定時空綁定而具有的獨一性，在大量複製下被削弱", "藝術從此不再有人欣賞", "複製技術使畫作褪色"], "a": 1, "e": "靈光指的是作品「此時此地」的獨一無二。複製讓圖像走進大眾生活，是民主化的一面；但作品與特定場所、儀式的連結也隨之鬆脫。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 5 章 藝術與人文", "_u": "b4c5.html"}, {"t": "mc", "q": "杜象把日常現成物送入展覽，其最主要的挑戰對象是：", "o": ["繪畫的技法訓練", "「藝術由誰認定、依據什麼制度認定」的問題", "美術館的建築設計", "顏料的化學成分"], "a": 1, "e": "現成物本身沒有技術可言，正因如此它逼出一個問題：讓一件物品成為藝術品的，究竟是製作者的手藝，還是展覽制度與觀看方式？", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 5 章 藝術與人文", "_u": "b4c5.html"}, {"t": "mc", "q": "下列關於一九二七年開辦的臺灣美術展覽會，何者敘述正確？", "o": ["只允許日本畫家參展", "首屆東洋畫部有三位年輕臺籍畫家入選、多位前輩落選，時稱「臺展三少年」", "展覽由臺灣民眾自行投票評選", "展出作品全為西洋古典名畫複製品"], "a": 1, "e": "臺展是島內最重要的發表舞臺，也是殖民體制下建立美術權威的制度。三位年輕人入選而前輩落選，正顯示新的評價標準取代了舊有的地方聲望。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 5 章 藝術與人文", "_u": "b4c5.html"}, {"t": "mc", "q": "一九七〇年代臺灣鄉土文學論戰的核心爭點是：", "o": ["應該使用文言文還是白話文", "文學是否應關注本土現實與社會階級，以及文學與政治的關係", "是否應該引進西方現代主義技巧以外的翻譯作品", "小說與新詩何者較有價值"], "a": 1, "e": "論戰發生在臺灣國際處境劇變之際，表面談文學路線，實際牽動的是文化認同與社會關懷的優先性，也預示了日後本土意識的高漲。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 5 章 藝術與人文", "_u": "b4c5.html"}, {"t": "tf", "q": "「為藝術而藝術」的觀念在人類歷史上大部分時期都是藝術創作的主流。", "a": false, "e": "這是十九世紀才逐漸成形的觀念。在此之前，圖像與器物多半服務於宗教、政治或紀念等明確用途，功能性是常態。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 5 章 藝術與人文", "_u": "b4c5.html"}, {"t": "tf", "q": "哥德式主教座堂以尖拱與飛扶壁把重量導向外部支柱，因而能開設大面積彩繪玻璃窗。", "a": true, "e": "結構技術直接決定了視覺效果。牆面不再負擔全部重量，窗戶才能加大，透入的光線也被賦予神聖意涵。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 5 章 藝術與人文", "_u": "b4c5.html"}, {"t": "tf", "q": "普普藝術取材自廣告與商品包裝，因此藝術評論界一致認為它是對消費社會的徹底批判。", "a": false, "e": "評價其實相當分歧。有人視為批判，也有人認為它只是複製並美化消費邏輯。遇到「一致認為」這種說法時，通常要提高警覺。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 5 章 藝術與人文", "_u": "b4c5.html"}, {"t": "order", "q": "請把下列藝術史上的發展依時間先後排序：", "items": ["法國成立皇家繪畫雕塑學院", "法國公布達蓋爾銀版攝影法", "印象派首次聯合展出", "立體派作品《亞維農的少女》問世", "畢卡索完成《格爾尼卡》"], "e": "1648 皇家學院 → 1839 攝影術 → 1874 印象派首展 → 1907 亞維農的少女 → 1937 格爾尼卡。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 5 章 藝術與人文", "_u": "b4c5.html"}, {"t": "order", "q": "請把臺灣藝文與文化資產相關的事件依時間先後排序：", "items": ["黃土水入選日本帝國美術展覽會", "臺灣美術展覽會開辦", "五月畫會、東方畫會舉行首展", "鄉土文學論戰", "《文化資產保存法》制定"], "e": "1920 黃土水入選帝展 → 1927 臺展開辦 → 1957 五月、東方畫會首展 → 1977–1978 鄉土文學論戰 → 1982 文資法制定。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 5 章 藝術與人文", "_u": "b4c5.html"}, {"t": "match", "q": "請把概念或事件與其內容配對：", "pairs": [["贊助制度", "教會、宮廷或富商出資委託，題材與規格常載於契約"], ["落選者沙龍", "官方展覽大量落選引發不滿而另設的展覽"], ["靈光", "原作因綁定特定時空而具備的獨一性"], ["現成物", "把日常物品置入藝術脈絡，質疑藝術的認定制度"], ["臺展三少年", "一九二七年入選臺展東洋畫部的三位年輕臺籍畫家"], ["社區總體營造", "由居民自主發掘與維護在地文化的政策取向"]], "e": "這六個詞可以串成一條線：藝術由誰出錢（贊助）、由誰認可（沙龍、現成物）、如何流通（靈光），以及在臺灣如何落地（臺展、社造）。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 5 章 藝術與人文", "_u": "b4c5.html"}, {"t": "fill", "q": "一八三九年法國公布的 ______ 銀版攝影法，使影像第一次能以機械方式忠實記錄眼前景物。", "a": ["達蓋爾"], "e": "這項技術很快衝擊肖像畫市場，也促使繪畫重新尋找自身不可取代的價值。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 5 章 藝術與人文", "_u": "b4c5.html"}, {"t": "fill", "q": "一九二〇年代臺灣新文學運動中，因作品關懷現實、提攜後進而被稱為「臺灣新文學之父」的作家是 ______ 。", "a": ["賴和"], "e": "他同時是執業醫師與作家，作品以白話文書寫底層處境，並主編報刊文藝欄，影響了整個世代的創作者。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 5 章 藝術與人文", "_u": "b4c5.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "一四七〇年代義大利某修會與畫師訂立的契約大致寫著：祭壇畫中央須繪聖母與聖嬰，左右各繪本會主保聖人一位；聖母外袍須用上等青金石研磨之藍，金箔不得以他色代之；畫師須親手繪製主要人物面容與雙手，其餘部分方得由助手為之；全畫須於次年復活節前交付，逾期每月扣減酬金若干。契約末另註：捐資者夫婦得繪於畫面下方一角，身量不逾聖人之半。", "subs": [{"q": "契約中詳細規定顏料材質、金箔使用與「畫師須親手繪製主要人物」，最能說明當時藝術創作的哪一項特徵？", "o": ["藝術家享有完全的創作自由", "作品是依契約製作的委託品，材料成本與工序都被明確約定", "當時尚未出現工作坊分工", "顏料價格對創作沒有影響"], "a": 1, "e": "在贊助制度下，作品的品質保證來自可驗證的條件：昂貴顏料的用量、金箔真偽、主要部位由誰執筆。這說明「作者性」在當時是以契約條款來界定的。"}, {"q": "契約允許捐資者夫婦入畫，但規定「身量不逾聖人之半」，這項安排最能反映：", "o": ["捐資者不希望被人認出", "宗教秩序仍優先於世俗名聲，但世俗贊助者已能在神聖畫面中取得一席之地", "畫師不擅長繪製人像", "當時的繪畫尚未掌握比例技法"], "a": 1, "e": "能入畫，代表贊助者的世俗地位獲得承認；但尺寸受限，又說明神聖秩序仍不容顛倒。一條看似瑣碎的規定，同時記錄了虔誠與聲望的協商。"}], "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 5 章 藝術與人文", "_u": "b4c5.html"}, {"t": "mc", "q": "歷史研究把帳簿、廣告、菜單與家用器物當成史料，最主要的價值在於：", "o": ["它們比官方文件更客觀正確", "能呈現正史較少記錄的群體與日常生活樣貌", "它們可以取代所有文字史料", "它們不需要經過任何考證"], "a": 1, "e": "這類材料讓婦女、兒童、勞工等在政治史中缺席的人現身。但它們同樣有立場與侷限，例如廣告呈現的是「被期待去嚮往的生活」，仍須交叉比對。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 6 章 文化與生活", "_u": "b4c6.html"}, {"t": "mc", "q": "近代歐洲制定「禁奢法」限制各階層可穿戴的布料與飾品，最能反映的社會狀況是：", "o": ["布料生產嚴重不足", "商業發展使財富流動，身分界線趨於模糊，統治階層感到焦慮", "民眾普遍不願意穿新衣", "教會禁止任何裝飾"], "a": 1, "e": "如果身分一眼可辨，就不需要立法規定。禁奢法之所以出現並反覆重申，正說明有錢的商人開始穿得像貴族，既有秩序受到挑戰。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 6 章 文化與生活", "_u": "b4c6.html"}, {"t": "mc", "q": "下列關於歐洲香料需求的說法，何者是缺乏根據的常見誤解？", "o": ["香料兼具調味、防腐與藥用意義", "香料貿易長期由中間商掌握，促使歐洲人尋找直達航路", "歐洲人主要用香料掩蓋腐肉的臭味", "香料價格在供給增加後逐漸下跌"], "a": 2, "e": "這個說法流傳極廣卻缺乏證據。香料在當時價格昂貴，買得起的人通常也買得起新鮮肉品；把昂貴香料用在壞掉的肉上並不合理。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 6 章 文化與生活", "_u": "b4c6.html"}, {"t": "mc", "q": "十七世紀之後歐洲咖啡館被視為重要的歷史場域，主要原因是：", "o": ["咖啡的營養價值遠高於其他飲料", "它提供了與酒館不同的社交空間，成為資訊交換與議論時事的場所", "咖啡館由政府直接經營", "只有貴族能進入咖啡館"], "a": 1, "e": "咖啡館裡有報紙、有陌生人交談、有商業消息流通，被許多研究者視為近代公共輿論形成的場域，保險與證券交易也在類似場所萌芽。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 6 章 文化與生活", "_u": "b4c6.html"}, {"t": "mc", "q": "十九世紀中葉巴黎的都市改造開闢寬闊林蔭大道，其考量不包括下列何者？", "o": ["改善通風與衛生條件", "便利交通與物資運輸", "不利於民眾築起街壘，有助維持治安", "降低城市的人口密度至農村水準"], "a": 3, "e": "改造的目的是讓城市更有效率、更易管理，而非讓它變成鄉村。這個案例也提醒我們：都市規劃從來同時是衛生工程、交通工程與治安工程。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 6 章 文化與生活", "_u": "b4c6.html"}, {"t": "mc", "q": "近代百貨公司採行「明碼標價、自由進出」的作法，對消費文化最重要的影響是：", "o": ["使商品價格大幅上漲", "購物從議價交易轉為可自由瀏覽的休閒活動", "使小型商店全部消失", "讓消費者不需要付錢"], "a": 1, "e": "在此之前買東西必須開口詢價並議價，進店即帶有購買壓力。標價與自由進出讓「只是看看」成為可能，逛街本身於是變成一種休閒。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 6 章 文化與生活", "_u": "b4c6.html"}, {"t": "mc", "q": "臺灣的珍珠奶茶被視為飲食全球化的有趣案例，最主要的原因是：", "o": ["它完全沒有受到任何外來影響", "它結合在地茶飲傳統與西式冷飲形式，後來又反向輸出成為國際流行", "它是由跨國企業在美國研發後引進臺灣", "它的原料全部進口自國外"], "a": 1, "e": "全球化不是單向覆蓋。外來元素在臺灣被重組成新產品，再向外輸出，說明在地社會同時是接收者與創造者。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 6 章 文化與生活", "_u": "b4c6.html"}, {"t": "tf", "q": "「通勤」之所以成為普遍的生活節奏，關鍵在於大眾運輸使居住地與工作地得以分離。", "a": true, "e": "在步行時代，住家與工作場所必須靠近。鐵路與都市大眾運輸出現後，人們才可能住在郊區而在市中心工作，城市的空間結構也隨之改變。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 6 章 文化與生活", "_u": "b4c6.html"}, {"t": "tf", "q": "世界博覽會的功能只是單純展示各國的工業產品，與國力展示或殖民地無關。", "a": false, "e": "博覽會同時展示工業成果、國家實力與殖民地物產，並塑造「進步」的敘事。它是理解十九世紀帝國主義與消費文化的重要場域。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 6 章 文化與生活", "_u": "b4c6.html"}, {"t": "tf", "q": "辣椒是中國、韓國、泰國等亞洲菜系自古以來就使用的本土作物。", "a": false, "e": "辣椒原產美洲，十六世紀以後才傳入亞洲。許多被視為「傳統」的味道，其實只有數百年歷史，這正是飲食史最有趣的地方。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 6 章 文化與生活", "_u": "b4c6.html"}, {"t": "order", "q": "請把下列日常生活史上的事件依時間先後排序：", "items": ["倫敦舉辦第一屆世界博覽會", "巴黎開始大規模都市改造", "英格蘭足球協會成立", "可口可樂在美國問世", "第一屆現代奧運在雅典舉行"], "e": "1851 倫敦世博 → 1853 巴黎改造開始 → 1863 足球協會 → 1886 可口可樂 → 1896 雅典奧運。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 6 章 文化與生活", "_u": "b4c6.html"}, {"t": "order", "q": "請把臺灣日常生活相關的事件依時間先後排序：", "items": ["嘉義農林棒球隊打進甲子園決賽", "臺北菊元百貨開幕", "臺灣電視公司開播", "中華職業棒球聯盟開打", "臺北捷運首條路線通車"], "e": "1931 嘉農打進甲子園 → 1932 菊元百貨 → 1962 臺視開播 → 1990 職棒開打 → 1996 捷運通車。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 6 章 文化與生活", "_u": "b4c6.html"}, {"t": "match", "q": "請把事物與其相關的歷史內容配對：", "pairs": [["香料", "中古歐洲的高價商品，促成尋找直達東方航路"], ["咖啡館", "十七世紀後的社交空間，被視為公共輿論的場域"], ["百貨公司", "以明碼標價與自由進出把購物變成休閒活動"], ["世界博覽會", "展示工業成果、國力與殖民地物產的國際活動"], ["市區改正", "日治臺灣拓寬道路、設置排水與公園的都市改造"], ["美援", "一九五〇年代輸入小麥奶粉，使麵食在臺普及"]], "e": "六個詞可分成兩組：前四項是全球性的現象，後兩項是它們在臺灣落地的具體形式，對照著看更能掌握本章重點。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 6 章 文化與生活", "_u": "b4c6.html"}, {"t": "fill", "q": "日治時期臺灣推動以拓寬道路、設置排水與公園為主的都市改造政策，稱為「市區 ______ 」。", "a": ["改正"], "e": "臺北因此拆除城牆改築三線道路，今日許多城市的主要街廓與公園位置，都可追溯到這個時期的規劃。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 6 章 文化與生活", "_u": "b4c6.html"}, {"t": "fill", "q": "一九八八年一月起，臺灣解除了限制報紙登記家數與張數的「______ 」，媒體環境大幅開放。", "a": ["報禁"], "e": "解除後報紙數量與言論尺度快速擴張，加上後來有線電視合法化，臺灣的媒體生態進入高度競爭的階段。", "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 6 章 文化與生活", "_u": "b4c6.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "一九六〇年代臺灣某報的整版廣告這樣寫著：「新式電鍋，一按即煮，太太從此不必守在灶前。省下來的兩小時，可以陪孩子讀書，也可以整理儀容迎接先生下班。」廣告右下角並附分期付款辦法：頭期款若干，其餘分十二期，「今日訂購，明日到府」。同版另有一則洗衣機廣告，標語為「現代家庭的第一步」，圖中婦人穿著洋裝，身旁站著穿制服的小學生，背景是一間磨石子地板的公寓客廳。", "subs": [{"q": "廣告強調「省下來的兩小時，可以陪孩子讀書，也可以整理儀容迎接先生下班」，最能反映當時的什麼觀念？", "o": ["家電使家務勞動完全消失", "省下的時間被預設仍應用於家庭，家務責任仍歸屬女性", "女性被鼓勵外出就業", "小孩應該負責家務"], "a": 1, "e": "家電確實減輕了勞動強度，但廣告替省下來的時間安排的用途，仍在家庭內部。這說明技術改變了工具，卻不必然改變性別分工的期待。"}, {"q": "廣告附上分期付款辦法，並以「現代家庭的第一步」為標語，最適合用來說明消費社會的哪一項特徵？", "o": ["商品價格便宜到人人都能一次付清", "信用制度使人能先享受後付款，商品同時被包裝成身分與生活方式的象徵", "家電在當時屬於政府配給品", "廣告與消費行為之間沒有關聯"], "a": 1, "e": "分期付款把消費建立在對未來收入的預期上；而「現代家庭的第一步」則把電器與理想身分綁在一起。兩者結合，正是消費社會運作的典型方式。"}], "_v": "b4", "_vn": "科技環境與藝術", "_c": "第 6 章 文化與生活", "_u": "b4c6.html"}, {"t": "mc", "q": "本課程最核心的學習目標是：", "o": ["背誦更多歷史年代與人名", "實際操作歷史研究的各個環節，理解歷史知識如何被產生", "熟記各國歷史地圖", "練習速讀教科書"], "a": 1, "e": "探究與實作的重點在方法與過程：親手走過選題、找史料、鑑別、分析與書寫，從而理解歷史知識的生產機制。", "_v": "b5", "_vn": "探究與實作", "_c": "緒論／導論 序　歷史學探究：為何探究", "_u": "b5c0.html"}, {"t": "mc", "q": "「歷史不是過去發生的事，而是後人依據證據對過去所做的解釋」。這句話的重點在強調：", "o": ["歷史都是假的", "歷史敘事必然涉及史料選擇與解釋，因此需要檢視其依據", "過去的事情不重要", "只有教科書的說法才算歷史"], "a": 1, "e": "承認解釋成分，不等於否認史實；重點是要求每一個解釋都必須交代它依據哪些證據。", "_v": "b5", "_vn": "探究與實作", "_c": "緒論／導論 序　歷史學探究：為何探究", "_u": "b5c0.html"}, {"t": "mc", "q": "閱讀任何歷史敘事時，最應優先追問的三個問題是：", "o": ["寫得長不長、好不好看、有沒有插圖", "誰寫的、根據什麼寫、為何而寫", "有沒有得獎、賣得好不好、是不是暢銷", "是不是課本、老師有沒有教、會不會考"], "a": 1, "e": "作者身分與立場、證據基礎、寫作目的，是判斷一份敘事可信度與侷限性的三個關鍵。", "_v": "b5", "_vn": "探究與實作", "_c": "緒論／導論 序　歷史學探究：為何探究", "_u": "b5c0.html"}, {"t": "tf", "q": "探究與實作的評分重點是結論有多創新，過程可以從簡。", "a": false, "e": "恰好相反。這門課重視的是研究過程與方法的嚴謹，結論只要有證據支持、推論合理即可。", "_v": "b5", "_vn": "探究與實作", "_c": "緒論／導論 序　歷史學探究：為何探究", "_u": "b5c0.html"}, {"t": "tf", "q": "引用他人研究時使用 APA 格式，主要目的是讓讀者能追溯查證你的依據。", "a": true, "e": "引註不是形式主義，而是學術誠信的基礎：它讓你的主張可被檢驗。", "_v": "b5", "_vn": "探究與實作", "_c": "緒論／導論 序　歷史學探究：為何探究", "_u": "b5c0.html"}, {"t": "order", "q": "請把研究流程依正確順序排列：", "items": ["形成問題意識與選題", "蒐集並鑑別史料", "界定關鍵概念", "建立大綱與因果脈絡", "撰寫並發表"], "e": "雖然實際研究常會來回修正，但基本流程是：選題 → 找史料 → 界定概念 → 建立架構 → 成文。", "_v": "b5", "_vn": "探究與實作", "_c": "緒論／導論 序　歷史學探究：為何探究", "_u": "b5c0.html"}, {"t": "fill", "q": "本課程所有引用一律採用 ______ 格式，以確保證據可被追溯查證。", "a": ["APA"], "e": "社會科學領域常用的書目與引註規範。", "_v": "b5", "_vn": "探究與實作", "_c": "緒論／導論 序　歷史學探究：為何探究", "_u": "b5c0.html"}, {"t": "mc", "q": "下列關於「過去」「史料」「歷史」三者的關係，何者正確？", "o": ["三者完全相同", "史料就是歷史，不需要解釋", "歷史是史家依據史料對過去提出的解釋", "過去可以被完整重現"], "a": ": "探究與實作", "_c": "第 2 章 選題", "_u": "b5c2.html"}, {"t": "tf", "q": "涉及在世者的訪談，應事先說明研究用途並取得同意。", "a": true, "e": "這是研究倫理的基本要求，也關係到資料能否公開使用。", "_v": "b5", "_vn": "探究與實作", "_c": "第 2 章 選題", "_u": "b5c2.html"}, {"t": "tf", "q": "只要題目夠有趣，就算找不到史料也可以先做再說。", "a": false, "e": "沒有史料就無法論證。可行性檢查不過關時，應盡早換題。", "_v": "b5", "_vn": "探究與實作", "_c": "第 2 章 選題", "_u": "b5c2.html"}, {"t": "order", "q": "請把選題流程依正確順序排列：", "items": ["列出好奇的方向", "用漏斗法縮小為具體提問", "進行史料可行性檢查", "寫出一句話的研究問題", "與老師和組員討論定案"], "e": "先發散、再收斂、再檢查可行性，最後定案。", "_v": "b5", "_vn": "探究與實作", "_c": "第 2 章 選題", "_u": "b5c2.html"}, {"t": "match", "q": "請把題目缺陷與類型配對：", "pairs": [["論中國歷史的興衰", "範圍太大"], ["談談戰爭的影響", "太過空泛"], ["如果甲午戰爭清朝獲勝會如何", "假設性問題無法驗證"], ["證明某政策完全錯誤", "立場先行"], ["整理某人生平", "缺乏問題意識"]], "e": "這五種是最常見的選題錯誤，動手前先自我檢查一遍。", "_v": "b5", "_vn": "探究與實作", "_c": "第 2 章 選題", "_u": "b5c2.html"}, {"t": "fill", "q": "研究者想弄清楚的具體疑問，稱為 ______，它決定了整篇論文的方向與取材。", "a": ["問題意識"], "e": "沒有問題意識的文章，只會變成資料彙整。", "_v": "b5", "_vn": "探究與實作", "_c": "第 2 章 選題", "_u": "b5c2.html"}, {"t": "read", "q": "素養題組：閱讀下列情境後作答。", "passage": "某小組原本想做「臺灣的環境運動史」，老師建議縮小範圍。他們改成「反五輕運動」，老師再問：要處理幾年？看哪些材料？於是他們最後定為：「1987 至 1990 年間，後勁地區居民反五輕運動中，地方報紙如何再現抗爭者的形象？」並列出預計使用的三份地方報紙、兩篇既有研究與一位可能受訪的地方人士。", "subs": [{"q": "這個修改過程最能說明選題的哪一個原則？", "o": ["題目越大越好", "由大到小逐層收斂，並同步確認史料", "題目應該保持模糊以保留彈性", "應該先寫完再決定題目"], "a": 1, "e": "這正是漏斗法：從大領域縮到具體時空與具體提問，每一步都對應到可取得的材料。"}, {"q": "最後定案的題目中，「地方報紙如何再現抗爭者的形象」這句話的作用是：", "o": ["純粹修飾，沒有實質意義", "界定研究的切入角度與所要分析的材料類型", "表示只能使用報紙一種史料", "表示研究者支持抗爭者"], "a": 1, "e": "它把研究對象從「事件本身」轉為「報導如何呈現事件」，同時也指明了主要分析的材料。"}], "_v": "b5", "_vn": "探究與實作", "_c": "第 2 章 選題", "_u": "b5c2.html"}, {"t": "mc", "q": "下列何者屬於一手史料？", "o": ["某位教授談論日治教育的專書", "高中歷史教科書", "1925 年《臺灣日日新報》的新聞報導", "一篇整理前人研究的回顧文章"], "a": 2, "e": "當時發行的報紙是同時代留下的材料，屬一手史料；其餘三者都是後人依據材料所做的敘述。", "_v": "b5", "_vn": "探究與實作", "_c": "第 3 章 史料在哪裡？怎麼鑑別？", "_u": "b5c3.html"}, {"t": "mc", "q": "「外部考證」主要在處理下列哪一個問題？", "o": ["內容說得對不對", "這份材料本身是不是真的、何時何人所作", "作者的文筆好不好", "這份材料有沒有人引用過"], "a": 1, "e": "外部考證處理來源、年代、作者與真偽；內容是否可信屬於內部
