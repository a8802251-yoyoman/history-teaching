<script>window.POOL=[{"t": "mc", "q": "研究 1930 年代臺灣農村的生活，下列何者最適合作為「一手史料」？", "o": ["2015 年出版的《臺灣農民運動史》專書", "1932 年某佃農與地主簽訂的租佃契約", "近年拍攝的日治時期農村紀錄片", "高中歷史教科書中的相關章節"], "a": 1, "e": "租佃契約是當時人直接產生的文件，屬一手史料。專書、紀錄片與教科書都是後人整理研究的成果，屬二手史料。", "_v": "b1", "_vn": "臺灣史", "_c": "緒論／導論 為什麼要學歷史", "_u": "b1c0.html"}, {"t": "mc", "q": "某生找到一本 1955 年出版的高中歷史課本，想研究「戰後初期的官方歷史觀」。就這個研究題目而言，這本課本的性質是：", "o": ["二手史料，因為課本都是後人編寫的", "一手史料，因為它本身就是當時官方史觀的直接產物", "不算史料，因為課本內容不可信", "實物史料，因為它是一本紙本書"], "a": 1, "e": "史料的一手／二手之分取決於研究問題。研究「戰後初期官方史觀」時，那個年代的課本正是該史觀的直接產物，屬一手史料。這說明分類是相對的。", "_v": "b1", "_vn": "臺灣史", "_c": "緒論／導論 為什麼要學歷史", "_u": "b1c0.html"}, {"t": "mc", "q": "荷蘭東印度公司的檔案詳細記載了對原住民族部落的征討與貿易利潤，卻幾乎沒有說明部落為何抵抗。這個現象最能說明什麼？", "o": ["原住民族當時並沒有抵抗的行動", "史料的產生受到書寫者的權力與立場影響", "荷蘭檔案完全不可信，應該全部捨棄", "原住民族社會沒有任何形式的記憶傳承"], "a": 1, "e": "能留下文字紀錄的通常是掌握資源與權力的一方，紀錄內容也服務於書寫者的需要。正確做法不是捨棄這份史料，而是意識到它的偏向，再用考古、口傳等其他材料補足。", "_v": "b1", "_vn": "臺灣史", "_c": "緒論／導論 為什麼要學歷史", "_u": "b1c0.html"}, {"t": "mc", "q": "有同學評論：「清代的羅漢腳很不長進，來臺灣不帶家人，難怪社會治安差。」這段話最明顯的問題是：", "o": ["以今律古，忽略了清代渡臺禁令限制攜眷的制度背景", "後見之明，因為知道結果才推論原因", "史料不足，因為清代沒有留下任何紀錄", "混淆了史實與史料的差別"], "a": 0, "e": "清初渡臺禁令明文限制移民攜帶家眷，男多女少是制度造成的結果，而非個人品行問題。用今天的道德標準評判而忽略當時制度，即「以今律古」。", "_v": "b1", "_vn": "臺灣史", "_c": "緒論／導論 為什麼要學歷史", "_u": "b1c0.html"}, {"t": "mc", "q": "下列關於「歷史解釋會改變」的敘述，何者最恰當？", "o": ["表示歷史學不可靠，所有說法都一樣好", "表示史實本身也可以任意否認", "新史料、新方法或新的社會關懷，都可能導致解釋更新", "只有政治力量可以改變歷史解釋"], "a": 2, "e": "史實有證據支持，不能任意否認；但對史實的因果分析與意義評價，會隨新史料出土、研究方法改進與社會關懷轉移而更新。解釋之間仍有優劣，取決於證據與推論品質。", "_v": "b1", "_vn": "臺灣史", "_c": "緒論／導論 為什麼要學歷史", "_u": "b1c0.html"}, {"t": "mc", "q": "若要以「臺灣為主體」的視角敘述十七世紀的臺灣史，下列寫法最符合的是：", "o": ["臺灣自古是中國東南沿海的屏障", "臺灣是荷蘭人東亞貿易網絡中的一個據點", "臺灣位於東亞海域交會處，原住民族社會在此與荷、西、日、漢等多方勢力反覆接觸", "臺灣是鄭成功反清復明的跳板"], "a": 2, "e": "前三個選項分別以中國、荷蘭、鄭氏政權為中心，把臺灣當成邊陲、據點或跳板。以臺灣為主體的寫法，會把島上原有的人群與多方接觸的過程放在敘述核心。", "_v": "b1", "_vn": "臺灣史", "_c": "緒論／導論 為什麼要學歷史", "_u": "b1c0.html"}, {"t": "mc", "q": "研究史前時代的臺灣，遭遇的最大困難是：", "o": ["當時的人口太少，沒有留下任何遺跡", "缺乏文字紀錄，只能靠考古遺物推論，解釋空間較大", "史料太多，無法一一閱讀", "史前時代不屬於歷史學的研究範圍"], "a": 1, "e": "史前時代依定義即無文字紀錄，研究須倚賴石器、陶片、獸骨與遺址結構等考古材料，只能推論生活樣貌，難以直接得知當時人的想法與名字。", "_v": "b1", "_vn": "臺灣史", "_c": "緒論／導論 為什麼要學歷史", "_u": "b1c0.html"}, {"t": "tf", "q": "口述歷史因為出自當事人之口，所以是最可靠、不需要查證的史料。", "a": false, "e": "口述史料能補足文字紀錄的空白，但記憶會隨時間變形，也可能受後來的說法影響，仍須與其他材料交叉比對。", "_v": "b1", "_vn": "臺灣史", "_c": "緒論／導論 為什麼要學歷史", "_u": "b1c0.html"}, {"t": "tf", "q": "外部考證處理的是「這份史料是不是真的」，內部考證處理的是「它說的內容可不可信」。", "a": true, "e": "外部考證檢驗年代、作者、版本、材質等真偽問題；內部考證則分析立場、動機與內容一致性。", "_v": "b1", "_vn": "臺灣史", "_c": "緒論／導論 為什麼要學歷史", "_u": "b1c0.html"}, {"t": "tf", "q": "歷史分期是客觀存在的事實，任何人做出來的分期都會完全相同。", "a": false, "e": "分期是研究者為了方便理解而做的切割，依政權、社會性質或經濟形態切分會得到不同結果，本身就是一種歷史解釋。", "_v": "b1", "_vn": "臺灣史", "_c": "緒論／導論 為什麼要學歷史", "_u": "b1c0.html"}, {"t": "order", "q": "請把下列臺灣史上的重大轉折依時間先後排序：", "items": ["荷蘭東印度公司進入大員", "清朝設置臺灣府", "《馬關條約》割讓臺灣", "二二八事件", "宣布解除戒嚴"], "e": "1624 荷蘭入大員 → 1684 清設臺灣府 → 1895 馬關條約 → 1947 二二八事件 → 1987 解嚴。這五個點可以當成全冊的時間骨架。", "_v": "b1", "_vn": "臺灣史", "_c": "緒論／導論 為什麼要學歷史", "_u": "b1c0.html"}, {"t": "order", "q": "請把一般的歷史探究步驟依合理順序排列：", "items": ["提出想探究的問題", "蒐集相關的一手與二手史料", "進行史料批判，判斷可信度", "比對多方材料，建立因果推論", "提出有證據支持的歷史解釋"], "e": "探究從問題出發，經蒐集、批判、比對，最後才形成解釋。跳過批判直接下結論，是常見的錯誤。", "_v": "b1", "_vn": "臺灣史", "_c": "緒論／導論 為什麼要學歷史", "_u": "b1c0.html"}, {"t": "match", "q": "請把史料類型與具體例子配對：", "pairs": [["官方檔案", "日治時期臺灣總督府的公文書"], ["私人文書", "清代移民與原住民地主簽訂的墾契"], ["圖像史料", "1930 年代臺北街景的老照片"], ["實物史料", "卑南遺址出土的玉器與石板棺"], ["口述史料", "白色恐怖受難者家屬的訪談錄音"], ["二手史料", "學者撰寫的臺灣民主化研究專書"]], "e": "注意前五項都是一手史料，只是形式不同；最後一項是後人研究的成果。判斷關鍵在「是不是當時直接產生的」。", "_v": "b1", "_vn": "臺灣史", "_c": "緒論／導論 為什麼要學歷史", "_u": "b1c0.html"}, {"t": "fill", "q": "對史料本身真偽的檢驗，例如查核年代、作者與版本是否相符，稱為 ______ 考證。", "a": ["外部"], "e": "外部考證處理真偽；內部考證處理內容是否可信。兩者缺一不可。", "_v": "b1", "_vn": "臺灣史", "_c": "緒論／導論 為什麼要學歷史", "_u": "b1c0.html"}, {"t": "fill", "q": "108 課綱必修歷史第一冊臺灣史分為四大主題，其中緒論對應的是「如何 ______ 過去」。", "a": ["認識"], "e": "主題A「如何認識過去」處理史料與歷史解釋，是其餘三大主題的方法基礎。", "_v": "b1", "_vn": "臺灣史", "_c": "緒論／導論 為什麼要學歷史", "_u": "b1c0.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "某高中生訪問九十歲的曾祖母，問她記不記得戰爭末期的事。曾祖母說：「那時常常躲空襲，米都被收走，家裡靠番薯籤過日子。日本老師對我們很好，可是不准說臺灣話。」學生回家後查閱地方志，發現該鄉鎮的戰時紀錄只有幾行字，記載徵調人力與糧食繳納數量，沒有提到語言政策；又找到一份當年的學校日誌，上面寫著全校師生「奉行國語常用，成績優良」。", "subs": [{"q": "這三份材料的關係，下列敘述何者最恰當？", "o": ["地方志最權威，另外兩份可以不必理會", "三份都是一手史料，且內容完全一致", "三份都能提供訊息，但各有侷限，應交叉比對", "曾祖母的說法是二手史料，可信度最低"], "a": 2, "e": "訪談、地方志與學校日誌都是史料，但各自受限於記憶、行政書寫格式與官方立場。正確做法是交叉比對，讓三者互相補足與檢驗。"}, {"q": "曾祖母說「日本老師對我們很好，可是不准說臺灣話」，與學校日誌記載「奉行國語常用，成績優良」相互對照，最能說明什麼？", "o": ["學校日誌造假，所以沒有參考價值", "同一政策從官方與個人角度看，會呈現完全不同的意義", "曾祖母記錯了，當時並沒有語言限制", "兩份材料矛盾，因此都不能採用"], "a": 1, "e": "日誌以行政績效的角度記錄推行成果，訪談則保留了政策施加在個人身上的感受。兩者並不矛盾，而是同一件事的不同面向，正好呈現歷史解釋為何會有差異。"}], "_v": "b1", "_vn": "臺灣史", "_c": "緒論／導論 為什麼要學歷史", "_u": "b1c0.html"}, {"t": "mc", "q": "荷蘭人在 1641 年開始召開地方會議，並授予各村社長老藤杖。這項措施對原住民族社會最深遠的影響是：", "o": ["促使各部落聯合起來反抗荷蘭", "使部落頭人的權威來源從部落內部轉為殖民政府的承認", "讓原住民族取得與荷蘭人平等的地位", "使各部落開始使用文字記錄歷史"], "a": 1, "e": "藤杖是荷蘭當局授予的權力象徵，荷蘭也可以撤換不合作的頭人。原本由部落內部產生的權威，因此被外來政權收編，這是殖民統治最關鍵的一步。", "_v": "b1", "_vn": "臺灣史", "_c": "第 1 章 原住民族與外來者的接觸", "_u": "b1c1.html"}, {"t": "mc", "q": "下列關於「左鎮人」的敘述，何者正確？", "o": ["是臺灣目前已知最早的人類化石，距今約三萬年", "經新方法重新定年後，年代大幅修正為距今約三千年", "屬於新石器時代大坌坑文化的代表", "出土於臺東八仙洞，與長濱文化同屬一群"], "a": 1, "e": "左鎮人早期被推測距今二、三萬年，但近年以更精確的方法重新定年，結果修正為距今約三千年左右，因此不再被視為臺灣最早的人類。這是史實隨新證據更新的典型例子。", "_v": "b1", "_vn": "臺灣史", "_c": "第 1 章 原住民族與外來者的接觸", "_u": "b1c1.html"}, {"t": "mc", "q": "十三行遺址出土唐宋銅錢、玻璃器與瑪瑙珠。這些發現最能證明什麼？", "o": ["十三行居民已經使用貨幣經濟", "臺灣在金屬器時代已與中國沿海及東南亞有貿易往來", "唐宋政府曾經統治臺灣北部", "十三行文化的居民來自中國大陸"], "a": 1, "e": "外來物品的出土只能證明有交換往來，不能直接推論統治關係、族群來源或貨幣制度。這題測驗的是「證據能支持到什麼程度」的推論分寸。", "_v": "b1", "_vn": "臺灣史", "_c": "第 1 章 原住民族與外來者的接觸", "_u": "b1c1.html"}, {"t": "mc", "q": "荷蘭實施贌社制度後，原住民族在交易上逐漸處於不利地位，主要原因是：", "o": ["原住民族不願意與漢人交易", "贌商取得獨家交易權，形成壟斷，部落缺乏其他選擇", "荷蘭政府禁止原住民族狩獵", "鹿群數量增加使鹿皮價格上漲"], "a": 1, "e": "贌社由商人競標取得對特定部落的獨家交易權，部落無法比價或另尋買主，交易條件因此由贌商片面決定，利潤大量流向商人與政府。", "_v": "b1", "_vn": "臺灣史", "_c": "第 1 章 原住民族與外來者的接觸", "_u": "b1c1.html"}, {"t": "mc", "q": "關於荷蘭與西班牙在臺灣的統治，下列比較何者正確？", "o": ["兩者都以全島統治為目標，並且都達成了", "西班牙據北臺灣、荷蘭據南臺灣，1642 年荷蘭驅逐西班牙人", "荷蘭先占雞籠，西班牙後占大員", "兩者都在 1662 年被鄭成功驅逐"], "a": 1, "e": "荷蘭 1624 年入大員（南），西班牙 1626 年占雞籠、1628 年占淡水（北），1642 年荷蘭出兵驅逐西班牙人。兩者皆未統治全島，且西班牙 1642 年即退出，並非 1662 年。", "_v": "b1", "_vn": "臺灣史", "_c": "第 1 章 原住民族與外來者的接觸", "_u": "b1c1.html"}, {"t": "mc", "q": "「南島語族」這個概念最正確的理解是：", "o": ["一個具有共同血緣的人種分類", "依語言親屬關係建立的分類，不等同於血緣或種族", "僅指臺灣原住民族的統稱", "由荷蘭傳教士所創的宗教分類"], "a": 1, "e": "南島語族是語言學依語言親屬關係所做的分類，涵蓋範圍極廣。語言相近不必然代表血緣相同，把語族直接當成種族是常見的誤解。", "_v": "b1", "_vn": "臺灣史", "_c": "第 1 章 原住民族與外來者的接觸", "_u": "b1c1.html"}, {"t": "mc", "q": "荷蘭傳教士以羅馬字拼寫新港語，最主要的直接目的是：", "o": ["幫助原住民族保存自己的文化", "便於傳教與教學，讓教義能以當地語言傳播", "替漢人移民提供識字教育", "作為對日本貿易的通商文字"], "a": 1, "e": "羅馬字拼寫的初衷是傳教與教育需要。不過制度施行的結果超出原意——這套文字後來被用於土地契約，成為研究西拉雅族的重要史料。", "_v": "b1", "_vn": "臺灣史", "_c": "第 1 章 原住民族與外來者的接觸", "_u": "b1c1.html"}, {"t": "tf", "q": "麻豆社事件發生於 1629 年，荷蘭人隨即在同年攻破麻豆社並簽訂《麻豆協約》。", "a": false, "e": "事件發生於 1629 年，但荷蘭直到 1635 年才聯合新港社出兵報復，同年簽訂《麻豆協約》，兩者相隔六年。", "_v": "b1", "_vn": "臺灣史", "_c": "第 1 章 原住民族與外來者的接觸", "_u": "b1c1.html"}, {"t": "tf", "q": "原住民族各部落彼此獨立、沒有統一政權，這個特點使外來者較容易採取分化策略。", "a": true, "e": "荷蘭人正是善用部落間既有的敵對關係，聯合新港社攻打麻豆社，以少數兵力控制大片區域。", "_v": "b1", "_vn": "臺灣史", "_c": "第 1 章 原住民族與外來者的接觸", "_u": "b1c1.html"}, {"t": "tf", "q": "目前中央政府認定的臺灣原住民族共有 16 族，其中包含西拉雅族。", "a": false, "e": "16 族中並不包含西拉雅族。西拉雅等平埔族群持續推動正名，部分已獲地方政府認定，但多數尚未取得中央的法定原住民族身分。", "_v": "b1", "_vn": "臺灣史", "_c": "第 1 章 原住民族與外來者的接觸", "_u": "b1c1.html"}, {"t": "order", "q": "請把下列臺灣史前文化依出現時間先後排序：", "items": ["長濱文化", "大坌坑文化", "卑南文化", "十三行文化"], "e": "長濱文化（舊石器晚期，約三萬年前）→ 大坌坑文化（新石器早期，約六、七千年前）→ 卑南文化（新石器中晚期）→ 十三行文化（金屬器時代，約二千年前）。", "_v": "b1", "_vn": "臺灣史", "_c": "第 1 章 原住民族與外來者的接觸", "_u": "b1c1.html"}, {"t": "order", "q": "請把荷西時期的事件依時間先後排序：", "items": ["荷蘭占領澎湖並築城", "荷蘭轉進大員興建熱蘭遮城", "西班牙占領雞籠社寮島", "荷蘭與麻豆社簽訂《麻豆協約》", "荷蘭驅逐西班牙人取得北臺灣"], "e": "1622 占澎湖 → 1624 轉進大員 → 1626 西班牙占雞籠 → 1635《麻豆協約》→ 1642 驅逐西班牙人。", "_v": "b1", "_vn": "臺灣史", "_c": "第 1 章 原住民族與外來者的接觸", "_u": "b1c1.html"}, {"t": "match", "q": "請把原住民族與其代表性的社會制度或祭儀配對：", "pairs": [["阿美族", "嚴密的年齡階級制度與豐年祭"], ["排灣族", "貴族與平民的階層社會、五年祭"], ["布農族", "以射耳祭祈求狩獵豐收"], ["達悟族", "以飛魚祭為核心的海洋生活"], ["賽夏族", "兩年一次的矮靈祭"], ["泰雅族", "以 gaya 祖訓規範維繫秩序"]], "e": "題目測驗的是各族社會組織與祭儀的對應。注意階層社會（排灣、魯凱）與年齡階級（阿美、卑南）是兩套不同的組織原理，不可混為一談。", "_v": "b1", "_vn": "臺灣史", "_c": "第 1 章 原住民族與外來者的接觸", "_u": "b1c1.html"}, {"t": "fill", "q": "1635 年麻豆社戰敗後與荷蘭簽訂 ______ ，確立部落臣屬於荷蘭東印度公司的關係。", "a": ["麻豆協約", "《麻豆協約》"], "e": "這份協約成為荷蘭與其他部落締約的範本，重點在政治臣屬關係的確立，而非土地買賣。", "_v": "b1", "_vn": "臺灣史", "_c": "第 1 章 原住民族與外來者的接觸", "_u": "b1c1.html"}, {"t": "fill", "q": "荷蘭自 1644 年起實施 ______ 制度，由商人競標取得與特定部落的獨家交易權。", "a": ["贌社"], "e": "贌社制度讓政府不必直接管理交易即可獲得穩定收入，代價則由被壟斷的部落承擔。", "_v": "b1", "_vn": "臺灣史", "_c": "第 1 章 原住民族與外來者的接觸", "_u": "b1c1.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "一份十七世紀中葉的公司報告這樣寫著：本季北路諸社長老共四十七人如期出席，於指定日集合，由長官逐一驗看藤杖並重新授予；其中兩社長老未到，經查係與鄰社爭獵場，已由長官當場裁決界線，令雙方立誓。會後依例致贈布匹與菸草。報告末尾另記：贌社標金本季較上季增加，惟鹿皮繳納數量下降，恐因獵取過度所致，宜加留意。", "subs": [{"q": "報告中「由長官逐一驗看藤杖並重新授予」的做法，最主要的作用是：", "o": ["確認藤杖沒有損壞，屬單純的器物保養", "反覆宣示頭人的權力來自殖民政府，鞏固統治的正當性", "讓長老們互相比較財富", "作為部落之間交換禮物的儀式"], "a": 1, "e": "每次會議重新授杖，等於定期提醒在場者：頭人的職位可以被授予，也可以被收回。這是把象徵物轉化為統治技術的典型手法。"}, {"q": "報告末尾提到「贌社標金增加，鹿皮繳納數量下降」，最可能反映的問題是：", "o": ["部落人口大幅成長，消費增加", "商人競標推高成本，加上過度獵捕使資源枯竭，交易體系已出現隱憂", "荷蘭政府決定停止鹿皮貿易", "原住民族改以農耕為主，不再狩獵"], "a": 1, "e": "標金上漲代表商人預期利潤，壓力最終轉嫁到部落；鹿皮下降則顯示鹿群因長期過度獵捕而減少。兩項數字同時出現，正指向這套體系難以長久維持。"}], "_v": "b1", "_vn": "臺灣史", "_c": "第 1 章 原住民族與外來者的接觸", "_u": "b1c1.html"}, {"t": "mc", "q": "清初實施渡臺禁令，其中「不得攜帶家眷」一項對臺灣社會造成的最直接影響是：", "o": ["漢人移民人數大幅減少，開墾停滯", "形成男多女少的人口結構，助長羅漢腳與械鬥問題", "促使移民全部改與漢人女性通婚", "使臺灣的科舉考試無法舉行"], "a": 1, "e": "禁令並未阻止移民（偷渡盛行），卻造成嚴重的性別失衡。單身男性缺乏家累與恆產，容易流動、聚眾，成為社會不安的來源，也促成漢人男性與平埔族女性通婚。", "_v": "b1", "_vn": "臺灣史", "_c": "第 2 章 漢人移民與多元族群社會", "_u": "b1c2.html"}, {"t": "mc", "q": "「有唐山公，無唐山媽」這句俗諺最能說明的歷史現象是：", "o": ["漢人移民大多是女性", "清代漢人男性多與本地平埔族女性通婚", "唐山地區沒有女性人口", "漢人禁止與原住民族往來"], "a": 1, "e": "渡臺禁令限制攜眷，來臺者以男性為主，許多人因此與平埔族女性結婚。這句俗諺正是族群混融的通俗表述，也提醒我們族譜只記錄了一半的來歷。", "_v": "b1", "_vn": "臺灣史", "_c": "第 2 章 漢人移民與多元族群社會", "_u": "b1c2.html"}, {"t": "mc", "q": "下列關於元代澎湖巡檢司的敘述，何者正確？", "o": ["管轄範圍包含澎湖與臺灣本島全境", "是中國王朝首次在澎湖設官，但範圍不及臺灣本島", "設立後一直延續到清朝", "由鄭芝龍奉命設置"], "a": 1, "e": "元代巡檢司僅及澎湖，明初即因海禁而廢除並徙民。用它證明當時臺灣本島已納入版圖，是常見的過度推論。", "_v": "b1", "_vn": "臺灣史", "_c": "第 2 章 漢人移民與多元族群社會", "_u": "b1c2.html"}, {"t": "mc", "q": "清廷在 1790 年設立屯番制度，主要背景與目的是：", "o": ["林爽文事件中熟番協助官方有功，遂徵調熟番守衛番界", "為了強迫原住民族改信漢人宗教", "為了開放漢人自由進入山區開墾", "為了廢除番大租制度"], "a": 0, "e": "林爽文事件（1786-1788）中熟番協助平亂，清廷因而設屯，徵調熟番為屯丁守界，並撥養贍埔地為報酬。這既是獎賞，也是以番制番、以番制漢的統治手法。", "_v": "b1", "_vn": "臺灣史", "_c": "第 2 章 漢人移民與多元族群社會", "_u": "b1c2.html"}, {"t": "mc", "q": "1853 年臺北發生頂下郊拚，其性質與一般的「漳泉拚」最大的不同是：", "o": ["它是官方主導的軍事行動", "它是泉州人內部（三邑人與同安人）的衝突", "它發生在原住民族部落之間", "它完全沒有造成人口遷移"], "a": 1, "e": "頂下郊拚是泉州人內部不同縣籍之間的械鬥，說明祖籍認同可以再細分。同安人戰敗後遷往大稻埕，反而使大稻埕在開港後成為茶葉貿易重鎮。", "_v": "b1", "_vn": "臺灣史", "_c": "第 2 章 漢人移民與多元族群社會", "_u": "b1c2.html"}, {"t": "mc", "q": "清代臺灣土地出現大租戶、小租戶與現耕佃農並存的「一田多主」結構，其形成的主要原因是：", "o": ["清廷規定土地必須由三人共有", "墾首請領墾照後招佃開墾，權利層層分割累積而成", "原住民族拒絕出售土地", "官府為增加稅收而刻意設計"], "a": 1, "e": "墾首取得墾照後招募佃戶實際開墾，佃戶再轉招耕作者，加上番大租等既有負擔，權利逐層疊加，形成多主共存的結構。這也是日治初期土地調查要處理的難題。", "_v": "b1", "_vn": "臺灣史", "_c": "第 2 章 漢人移民與多元族群社會", "_u": "b1c2.html"}, {"t": "mc", "q": "關於平埔族群在清代的處境，下列敘述何者最正確？", "o": ["因番大租制度的保障，土地未曾流失", "雖有番大租制度，仍因典賣、抵押與欺瞞而大量失去土地", "清廷從未設置任何隔離漢番的界線", "全數遷往山區與高山族群合併"], "a": 1, "e": "番大租制度在名義上保障原住民地權，但平埔族群多不熟悉契約與貨幣運作，加上通事舞弊，土地仍大量流失，部分族群因而集體遷往埔里或花東。", "_v": "b1", "_vn": "臺灣史", "_c": "第 2 章 漢人移民與多元族群社會", "_u": "b1c2.html"}, {"t": "tf", "q": "明初實施海禁之後，臺灣與中國沿海的往來完全斷絕。", "a": false, "e": "海禁並未斷絕往來，反而把貿易推入地下。臺灣與澎湖因位於官方控制之外，成為走私、避風與海上勢力活動的重要據點。", "_v": "b1", "_vn": "臺灣史", "_c": "第 2 章 漢人移民與多元族群社會", "_u": "b1c2.html"}, {"t": "tf", "q": "1796 年吳沙率眾入墾蛤仔難，衝擊了當地噶瑪蘭族的生活領域。", "a": true, "e": "吳沙率漳、泉、粵三籍移民進入今宜蘭地區，以武力與交涉並用的方式開墾，噶瑪蘭族因此大量失去土地，部分南遷花東。", "_v": "b1", "_vn": "臺灣史", "_c": "第 2 章 漢人移民與多元族群社會", "_u": "b1c2.html"}, {"t": "tf", "q": "戰後的「四大族群」說法能完整涵蓋今日臺灣所有的族群成員。", "a": false, "e": "四大族群是解嚴後為方便討論而生的簡化架構，既無法反映各群體內部差異，也未涵蓋一九九〇年代以後大量增加的新住民與移工。", "_v": "b1", "_vn": "臺灣史", "_c": "第 2 章 漢人移民與多元族群社會", "_u": "b1c2.html"}, {"t": "order", "q": "請把下列與漢人移民臺灣相關的事件依時間先後排序：", "items": ["元朝在澎湖設置巡檢司", "顏思齊率眾入臺招募漢人開墾", "清朝設臺灣府並頒布渡臺禁令", "吳沙率眾入墾蛤仔難", "沈葆楨奏請廢除渡臺禁令"], "e": "約 1281 澎湖巡檢司 → 1621 顏思齊入臺 → 1684 設府與渡臺禁令 → 1796 吳沙入墾宜蘭 → 1875 廢除渡臺禁令。", "_v": "b1", "_vn": "臺灣史", "_c": "第 2 章 漢人移民與多元族群社會", "_u": "b1c2.html"}, {"t": "order", "q": "請把臺灣族群結構的變化依時間先後排序：", "items": ["荷蘭招攬漢人來臺從事稻作與蔗作", "清代漢人移民大量湧入，形成移墾社會", "中華民國政府遷臺，外省族群形成", "政府開始引進外籍勞工", "東南亞婚姻移民大幅增加"], "e": "十七世紀荷治招墾 → 清代移墾社會 → 1949 前後外省移民 → 1989 引進外籍移工 → 一九九〇年代婚姻移民增加。", "_v": "b1", "_vn": "臺灣史", "_c": "第 2 章 漢人移民與多元族群社會", "_u": "b1c2.html"}, {"t": "match", "q": "請把名詞與其正確說明配對：", "pairs": [["墾首", "向官府請領墾照後招佃開墾的拓墾主持者"], ["通事", "官府、漢人與部落之間的中介者，掌收租且易舞弊"], ["番大租", "漢人承墾原住民族土地所繳納的地租"], ["土牛溝", "挖溝堆土形成的漢番隔離界線"], ["羅漢腳", "無家累、無恆產、四處遊走的單身男性移民"], ["義民", "民變或械鬥時協助官方作戰的地方武力"]], "e": "這六個名詞分屬「土地開發」「原漢關係」「社會型態」三組，配對時先判斷它指的是人、是制度還是地景，較不易混淆。", "_v": "b1", "_vn": "臺灣史", "_c": "第 2 章 漢人移民與多元族群社會", "_u": "b1c2.html"}, {"t": "fill", "q": "1790 年林爽文事件之後，清廷設立 ______ 制度，徵調熟番擔任屯丁守衛番界，並撥給養贍埔地。", "a": ["屯番"], "e": "屯番制度兼具獎賞與控制作用，也進一步把熟番編入清廷的邊防體系。", "_v": "b1", "_vn": "臺灣史", "_c": "第 2 章 漢人移民與多元族群社會", "_u": "b1c2.html"}, {"t": "fill", "q": "一九九〇年代以後，來自東南亞與中國大陸的婚姻移民及其家庭，今日通稱為 ______ 。", "a": ["新住民"], "e": "新住民與移工是當代臺灣族群圖像的新成員，其子女的語言文化也成為教育現場的重要課題。", "_v": "b1", "_vn": "臺灣史", "_c": "第 2 章 漢人移民與多元族群社會", "_u": "b1c2.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "道光年間，中部某社頭目與漢人墾戶立下一紙合約，內容大意是：本社因近年社眾稀少、田園多荒，願將界外埔地一所，交由墾戶招佃開墾，議定每年納社租穀二十石，永為定例，不得增減。合約另註明，若日後官府清查，由墾戶出面應付。數十年後，該社族人向官府陳情，指稱租穀已多年未繳，且土地早經墾戶轉賣他人，原契書亦不知去向。", "subs": [{"q": "這份合約中「每年納社租穀二十石，永為定例，不得增減」的約定，對原住民族最不利的地方在於：", "o": ["穀價與土地價值會隨時間變動，固定租額使實質收益不斷縮水", "官府不承認任何契約的效力", "漢人墾戶被禁止在界外開墾", "社眾必須親自耕作這塊土地"], "a": 0, "e": "定額租看似穩定，但長期而言物價與地價上漲，固定的二十石穀實質價值持續下降，而土地的增值全歸墾戶。這是番大租逐漸名存實亡的重要機制之一。"}, {"q": "族人陳情時指出「原契書亦不知去向」，這個細節最能反映的問題是：", "o": ["清代並未使用書面契約", "原住民族在文字與法律制度上處於劣勢，難以主張權利", "官府從未受理原住民族的陳情", "墾戶其實沒有取得土地"], "a": 1, "e": "契約以漢文書寫、由熟悉文書的一方保管，一旦文件散失，部落便缺乏證據。這正說明制度上的不對等如何把「合法交易」變成實質剝奪。"}], "_v": "b1", "_vn": "臺灣史", "_c": "第 2 章 漢人移民與多元族群社會", "_u": "b1c2.html"}, {"t": "mc", "q": "清朝初期治臺採取渡臺禁令、限制築城、班兵輪調與官員三年一任等措施。這些做法共同反映的統治思維是：", "o": ["積極開發臺灣的經濟資源", "防範臺灣再度成為反抗勢力的根據地", "希望迅速將臺灣建設為省", "鼓勵官民長期在臺定居"], "a": 1, "e": "這些措施的共同點都是「防」：防人口聚集、防據城反抗、防軍隊在地化、防官員與地方勢力結合。清初治臺以維持穩定為優先，而非積極經營。", "_v": "b1", "_vn": "臺灣史", "_c": "第 3 章 現代國家的形塑", "_u": "b1c3.html"}, {"t": "mc", "q": "牡丹社事件對清朝治臺政策最重要的影響是：", "o": ["促使清廷立即將臺灣建省", "暴露清廷對番地主權主張薄弱，促使政策由消極轉為積極", "使清廷決定放棄臺灣", "導致臺灣開港通商"], "a": 1, "e": "日本以清廷「番地無主」為由出兵，暴露了清廷對原住民族地區主權主張的空洞。此後清廷推動開山撫番、廢除禁令、增設府縣。建省要到 1885 年，開港則早在 1860 年代。", "_v": "b1", "_vn": "臺灣史", "_c": "第 3 章 現代國家的形塑", "_u": "b1c3.html"}, {"t": "mc", "q": "下列關於《六三法》的敘述，何者正確？", "o": ["它讓臺灣人取得選舉帝國議會議員的權利", "它授予臺灣總督發布律令的權力，使總督兼具立法功能", "它規定臺灣完全適用日本本國法律", "它是 1920 年地方制度改革的法源"], "a": 1, "e": "《六三法》是日本在臺特別統治的法源，讓總督可以發布具法律效力的律令。臺灣人始終未取得帝國議會的選舉權，這也是後來六三法撤廢運動與議會設置請願運動的背景。", "_v": "b1", "_vn": "臺灣史", "_c": "第 3 章 現代國家的形塑", "_u": "b1c3.html"}, {"t": "mc", "q": "1723 年清廷增設彰化縣與淡水廳，其直接的歷史背景是：", "o": ["朱一貴事件後的檢討，認為中北部治理力量不足", "林爽文事件後的獎賞措施", "牡丹社事件後的海防需要", "開港通商後的貿易管理需求"], "a": 0, "e": "1721 年朱一貴事件暴露中北部行政空白，清廷因此在 1723 年增設彰化縣與淡水廳。林爽文事件是 1786 年，牡丹社事件與開港都在十九世紀。", "_v": "b1", "_vn": "臺灣史", "_c": "第 3 章 現代國家的形塑", "_u": "b1c3.html"}, {"t": "mc", "q": "後藤新平主張依「生物學原則」治理臺灣，其具體做法最主要表現在：", "o": ["引進西方醫學研究臺灣人的生理特徵", "先徹底調查臺灣的舊有習慣與社會實況，再據以設計制度", "以生物學理論證明臺灣人不適合自治", "推廣農業品種改良"], "a": 1, "e": "生物學原則指的是施政應如研究生物一般先充分了解對象，因此總督府展開土地、林野、戶口與舊慣等大規模調查，再設計適合統治的制度。這是殖民統治「知識即權力」的典型。", "_v": "b1", "_vn": "臺灣史", "_c": "第 3 章 現代國家的形塑", "_u": "b1c3.html"}, {"t": "mc", "q": "1935 年臺灣首次舉行地方選舉，下列敘述何者正確？", "o": ["所有成年男女均可投票，名額全部民選", "名額半數民選、半數官派，且有性別、年齡與納稅額限制", "選出的是帝國議會議員", "選舉結果導致總督府解散"], "a": 1, "e": "1935 年的市會議員與街庄協議會員選舉，僅半數名額民選，另半數仍由官方指派；投票資格限一定年齡以上、繳納一定稅額的男子。這是有限的開放，而非普選。", "_v": "b1", "_vn": "臺灣史", "_c": "第 3 章 現代國家的形塑", "_u": "b1c3.html"}, {"t": "mc", "q": "金門、馬祖在戰後的治理狀況與臺灣本島最大的不同是：", "o": ["從未實施任何形式的地方選舉", "自 1956 年起實施戰地政務，軍管體制延續至 1992 年", "始終由中央政府直接派員統治，沒有縣的建制", "在 1949 年之前就已經實施地方自治"], "a": 1, "e": "金馬因位居軍事前線，實施戰地政務由軍方主導民政，直到 1992 年才終止，比臺灣本島 1987 年解嚴晚了五年。這也是理解「臺澎金馬如何成為一體」的關鍵差異。", "_v": "b1", "_vn": "臺灣史", "_c": "第 3 章 現代國家的形塑", "_u": "b1c3.html"}, {"t": "tf", "q": "鄭成功在臺灣設承天府與天興、萬年二縣，並將此地命名為「東寧」。", "a": false, "e": "鄭成功命名為「東都」；改稱「東寧」並將二縣升為州的是 1664 年的鄭經。這是常見的混淆點。", "_v": "b1", "_vn": "臺灣史", "_c": "第 3 章 現代國家的形塑", "_u": "b1c3.html"}, {"t": "tf", "q": "1885 年清廷下詔臺灣建省，但到 1887 年才正式與福建分治，首任巡撫是劉銘傳。", "a": true, "e": "建省詔令在 1885 年，實際完成分治在 1887 年。劉銘傳任內推動清賦、電報、鐵路與郵政等新政，1891 年去職後多項建設縮減。", "_v": "b1", "_vn": "臺灣史", "_c": "第 3 章 現代國家的形塑", "_u": "b1c3.html"}, {"t": "tf", "q": "1947 年二二八事件之後，臺灣省行政長官公署改組為臺灣省政府。", "a": true, "e": "行政長官公署因權力過於集中而備受批評，事件後於 1947 年改組為省政府，首任主席為魏道明。", "_v": "b1", "_vn": "臺灣史", "_c": "第 3 章 現代國家的形塑", "_u": "b1c3.html"}, {"t": "order", "q": "請把清代治臺的相關事件依時間先後排序：", "items": ["施琅擊敗鄭軍，清朝取得臺灣", "增設彰化縣與淡水廳", "林爽文事件爆發", "設置噶瑪蘭廳", "清廷下詔臺灣建省"], "e": "1683 施琅取臺 → 1723 增設彰化縣、淡水廳 → 1786 林爽文事件 → 1812 設噶瑪蘭廳 → 1885 下詔建省。", "_v": "b1", "_vn": "臺灣史", "_c": "第 3 章 現代國家的形塑", "_u": "b1c3.html"}, {"t": "order", "q": "請把下列事件依時間先後排序：", "items": ["琉球宮古島船民漂流至八瑤灣遇害", "日本出兵臺灣南部，牡丹社事件", "清法戰爭，法軍進攻基隆與滬尾", "《馬關條約》割讓臺灣", "《六三法》施行"], "e": "1871 船民遇害 → 1874 牡丹社事件 → 1884-1885 清法戰爭 → 1895 馬關條約 → 1896 六三法施行。", "_v": "b1", "_vn": "臺灣史", "_c": "第 3 章 現代國家的形塑", "_u": "b1c3.html"}, {"t": "match", "q": "請把人物與其主要事蹟配對：", "pairs": [["陳永華", "建議興建孔廟、設學校，推動鄭氏政權的文教制度"], ["施琅", "率水師於澎湖擊敗鄭軍，並上疏主張保留臺灣"], ["沈葆楨", "牡丹社事件後來臺，推動開山撫番、廢除渡臺禁令、增設臺北府"], ["劉銘傳", "首任臺灣巡撫，推動清賦、電報、鐵路與郵政"], ["樺山資紀", "首任臺灣總督"], ["後藤新平", "民政長官，主張生物學原則，推動保甲與土地調查"]], "e": "六人分屬鄭氏、清初、晚清與日治初期四個階段。判斷時先定位年代，再對應其代表政策，較不易張冠李戴。", "_v": "b1", "_vn": "臺灣史", "_c": "第 3 章 現代國家的形塑", "_u": "b1c3.html"}, {"t": "fill", "q": "1874 年牡丹社事件後，清日簽訂《北京專約》，清廷承認日本出兵為「______ 義舉」，等於間接承認琉球屬日。", "a": ["保民"], "e": "這四個字是關鍵：承認日本有權「保護」琉球人民，等於承認琉球是日本屬民，日本隨後於 1879 年正式將琉球併為沖繩縣。", "_v": "b1", "_vn": "臺灣史", "_c": "第 3 章 現代國家的形塑", "_u": "b1c3.html"}, {"t": "fill", "q": "1920 年臺灣地方制度改革後，全臺分為 ______ 州二廳，1926 年再增設澎湖廳。", "a": ["五", "5"], "e": "五州為臺北、新竹、臺中、臺南、高雄；二廳為臺東、花蓮港。這套區劃是今日縣市分布的重要基礎。", "_v": "b1", "_vn": "臺灣史", "_c": "第 3 章 現代國家的形塑", "_u": "b1c3.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "1896 年一位剛到任的日本官員在家書中寫道：此地人口眾多而戶籍不明，田地廣袤而地契混亂，一塊田常有三、四人各持文書自稱業主，官府欲課稅而不知向誰徵收。街庄之間械鬥舊習未除，官命難行。同僚建議，欲治此島，必先知此島：當先查其戶、其地、其俗，三事既明，然後法令可施，租稅可徵，兵警可布。", "subs": [{"q": "信中「一塊田常有三、四人各持文書自稱業主」所描述的現象，源自清代臺灣的哪一種土地結構？", "o": ["屯番制度", "一田多主（大租戶、小租戶與現耕佃農並存）", "番界與土牛溝的劃分", "班兵輪調制度"], "a": 1, "e": "清代拓墾由墾首請照、招佃層層轉手，加上番大租等既有負擔，形成多重權利並存的一田多主結構。日治初期土地調查的主要任務之一，就是釐清並簡化這套關係。"}, {"q": "「當先查其戶、其地、其俗」的主張，後來具體落實為總督府的哪些施政？", "o": ["戶口調查、土地調查與舊慣調查", "皇民化運動與改姓名運動", "議會設置請願運動", "實施地方自治與民選市會議員"], "a": 0, "e": "這正是後藤新平「生物學原則」的實踐：先以戶口、土地與舊慣三大調查掌握實況，再據以建立稅制、警察與保甲體系。皇民化是 1930 年代末的事，議會請願則是臺灣人發起的運動。"}], "_v": "b1", "_vn": "臺灣史", "_c": "第 3 章 現代國家的形塑", "_u": "b1c3.html"}, {"t": "mc", "q": "六三法撤廢運動與臺灣議會設置請願運動在訴求方向上的根本差異是：", "o": ["前者主張武裝抗日，後者主張和平請願", "前者要求臺灣適用日本本國法律以取得平等，後者主張臺灣特殊、應設議會自行立法", "前者由農民發起，後者由地主發起", "兩者訴求完全相同，只是時間先後不同"], "a": 1, "e": "撤廢六三法等於承認臺灣應與日本本土一體適用法律，屬「同化平等」路線；議會設置請願則承認臺灣的特殊性，要求設立專屬議會自行立法，屬「自治」路線。兩者的前提正好相反。", "_v": "b1", "_vn": "臺灣史", "_c": "第 4 章 追求自治與民主的軌跡", "_u": "b1c4.html"}, {"t": "mc", "q": "1923 年治警事件對臺灣議會設置請願運動造成的實際影響是：", "o": ["運動立即終止，再無後續", "參與者被捕入獄，反而使運動獲得更大的社會關注", "總督府因此同意設立臺灣議會", "運動轉為武裝抗爭"], "a": 1, "e": "總督府以違反治安警察法檢舉蔣渭水等人，審判過程受到媒體報導，使議會設置的主張傳播得更廣。請願運動持續到 1934 年，共進行 15 次。", "_v": "b1", "_vn": "臺灣史", "_c": "第 4 章 追求自治與民主的軌跡", "_u": "b1c4.html"}, {"t": "mc", "q": "1927 年臺灣文化協會分裂的主要原因是：", "o": ["總督府強制解散原有組織", "左右路線之爭：左派主張階級鬥爭，右派主張漸進改革", "成員對是否使用日語產生爭執", "經費不足無法繼續運作"], "a": 1, "e": "文協分裂反映一九二〇年代全球左右翼路線分歧。左派（連溫卿、王敏川等）掌握文協後稱新文協，右派則另組臺灣民眾黨，運動自此多元化。", "_v": "b1", "_vn": "臺灣史", "_c": "第 4 章 追求自治與民主的軌跡", "_u": "b1c4.html"}, {"t": "mc", "q": "下列關於臺灣民眾黨的敘述，何者正確？", "o": ["它是臺灣第一個近代政黨，由蔣渭水等人於 1927 年成立", "它是文化協會分裂後由左派另組的政黨", "它主張以武裝革命推翻總督府", "它一直運作到 1945 年戰爭結束"], "a": 0, "e": "臺灣民眾黨由文協分裂後的右派人士於 1927 年 7 月創立，是臺灣第一個近代政黨，主張民本政治與社會改革，1931 年遭總督府解散，同年蔣渭水病逝。", "_v": "b1", "_vn": "臺灣史", "_c": "第 4 章 追求自治與民主的軌跡", "_u": "b1c4.html"}, {"t": "mc", "q": "戒嚴時期反對人士只能以「黨外」名義參選，其制度原因是：", "o": ["當時法律規定候選人不得加入任何政黨", "戒嚴體制禁止組織新政黨，反對者無法成立自己的政黨", "選民不喜歡政黨政治", "地方選舉沒有政黨提名制度"], "a": 1, "e": "戒嚴體制下黨禁實施，無法合法組織新政黨，反對人士只好以「黨外」這個否定式的稱呼串連參選。直到 1986 年民進黨成立才突破黨禁。", "_v": "b1", "_vn": "臺灣史", "_c": "第 4 章 追求自治與民主的軌跡", "_u": "b1c4.html"}, {"t": "mc", "q": "1977 年中壢事件在戰後臺灣政治史上的意義是：", "o": ["戰後首次大規模街頭抗爭，顯示反對力量已具備群眾動員能力", "促使政府立即宣布解嚴", "使黨外人士在該次選舉中全面落敗", "導致《美麗島》雜誌被迫停刊"], "a": 0, "e": "中壢事件因縣長選舉作票爭議引發群眾包圍警局，是戰後首次大規模街頭抗爭。該次選舉黨外人士成績亮眼，反對運動由此進入新階段。解嚴則要到 1987 年。", "_v": "b1", "_vn": "臺灣史", "_c": "第 4 章 追求自治與民主的軌跡", "_u": "b1c4.html"}, {"t": "mc", "q": "下列關於臺灣民主化歷程的時序，何者正確？", "o": ["先解除戒嚴，再成立民主進步黨", "先成立民主進步黨，再解除戒嚴", "先總統直選，再國會全面改選", "先廢止臨時條款，再解除戒嚴"], "a": 1, "e": "民進黨成立於 1986 年 9 月 28 日，解嚴於 1987 年 7 月 15 日，因此是先組黨後解嚴（等於突破黨禁在先）。之後才有 1991 年廢止臨時條款、1992 年國會全面改選、1996 年總統直選。", "_v": "b1", "_vn": "臺灣史", "_c": "第 4 章 追求自治與民主的軌跡", "_u": "b1c4.html"}, {"t": "tf", "q": "臺灣議會設置請願運動從 1921 年持續到 1934 年，共進行 15 次，最終成功促使日本設立臺灣議會。", "a": false, "e": "次數與年代正確，但請願始終未獲日本帝國議會通過，臺灣議會並未設立。它的意義在於長期凝聚政治意識與培養運動人才。", "_v": "b1", "_vn": "臺灣史", "_c": "第 4 章 追求自治與民主的軌跡", "_u": "b1c4.html"}, {"t": "tf", "q": "白色恐怖的受害者僅限於本省籍人士。", "a": false, "e": "受害者遍及各族群與階層，包含本省人、外省人、原住民族與知識分子。把它化約為單一族群的遭遇，會扭曲歷史事實。", "_v": "b1", "_vn": "臺灣史", "_c": "第 4 章 追求自治與民主的軌跡", "_u": "b1c4.html"}, {"t": "tf", "q": "1992 年刑法第 100 條修正後，單純的言論與思想不再構成內亂罪。", "a": true, "e": "修法前的內亂罪可用於處罰主張，修正後須有強暴脅迫行為才構成，這是言論自由的重要里程碑。", "_v": "b1", "_vn": "臺灣史", "_c": "第 4 章 追求自治與民主的軌跡", "_u": "b1c4.html"}, {"t": "order", "q": "請把日治時期政治社會運動的發展依時間先後排序：", "items": ["臺灣同化會成立", "新民會成立、《臺灣青年》創刊", "臺灣文化協會成立", "治警事件", "臺灣民眾黨成立"], "e": "1914 同化會 → 1920 新民會與《臺灣青年》→ 1921 文化協會 → 1923 治警事件 → 1927 臺灣民眾黨。", "_v": "b1", "_vn": "臺灣史", "_c": "第 4 章 追求自治與民主的軌跡", "_u": "b1c4.html"}, {"t": "order", "q": "請把戰後民主化的重要事件依時間先後排序：", "items": ["美麗島事件", "民主進步黨成立", "宣布解除戒嚴", "終止動員戡亂時期", "首次總統直接民選"], "e": "1979 美麗島事件 → 1986 民進黨成立 → 1987 解嚴 → 1991 終止動員戡亂時期 → 1996 總統直選。", "_v": "b1", "_vn": "臺灣史", "_c": "第 4 章 追求自治與民主的軌跡", "_u": "b1c4.html"}, {"t": "match", "q": "請把人物或刊物與其相關的運動配對：", "pairs": [["林獻堂", "議會設置請願運動與臺灣地方自治聯盟的領導者"], ["蔣渭水", "臺灣文化協會專務理事、臺灣民眾黨創立者"], ["簡吉", "臺灣農民組合的主要發起人與農民運動領導人"], ["謝雪紅", "臺灣共產黨的重要領導人"], ["《臺灣民報》", "新民會系統的刊物，被稱為臺灣人唯一的言論機關"], ["《自由中國》", "一九五〇年代批評時政、主張民主憲政的雜誌"]], "e": "注意區分日治時期（前五項）與戰後（最後一項）的脈絡，以及同一時期內溫和、激進與左翼路線的不同代表人物。", "_v": "b1", "_vn": "臺灣史", "_c": "第 4 章 追求自治與民主的軌跡", "_u": "b1c4.html"}, {"t": "fill", "q": "1979 年 12 月 10 日世界人權日，《美麗島》雜誌社在 ______ 舉行遊行，與警方爆發衝突。", "a": ["高雄"], "e": "事件後多位參與者遭軍法審判，但公開審判反而使其政治主張廣為流傳，成為日後民主運動的重要資產。", "_v": "b1", "_vn": "臺灣史", "_c": "第 4 章 追求自治與民主的軌跡", "_u": "b1c4.html"}, {"t": "fill", "q": "1990 年三月，學生靜坐於中正紀念堂廣場，提出解散國民大會、廢除臨時條款等四大訴求，史稱 ______ 學運。", "a": ["野百合", "三月"], "e": "野百合學運直接促成李登輝召開國是會議，並在隔年終止動員戡亂時期、廢止臨時條款。", "_v": "b1", "_vn": "臺灣史", "_c": "第 4 章 追求自治與民主的軌跡", "_u": "b1c4.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "一份一九二〇年代的演講會紀錄這樣寫著：當晚聽眾逾千人，講者甫言及「本島人負擔重稅而無參政之權」，臨監警官即高聲喝令中止，講者遂改談衛生與識字之重要，聽眾仍鼓掌不止。記錄者在末尾註明：警官三度令中止，講者三度改題，散會時已近午夜，聽眾猶群聚門外議論。另一份總督府的內部報告則記載：該會名為文化，實則煽動民心，宜嚴加取締，惟驟然解散恐招物議。", "subs": [{"q": "從兩份材料可以推知，臺灣文化協會演講會的性質最接近下列何者？", "o": ["純粹的學術研討，與政治無關", "名義上是文化啟蒙，實際上兼具政治動員的功能", "由總督府主辦的政令宣導活動", "秘密進行的武裝起事準備會議"], "a": 1, "e": "文協自我定位為文化啟蒙團體，這讓它能合法活動；但演講內容觸及參政權與稅負，聽眾的反應也顯示政治意涵。總督府的報告正說明官方清楚這一點，卻顧忌輿論而不敢逕行解散。"}, {"q": "總督府報告稱「惟驟然解散恐招物議」，這句話最能反映當時統治的哪一種考量？", "o": ["總督府已經放棄對臺灣的控制", "一九二〇年代日本本土的民主風氣，使殖民當局在鎮壓時仍須顧慮輿論", "總督府擔心臺灣人發動武裝革命", "總督府打算讓臺灣人參與帝國議會選舉"], "a": 1, "e": "大正民主時期日本本土輿論相對開放，加上臺灣運動者善用媒體與日本友人，使總督府在取締時必須權衡代價。這正是體制內抗爭路線得以存在的空間。"}], "_v": "b1", "_vn": "臺灣史", "_c": "第 4 章 追求自治與民主的軌跡", "_u": "b1c4.html"}, {"t": "mc", "q": "十七世紀臺灣能成為東亞轉口貿易中繼站，最關鍵的條件是：", "o": ["臺灣本身擁有豐富的白銀與生絲", "明朝海禁與日本不得直接赴中國貿易，需要第三地轉手，而臺灣位置適中", "臺灣人口眾多，內需市場龐大", "臺灣已建立完善的港口與造船工業"], "a": 1, "e": "臺灣當時本身物產有限、人口不多，其價值來自地理位置——在明朝海禁與中日不得直接通商的結構下，成為雙方交易的中介地點。", "_v": "b1", "_vn": "臺灣史", "_c": "第 5 章 經濟活動與對外貿易", "_u": "b1c5.html"}, {"t": "mc", "q": "1628 年濱田彌兵衛事件的直接導火線是：", "o": ["荷蘭人對在大員貿易的日本商人課稅，日商拒絕接受", "日本幕府下令攻打臺灣", "荷蘭人禁止日本人信仰基督教", "新港社人攻擊日本商船"], "a": 0, "e": "荷蘭自 1625 年起向日商課稅，日商認為自己來臺更早不應納稅，加上 1627 年帶新港社人赴日獻土之爭，矛盾終於在 1628 年爆發。", "_v": "b1", "_vn": "臺灣史", "_c": "第 5 章 經濟活動與對外貿易", "_u": "b1c5.html"}, {"t": "mc", "q": "1633 年起日本頒布鎖國令，對臺灣貿易造成的影響是：", "o": ["臺灣的對外貿易完全中斷", "日本商人退出臺灣，荷蘭反而獨占對日貿易之利", "荷蘭被迫撤離臺灣", "臺灣改與西班牙貿易為主"], "a": 1, "e": "鎖國限制日本人出海，日商退出臺灣競爭；但荷蘭仍獲准在長崎通商，因此得以獨占中日之間的轉手貿易，獲利反而提高。", "_v": "b1", "_vn": "臺灣史", "_c": "第 5 章 經濟活動與對外貿易", "_u": "b1c5.html"}, {"t": "mc", "q": "清代臺灣的「郊」，其性質最接近下列何者？", "o": ["官府設立的稅收機構", "同業或同地商人組成的團體，兼營商業與地方公共事務", "佃農為抗租而組成的互助組織", "專門負責兩岸走私的秘密結社"], "a": 1, "e": "郊是商人自發組成的組織，如臺南三郊、鹿港八郊。除協調商務、統一行情外，也承擔修橋鋪路、賑災與廟務等地方公共角色，是清代地方社會的重要支柱。", "_v": "b1", "_vn": "臺灣史", "_c": "第 5 章 經濟活動與對外貿易", "_u": "b1c5.html"}, {"t": "mc", "q": "開港通商後，臺灣的經濟重心由南部北移，最主要的原因是：", "o": ["南部發生嚴重天災，農業崩潰", "茶與樟腦利潤高於糖，而其產地集中在中北部丘陵", "清廷下令禁止南部對外貿易", "外商只被允許在淡水設立洋行"], "a": 1, "e": "糖產於南部，茶與樟腦產於中北部丘陵。開港後茶與樟腦的利潤遠高於糖，資本與人口因而向北集中，大稻埕、艋舺、基隆興起，政治中心也隨之北移。", "_v": "b1", "_vn": "臺灣史", "_c": "第 5 章 經濟活動與對外貿易", "_u": "b1c5.html"}, {"t": "mc", "q": "1905 年製糖場取締規則劃定「原料採取區域」，對蔗農的直接影響是：", "o": ["蔗農可以自由選擇價格最高的會社出售甘蔗", "蔗農只能賣給指定會社，喪失議價空間", "蔗農獲得政府補助，收入大幅提高", "蔗農被禁止種植甘蔗，改種稻米"], "a": 1, "e": "原料採取區域使每個區域的甘蔗只能賣給指定會社，形成買方獨占。價格與磅秤皆由會社決定，因此有「第一憨，種甘蔗給會社磅」的俗諺，也埋下 1925 年二林蔗農事件的遠因。", "_v": "b1", "_vn": "臺灣史", "_c": "第 5 章 經濟活動與對外貿易", "_u": "b1c5.html"}, {"t": "mc", "q": "臺灣在一九六〇年代由進口替代轉向出口擴張，最主要的推力是：", "o": ["國內市場狹小、進口替代很快飽和，必須開拓外銷市場", "美援中止，政府被迫改變政策", "農業生產大量過剩，需要外銷", "加入世界貿易組織後被要求開放市場"], "a": 0, "e": "進口替代依賴國內市場，而臺灣市場規模有限，很快出現產能過剩。1960 年《獎勵投資條例》改以租稅優惠吸引投資、鼓勵外銷，1966 年高雄加工出口區則是具體的制度設計。", "_v": "b1", "_vn": "臺灣史", "_c": "第 5 章 經濟活動與對外貿易", "_u": "b1c5.html"}, {"t": "mc", "q": "下列哪一項「不」屬於十大建設？", "o": ["中山高速公路", "北迴鐵路", "新竹科學工業園區", "大煉鋼廠（中鋼）"], "a": 2, "e": "十大建設包含六項交通建設（高速公路、鐵路電氣化、北迴鐵路、桃園機場、臺中港、蘇澳港）與四項工業建設（中鋼、中船、石化工業、核能電廠）。新竹科學園區成立於 1980 年，屬後續的產業升級政策。", "_v": "b1", "_vn": "臺灣史", "_c": "第 5 章 經濟活動與對外貿易", "_u": "b1c5.html"}, {"t": "tf", "q": "荷治時期臺灣最主要的兩項本地出口商品是鹿皮與蔗糖。", "a": true, "e": "鹿皮主要銷往日本製作武具，蔗糖銷往日本、波斯與歐洲。兩者與轉口的中國生絲、瓷器共同構成荷蘭在臺的收益來源。", "_v": "b1", "_vn": "臺灣史", "_c": "第 5 章 經濟活動與對外貿易", "_u": "b1c5.html"}, {"t": "tf", "q": "嘉南大圳完工後，嘉南平原的農民可以全年隨意種植自己想種的作物。", "a": false, "e": "因水源有限，嘉南大圳採三年輪作給水制度，農民必須依官方規劃輪種稻、甘蔗與雜作，耕作自主性反而受到限制。", "_v": "b1", "_vn": "臺灣史", "_c": "第 5 章 經濟活動與對外貿易", "_u": "b1c5.html"}, {"t": "tf", "q": "一九三〇年代中期以後，日本對臺灣的經濟方針由「工業日本、農業臺灣」轉為「工業臺灣、農業南洋」。", "a": true, "e": "配合南進政策與戰爭需求，臺灣被賦予軍需工業基地的角色，1934 年日月潭水力發電完工提供了必要的電力條件。", "_v": "b1", "_vn": "臺灣史", "_c": "第 5 章 經濟活動與對外貿易", "_u": "b1c5.html"}, {"t": "order", "q": "請把臺灣對外貿易的發展依時間先後排序：", "items": ["荷蘭以大員為轉口貿易基地", "清廷開放鹿耳門對渡廈門", "臺灣開港通商，茶糖樟腦興起", "臺灣製糖株式會社成立", "高雄加工出口區成立"], "e": "1624 荷蘭入大員 → 1684 鹿耳門對渡廈門 → 1860 年代開港 → 1900 臺灣製糖會社 → 1966 高雄加工出口區。", "_v": "b1", "_vn": "臺灣史", "_c": "第 5 章 經濟活動與對外貿易", "_u": "b1c5.html"}, {"t": "order", "q": "請把戰後經濟政策依時間先後排序：", "items": ["幣制改革發行新臺幣、實施三七五減租", "實施耕者有其田", "公布《獎勵投資條例》", "推動十大建設", "新竹科學工業園區成立"], "e": "1949 幣制改革與三七五減租 → 1953 耕者有其田 → 1960 獎勵投資條例 → 一九七〇年代十大建設 → 1980 新竹科學園區。", "_v": "b1", "_vn": "臺灣史", "_c": "第 5 章 經濟活動與對外貿易", "_u": "b1c5.html"}, {"t": "match", "q": "請把時期與其代表性的出口商品配對：", "pairs": [["荷治時期", "鹿皮與蔗糖"], ["清代前期", "米與糖運往中國大陸"], ["清末開港後", "茶、糖、樟腦"], ["日治時期", "蔗糖與蓬萊米輸往日本"], ["一九六〇、七〇年代", "紡織成衣與電子零組件"], ["一九九〇年代以後", "半導體與資訊電子產品"]], "e": "這六組構成臺灣經濟史的主軸。留意每次轉變都伴隨市場對象的改變：中國大陸→日本→歐美→全球供應鏈。", "_v": "b1", "_vn": "臺灣史", "_c": "第 5 章 經濟活動與對外貿易", "_u": "b1c5.html"}, {"t": "fill", "q": "1905 年總督府以製糖場取締規則劃定 ______ 區域，規定蔗農只能將甘蔗賣給指定的製糖會社。", "a": ["原料採取"], "e": "這項規定形成買方獨占，是日治糖業高速發展的制度基礎，也是蔗農長期不滿的根源。", "_v": "b1", "_vn": "臺灣史", "_c": "第 5 章 經濟活動與對外貿易", "_u": "b1c5.html"}, {"t": "fill", "q": "1865 年英商杜德引進安溪茶苗，鼓勵農民種植並外銷美國；製茶產業使臺北的 ______ 聚集大量茶行與揀茶工人，成為北臺灣的經濟中心。", "a": ["大稻埕"], "e": "製茶需要大量揀茶與焙茶人力，茶行聚集使大稻埕迅速繁榮，也是臺灣經濟重心由南向北轉移的關鍵一步。", "_v": "b1", "_vn": "臺灣史", "_c": "第 5 章 經濟活動與對外貿易", "_u": "b1c5.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "一份一九二〇年代中部農村的訪問紀錄寫道：問其何以不種甘蔗？農人答曰，種蔗須三年方收，會社定價，秤亦在會社，年成好時價未必好，年成壞時更無話說。問何以不改種稻？答曰，此地水圳未及，看天田也。若圳水一到，自然人人種稻。訪員另記：本庄鄰近會社原料區，庄民多受雇為蔗工，工資按日計，農忙時每有爭工之事。", "subs": [{"q": "農人所說「會社定價，秤亦在會社」，反映的制度背景是：", "o": ["政府規定砂糖的統一零售價格", "原料採取區域制度使會社成為唯一買主，蔗農無議價空間", "蔗農自願與會社簽訂長期契約", "會社依國際糖價每日調整收購價"], "a": 1, "e": "1905 年的製糖場取締規則劃定原料採取區域，每區甘蔗只能賣給指定會社，形成買方獨占。價格與磅秤都由會社掌握，正是農民不滿的核心。"}, {"q": "「若圳水一到，自然人人種稻」這句話，最能預示下列哪一種現象？", "o": ["水利設施完工後將出現米糖爭地的「米糖相剋」", "農民將全面放棄農業轉入工廠", "甘蔗價格將因供給減少而大幅下跌並維持", "總督府將取消原料採取區域制度"], "a": 0, "e": "嘉南大圳等水利工程完工後，原本的看天田可改種水稻，農民自然傾向選擇收益較佳、週期較短的稻作，與蔗作爭奪土地與水源，形成米糖相剋。總督府因此以三年輪作給水等方式進行調配。"}], "_v": "b1", "_vn": "臺灣史", "_c": "第 5 章 經濟活動與對外貿易", "_u": "b1c5.html"}, {"t": "mc", "q": "透過調查某地區主祀神明的種類與分布，歷史學者最能推論出什麼？", "o": ["該地區的降雨量與農作物產量", "早期移民的祖籍來源與分布", "清廷在該地區的駐軍人數", "該地區的識字率高低"], "a": 1, "e": "不同祖籍群體帶來各自的守護神：漳州人拜開漳聖王、安溪人拜清水祖師、同安人拜保生大帝、潮州客家人拜三山國王。神明分布因此成為推論移民祖籍的重要線索。", "_v": "b1", "_vn": "臺灣史", "_c": "第 6 章 宗教發展與藝文活動", "_u": "b1c6.html"}, {"t": "mc", "q": "荷治時期荷蘭人以羅馬字拼寫西拉雅語，這項措施在臺灣文化史上的長遠影響是：", "o": ["使西拉雅語成為官方語言，沿用至清代", "荷蘭撤離後，羅馬字仍用於土地契約達一百多年", "促成臺灣普遍使用漢字書寫", "直接催生了十九世紀的白話字運動"], "a": 1, "e": "荷蘭撤離後教會組織瓦解，但羅馬字書寫方式留存在民間的土地契約中（即新港文書），一直沿用到十九世紀，成為研究西拉雅族的珍貴史料。", "_v": "b1", "_vn": "臺灣史", "_c": "第 6 章 宗教發展與藝文活動", "_u": "b1c6.html"}, {"t": "mc", "q": "十九世紀來臺的長老教會傳教士多採「醫療傳教」的策略，其主要原因是：", "o": ["傳教士都受過完整的醫學訓練，是政府規定", "醫療能取得地方社會的信任，降低傳教阻力", "清廷規定傳教士必須同時行醫", "臺灣當時完全沒有任何醫療行為"], "a": 1, "e": "漢人社會對外來宗教多有疑懼，醫療能提供具體幫助、建立信任，是打開傳教空間的有效方式。馬雅各、馬偕都是典型例子，教會醫院也成為臺灣現代醫療的重要起點。", "_v": "b1", "_vn": "臺灣史", "_c": "第 6 章 宗教發展與藝文活動", "_u": "b1c6.html"}, {"t": "mc", "q": "皇民化運動中的「正廳改善」，最直接衝擊的是：", "o": ["寺廟的建築外觀", "家庭內的祖先牌位與神像祭祀", "學校的課程安排", "街庄的行政區劃"], "a": 1, "e": "正廳改善要求家戶撤去祖先牌位與神像、改設神棚供奉日本神祇，直接侵入家庭祭祀的核心，是皇民化政策中最引起反感的措施之一。", "_v": "b1", "_vn": "臺灣史", "_c": "第 6 章 宗教發展與藝文活動", "_u": "b1c6.html"}, {"t": "mc", "q": "1924 年張我軍批判舊詩壇所引發的新舊文學論戰，其核心爭議是：", "o": ["應該使用日文還是漢文寫作", "應該以白話文還是文言文作為文學的書寫形式", "應該描寫都市還是農村", "應該由男性還是女性擔任作家"], "a": 1, "e": "新舊文學論戰的焦點是書寫形式：新文學陣營主張白話文能貼近現實與大眾，舊文學陣營則維護傳統詩文的價值。論戰後白話文逐漸取得主導地位。", "_v": "b1", "_vn": "臺灣史", "_c": "第 6 章 宗教發展與藝文活動", "_u": "b1c6.html"}, {"t": "mc", "q": "1927 年臺灣美術展覽會首屆東洋畫部由林玉山、陳進、郭雪湖入選，被稱為「臺展三少年」。這件事在當時引起關注的主要原因是：", "o": ["三人皆為留學歐洲的畫家", "三人年紀輕、無顯赫師承，卻擊敗許多資深傳統畫家", "三人皆為日本籍畫家", "臺展是由臺灣人自行舉辦的展覽"], "a": 1, "e": "三人當時都很年輕、也非傳統畫壇名家，入選結果讓許多資深水墨畫家落選，因而引發議論。這也象徵近代美術取向取代了傳統文人畫的評價標準。", "_v": "b1", "_vn": "臺灣史", "_c": "第 6 章 宗教發展與藝文活動", "_u": "b1c6.html"}, {"t": "mc", "q": "一九七〇年代鄉土文學論戰爆發的時代背景，下列何者最相關？", "o": ["臺灣退出聯合國、外交接連受挫，社會開始反思自身處境", "政府宣布解除戒嚴，言論全面開放", "臺灣加入世界貿易組織，農業受到衝擊", "日本殖民統治剛剛結束，語言尚未轉換完成"], "a": 0, "e": "一九七〇年代臺灣退出聯合國、與日美相繼斷交，國際處境惡化促使知識界重新思考「我們是誰、該關注什麼」，文學因此從現代主義的內心世界轉向本地土地與庶民生活。", "_v": "b1", "_vn": "臺灣史", "_c": "第 6 章 宗教發展與藝文活動", "_u": "b1c6.html"}, {"t": "mc", "q": "沈光文在臺灣文學史上的重要地位，主要建立在：", "o": ["他是第一位用白話文寫作的臺灣作家", "1685 年他與季麒光等人組成東吟社，是臺灣第一個詩社", "他創辦了臺灣第一份報紙", "他率先將荷蘭文獻翻譯成漢文"], "a": 1, "e": "沈光文為明遺民，因海上遇風漂流來臺，長期在臺講學行醫。1685 年與諸羅知縣季麒光等人組成東吟社，一般視為臺灣第一個詩社，他也被稱為「海東文獻初祖」。", "_v": "b1", "_vn": "臺灣史", "_c": "第 6 章 宗教發展與藝文活動", "_u": "b1c6.html"}, {"t": "tf", "q": "1859 年天主教道明會神父郭德剛自菲律賓來臺，在打狗一帶傳教，是天主教在臺灣重新發展的起點。", "a": true, "e": "荷西時期天主教曾短暫傳入北臺灣，但隨西班牙撤離而中斷。1859 年道明會再度來臺，高雄前金一帶因此成為臺灣天主教的重要發源地。", "_v": "b1", "_vn": "臺灣史", "_c": "第 6 章 宗教發展與藝文活動", "_u": "b1c6.html"}, {"t": "tf", "q": "《臺灣府城教會報》由馬偕於淡水創辦，是臺灣最早的報紙。", "a": false, "e": "《臺灣府城教會報》是 1885 年巴克禮在臺南創辦的，以白話字印行。馬偕在北部的主要貢獻是牛津學堂、淡水女學堂與醫療工作。", "_v": "b1", "_vn": "臺灣史", "_c": "第 6 章 宗教發展與藝文活動", "_u": "b1c6.html"}, {"t": "tf", "q": "一貫道在戒嚴時期曾長期被視為非法組織，直到 1987 年才取得合法地位。", "a": true, "e": "戒嚴時期宗教活動受到管制，一貫道被列為取締對象，信眾只能秘密聚會。解嚴前後政策鬆綁，1987 年取得合法地位後快速發展。", "_v": "b1", "_vn": "臺灣史", "_c": "第 6 章 宗教發展與藝文活動", "_u": "b1c6.html"}, {"t": "order", "q": "請把西方宗教在臺灣的發展依時間先後排序：", "items": ["荷蘭牧師甘治士來臺傳教", "荷蘭人在新港社設立學校", "道明會神父郭德剛在打狗傳教", "馬雅各抵臺南以醫療傳教", "巴克禮創辦《臺灣府城教會報》"], "e": "1627 甘治士來臺 → 1636 新港社設校 → 1859 郭德剛 → 1865 馬雅各 → 1885《臺灣府城教會報》。前兩項屬荷治第一波，後三項屬開港後的第二波。", "_v": "b1", "_vn": "臺灣史", "_c": "第 6 章 宗教發展與藝文活動", "_u": "b1c6.html"}, {"t": "order", "q": "請把臺灣文學與藝術的重要事件依時間先後排序：", "items": ["沈光文等人組成東吟社", "黃土水入選日本帝展", "張我軍引發新舊文學論戰", "臺灣文藝聯盟成立", "鄉土文學論戰爆發"], "e": "1685 東吟社 → 1920 黃土水入選帝展 → 1924 新舊文學論戰 → 1934 臺灣文藝聯盟 → 1977 鄉土文學論戰。", "_v": "b1", "_vn": "臺灣史", "_c": "第 6 章 宗教發展與藝文活動", "_u": "b1c6.html"}, {"t": "match", "q": "請把人物與其主要貢獻配對：", "pairs": [["沈光文", "與季麒光等人組東吟社，被稱為海東文獻初祖"], ["馬偕", "在淡水行醫並創辦牛津學堂與淡水女學堂"], ["巴克禮", "創辦臺南神學校與《臺灣府城教會報》"], ["賴和", "以小說描寫殖民統治下的不公，被譽為臺灣新文學之父"], ["黃土水", "首位入選日本帝展的臺灣人，代表作〈水牛群像〉"], ["鄧雨賢", "創作〈望春風〉〈雨夜花〉等流行歌曲"]], "e": "六人分屬清初、開港後與日治三個階段。配對時先判斷是宗教、文學還是藝術領域，再對應年代，較不易混淆。", "_v": "b1", "_vn": "臺灣史", "_c": "第 6 章 宗教發展與藝文活動", "_u": "b1c6.html"}, {"t": "fill", "q": "以某座主廟為中心、共同出資祭祀的地域範圍稱為 ______ ，是理解清代地方社會整合的重要概念。", "a": ["祭祀圈"], "e": "祭祀圈的範圍往往與水利、市集與防衛範圍重疊，反映出廟宇在地方社會中的整合功能。", "_v": "b1", "_vn": "臺灣史", "_c": "第 6 章 宗教發展與藝文活動", "_u": "b1c6.html"}, {"t": "fill", "q": "1930 年黃石輝主張以臺灣話進行創作，引發了 ______ 論戰，觸及書寫語言與文化認同的問題。", "a": ["臺灣話文", "鄉土文學"], "e": "這場論戰與 1924 年的新舊文學論戰不同：前者爭論文言或白話，後者爭論用哪一種白話（中國白話文或臺灣話文）。", "_v": "b1", "_vn": "臺灣史", "_c": "第 6 章 宗教發展與藝文活動", "_u": "b1c6.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "一九三〇年代末，某庄的耆老在多年後回憶：那時保正來通知，庄裡三間廟要併成一間，神像集中處理，正廳也要換神棚。我阿爸表面答應，夜裡把土地公偷偷包起來，藏在米甕底下，過年還是照拜，只是不敢放鞭炮。庄裡的戲班改演日本故事，但散戲後幾個老師傅還是在廟埕邊唱幾段舊曲，聽的人不多，也沒人敢大聲。", "subs": [{"q": "材料中「三間廟要併成一間，神像集中處理」所反映的政策是：", "o": ["清代的祭祀圈整併", "日治初期的宗教調查", "皇民化時期的寺廟整理運動", "戰後的宗教團體登記"], "a": 2, "e": "一九三〇年代末皇民化運動推行寺廟整理，各地大量廢併寺廟、集中或焚毀神像，並配合正廳改善要求家戶改設神棚。時間點與具體作法都與材料吻合。"}, {"q": "耆老描述家人「表面答應，夜裡把土地公藏起來」，這個細節對理解皇民化運動最重要的意義是：", "o": ["證明皇民化運動完全沒有推行", "說明政策在形式上被執行，但民間仍以隱蔽方式延續傳統，成效因人而異", "顯示總督府其實允許民眾私下祭祀", "表示庄民已經完全接受日本信仰"], "a": 1, "e": "官方紀錄只能呈現政策「執行了多少」，這類口述才能呈現「執行到什麼程度」。表面順從與私下延續並存，正說明評估文化政策的成效不能只看官方數據。"}], "_v": "b1", "_vn": "臺灣史", "_c": "第 6 章 宗教發展與藝文活動", "_u": "b1c6.html"}, {"t": "mc", "q": "歷史學者之所以把中國、朝鮮、日本、越南放在一起，稱為「東亞」這個歷史區域，最主要的理由是：", "o": ["這些地方在地理上完全相連，自然形成一體", "這些地方長期共享漢字、儒學、律令與佛教等制度與文化資源", "這些地方在歷史上一直由同一個政權統治", "這些地方的語言同屬一個語族，可以互相溝通"], "a": 1, "e": "東亞不是自然地理單位，日本與中國之間隔著海、越南與朝鮮相距極遠。把它們視為一個區域，是因為長期共享漢字、儒學、律令與佛教等要素，並因此產生密集的互動。四地語言分屬不同語系，也從未由同一政權統治。", "_v": "b2", "_vn": "中國與東亞史", "_c": "緒論／導論 東亞：一個被歷史連起來的區域", "_u": "b2c0.html"}, {"t": "mc", "q": "下列關於「厚往薄來」的敘述，何者最正確？", "o": ["指朝貢國送來的貢品價值遠高於中國的回賜", "指中國回賜的價值通常高於貢品，藉此展現天朝氣度", "指中國向朝貢國徵收高額關稅", "指朝貢國必須向中國繳納固定的年貢稅金"], "a": 1, "e": "厚往薄來是中國王朝在朝貢場合的慣例：回賜價值高於貢品，重點在政治象徵而非經濟收益。也正因為有利可圖，周邊政權與商人才有誘因參與朝貢，甚至出現冒名入貢的情形。", "_v": "b2", "_vn": "中國與東亞史", "_c": "緒論／導論 東亞：一個被歷史連起來的區域", "_u": "b2c0.html"}, {"t": "mc", "q": "明朝發給朝貢國「勘合」憑證，其主要用意是：", "o": ["作為朝貢國必須繳納的稅單", "管制入貢的船隻與次數，並辨識真偽、防範冒充", "證明朝貢國已經接受中國的宗教", "作為朝貢國之間互相貿易的貨幣"], "a": 1, "e": "勘合是一種比對用的憑證，來船必須持有並核對無誤才准入貢。明朝藉此限制朝貢的次數與規模，也用來分辨正式使節與假冒者，與防範倭寇的政策相互配合。", "_v": "b2", "_vn": "中國與東亞史", "_c": "緒論／導論 東亞：一個被歷史連起來的區域", "_u": "b2c0.html"}, {"t": "mc", "q": "朝鮮、日本與越南都曾出現「小中華」的說法。這個現象最能說明什麼？", "o": ["這些國家已經被中國王朝直接統治", "「中華」是一套可被各方挪用的文化資本，不必然專屬於中國王朝", "這些國家放棄了自己的語言與文字", "中國皇帝正式冊封他們為「中華」"], "a": 1, "e": "小中華的說法多出現在明亡以後，主張真正的中華禮樂文化保存在自己這裡。這表示「中華」被理解為一種文化標準，誰做得好誰就有資格繼承，而不是某個王朝的專利。", "_v": "b2", "_vn": "中國與東亞史", "_c": "緒論／導論 東亞：一個被歷史連起來的區域", "_u": "b2c0.html"}, {"t": "mc", "q": "日本雖然大量引進唐代的律令制度，卻沒有真正實施科舉。這個對照最能提醒我們：", "o": ["日本並未接觸過中國文化", "制度的傳播是選擇性的，各地會依自身的社會條件取捨與改造", "唐代其實沒有科舉制度", "律令與科舉在中國是互相排斥的兩套制度"], "a": 1, "e": "日本引進律令後，官位仍主要由貴族世襲，考試選才難以生根。這說明接受外來制度從來不是全盤照抄，而是與本地既有的權力結構協商後的結果。", "_v": "b2", "_vn": "中國與東亞史", "_c": "緒論／導論 東亞：一個被歷史連起來的區域", "_u": "b2c0.html"}, {"t": "mc", "q": "《訓民正音》的頒布，最直接的意義是：", "o": ["朝鮮從此完全廢止漢字與漢文", "朝鮮出現一套表音文字，使不通漢文的人也能書寫", "朝鮮脫離了與中國的朝貢關係", "朝鮮開始使用拉丁字母拼寫本國語言"], "a": 1, "e": "《訓民正音》提供了記錄本國語言的表音文字，讓書寫不再必須依賴漢字。但士大夫階層長期仍以漢文為正式文體，漢字並未立刻退場，改用拉丁字母拼寫的是越南而非朝鮮。", "_v": "b2", "_vn": "中國與東亞史", "_c": "緒論／導論 東亞：一個被歷史連起來的區域", "_u": "b2c0.html"}, {"t": "mc", "q": "某位朝鮮使節在北京與一位日本學者見面，兩人語言不通，卻能整晚交換對經書的看法。最合理的解釋是：", "o": ["兩人都會說當時的北京官話", "兩人以漢字書寫「筆談」，透過共同的書面語溝通", "兩人都學過拉丁文", "兩人透過手勢完成了全部討論"], "a": 1, "e": "漢文是東亞共通的書面語，讀音各地不同但字義相通。知識分子因此能以筆談交換意見，這是漢字文化圈最具體的實際作用之一。", "_v": "b2", "_vn": "中國與東亞史", "_c": "緒論／導論 東亞：一個被歷史連起來的區域", "_u": "b2c0.html"}, {"t": "tf", "q": "朝貢體系中，中國王朝通常會派官員直接治理朝貢國，並向其人民徵稅。", "a": false, "e": "朝貢的上下關係主要是儀式性與象徵性的。中國一般不派官治理、不徵稅、也不干涉內政，這與近代殖民統治的性質完全不同。", "_v": "b2", "_vn": "中國與東亞史", "_c": "緒論／導論 東亞：一個被歷史連起來的區域", "_u": "b2c0.html"}, {"t": "tf", "q": "「東亞」是歷史學者為研究方便而界定的區域概念，古人並不會自認為「東亞人」。", "a": true, "e": "區域是被研究者劃出來的分析工具。歷史上的人有國、有鄉、有族群認同，但不會用「東亞」來描述自己。", "_v": "b2", "_vn": "中國與東亞史", "_c": "緒論／導論 東亞：一個被歷史連起來的區域", "_u": "b2c0.html"}, {"t": "tf", "q": "越南在歷史上對中國稱臣朝貢，因此在國內也一律只使用「王」的稱號，不敢稱帝。", "a": false, "e": "越南長期採取「對外稱王、對內稱帝」的雙軌做法：向中國朝貢時接受王號，在國內則使用皇帝稱號與自己的年號。這正好說明朝貢是外交儀式，不等於內政從屬。", "_v": "b2", "_vn": "中國與東亞史", "_c": "緒論／導論 東亞：一個被歷史連起來的區域", "_u": "b2c0.html"}, {"t": "order", "q": "請把下列東亞交流史上的事件依時間先後排序：", "items": ["漢武帝滅衛氏朝鮮設郡", "日本首次派出遣唐使", "高麗引進科舉", "朝鮮世宗頒布《訓民正音》", "《馬關條約》簽訂"], "e": "前 108 漢設郡 → 630 首次遣唐使 → 958 高麗開科 → 1446 訓民正音 → 1895 馬關條約。這五點大致標示出東亞秩序從形成到解體的長程曲線。", "_v": "b2", "_vn": "中國與東亞史", "_c": "緒論／導論 東亞：一個被歷史連起來的區域", "_u": "b2c0.html"}, {"t": "order", "q": "請把「一次朝貢往來」的流程依合理順序排列：", "items": ["周邊政權派遣使節，備妥方物與奉表文書", "使節持勘合等憑證抵達指定口岸，接受查驗", "使節入京行朝見之禮，呈上貢品", "皇帝下詔冊封並回賜物品、頒予曆書", "使節團在京城與沿途進行採買與貿易"], "e": "朝貢是一整套流程：出發、查驗、朝見、冊封回賜，貿易則穿插在往返途中。把貿易放在最後，是為了強調它雖非名義上的目的，卻是實際上最重要的動機之一。", "_v": "b2", "_vn": "中國與東亞史", "_c": "緒論／導論 東亞：一個被歷史連起來的區域", "_u": "b2c0.html"}, {"t": "match", "q": "請把概念與說明配對：", "pairs": [["冊封", "中國皇帝授予周邊統治者王號與印信，承認其統治正當性"], ["勘合", "明朝發給朝貢國、供查驗比對的憑證"], ["筆談", "語言不通者以漢字書寫交換意見"], ["小中華", "自認保存中華文化正統的主張"], ["喃字", "越南以漢字部件創造、記錄本國語言的文字"], ["燕行使", "朝鮮派往中國的使節，留下大量觀察紀錄"]], "e": "這六個詞分別對應朝貢體系的政治面（冊封、勘合）、文化面（筆談、小中華）與在地轉化（喃字、燕行使），可作為緒論的關鍵字清單。", "_v": "b2", "_vn": "中國與東亞史", "_c": "緒論／導論 東亞：一個被歷史連起來的區域", "_u": "b2c0.html"}, {"t": "fill", "q": "日本學者西嶋定生提出，可以用漢字、儒家思想、______ 制度與漢傳佛教四項要素，來辨認歷史上的東亞世界。", "a": ["律令"], "e": "四要素為漢字、儒家思想、律令制度、漢傳佛教。其中律令制度提供了現成的國家藍圖，是各地建構官僚體制時最方便的參考。", "_v": "b2", "_vn": "中國與東亞史", "_c": "緒論／導論 東亞：一個被歷史連起來的區域", "_u": "b2c0.html"}, {"t": "fill", "q": "1446 年朝鮮世宗頒布 ______，創制一套表音文字，讓不通漢文的百姓也能書寫。", "a": ["《訓民正音》", "訓民正音"], "e": "《訓民正音》即今日韓文字母的前身。它的出現不代表漢字立刻退場，兩者長期並用。", "_v": "b2", "_vn": "中國與東亞史", "_c": "緒論／導論 東亞：一個被歷史連起來的區域", "_u": "b2c0.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "某高中生在圖書館比對三本東亞史普及讀物對同一件事的寫法。甲書寫道：「周邊諸國仰慕中華文化，紛紛遣使入貢，中國以寬厚回賜，四方賓服。」乙書寫道：「朝貢是唯一被允許的合法貿易管道，商人為了利潤不惜假冒使節，官方屢次查獲冒貢事件。」丙書寫道：「接受冊封使國王在國內取得無可爭辯的正當性，足以壓制競爭的貴族勢力；一旦國內局勢改變，遣使的頻率也隨之改變。」三本書引用的史料都真實存在，敘述卻給人完全不同的印象。", "subs": [{"q": "三本書的差異，最主要來自什麼？", "o": ["其中兩本捏造了史料，只有一本可信", "三本各自選擇了不同的分析角度：文化、經濟與國內政治", "三本寫的其實是不同的時代，無法比較", "朝貢制度根本不存在，三本都在虛構"], "a": 1, "e": "甲從文化威望切入、乙從貿易利益切入、丙從朝貢國的國內政治切入。三者並不互相否定，而是同一制度的不同面向；差異來自提問角度，而非史料真偽。"}, {"q": "如果這位學生想寫一篇較完整的報告，最恰當的做法是：", "o": ["挑選最順眼的一本照抄", "把三種角度整合起來，說明朝貢為何能讓多方各取所需", "只採用中國方面的史料，因為最權威", "放棄這個題目，因為說法不一致就代表無法研究"], "a": 1, "e": "朝貢體系之所以能長期運作，正是因為它同時滿足了中國的政治宣示、商人的貿易需求與朝貢國統治者的正當性需要。整合多重角度，才能解釋制度為何持久。"}], "_v": "b2", "_vn": "中國與東亞史", "_c": "緒論／導論 東亞：一個被歷史連起來的區域", "_u": "b2c0.html"}, {"t": "mc", "q": "郡縣制與西周封建制最根本的差異是：", "o": ["郡縣制的地方長官由中央任免、不得世襲；封建的諸侯則世襲統治", "郡縣制的轄區比封建諸侯國大得多", "郡縣制不需要向中央繳稅，封建需要", "封建制有軍隊，郡縣制沒有軍隊"], "a": 0, "e": "關鍵在權力來源。封建諸侯靠血緣取得世襲統治權，郡縣的守令則靠皇帝任命、領俸祿、可隨時調動或撤換，因此地方難以形成獨立勢力。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 1 章 國家的統治", "_u": "b2c1.html"}, {"t": "mc", "q": "漢武帝實施推恩令，其高明之處在於：", "o": ["直接出兵消滅所有諸侯王", "以「施恩」為名要求諸侯王分封所有子弟，使王國自行縮小", "廢除所有封國，全部改設郡縣", "把諸侯王全部遷到京城軟禁"], "a": 1, "e": "推恩令表面上是讓諸侯王的所有兒子都能受封，符合人情；實際效果是把大國切成許多小塊，不必動武就削弱了諸侯，可見制度設計的巧妙。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 1 章 國家的統治", "_u": "b2c1.html"}, {"t": "mc", "q": "隋唐三省六部制中，負責「審議並可封駁詔令」的是：", "o": ["中書省", "門下省", "尚書省", "御史臺"], "a": 1, "e": "中書省草擬詔令、門下省審議並有權退回（封駁）、尚書省負責執行。三省分工的用意在於把相權切割，同時提高行政的專業與檢核。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 1 章 國家的統治", "_u": "b2c1.html"}, {"t": "mc", "q": "「上品無寒門，下品無勢族」這句話最能反映哪一種選官制度的實際運作？", "o": ["漢代察舉", "九品官人法", "宋代科舉", "清代捐納"], "a": 1, "e": "九品官人法原意是在戰亂後重建選才秩序，但中正官多由世族擔任，評等自然偏向自家人，結果門第高低幾乎決定仕途上限，形成門閥社會。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 1 章 國家的統治", "_u": "b2c1.html"}, {"t": "mc", "q": "宋代科舉推行糊名與謄錄，最主要的目的是：", "o": ["增加考試的難度", "防止考官辨識考生身分或筆跡而徇私", "減少考試所需的紙張", "讓考生可以匿名批評朝政"], "a": 1, "e": "糊名是遮住姓名籍貫，謄錄是另抄一份試卷送閱。兩者搭配後，考官無從得知作答者是誰，明顯提高了考試的公平性，也削弱了門第與人情的影響。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 1 章 國家的統治", "_u": "b2c1.html"}, {"t": "mc", "q": "明太祖廢除丞相之後，實際發生的結果是：", "o": ["皇帝從此不必處理政務", "六部直屬皇帝，政務負擔大增，後來逐漸形成內閣協助批答", "地方長官取得了宰相的權力", "中央官僚體系隨即崩潰"], "a": 1, "e": "廢相使皇權空前集中，但也讓皇帝必須親自面對龐大政務。殿閣大學士協助批答的安排逐漸發展為內閣，內閣雖然權重，名義上始終只是顧問而非宰相。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 1 章 國家的統治", "_u": "b2c1.html"}, {"t": "mc", "q": "日本在七、八世紀大量引進唐制，卻未真正實施科舉。這個現象最合理的解釋是：", "o": ["日本沒有文字，無法舉辦考試", "日本貴族勢力強大，官位仍依門第世襲，考試取才難以生根", "唐朝拒絕把科舉制度傳給日本", "日本人認為考試不公平"], "a": 1, "e": "日本的律令國家是在既有貴族勢力的基礎上建立的。即使設有大學寮培養官員，任官仍高度受門第影響，因此考試選才無法取代世襲，這也預示了後來貴族政治與武家政權的發展。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 1 章 國家的統治", "_u": "b2c1.html"}, {"t": "mc", "q": "下列關於朝鮮王朝科舉的敘述，何者最正確？", "o": ["對全體人民開放，任何人都可應考", "雖然競爭激烈、地位崇高，但實際上主要限於兩班身分階層", "只考武藝，不考經書", "由中國派官員前來監考"], "a": 1, "e": "朝鮮的科舉極為發達，文科及第被視為最高榮譽，但應考資格與準備條件都集中在兩班階層。科舉在這裡不僅沒有打破身分，反而成為兩班維持地位的重要機制。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 1 章 國家的統治", "_u": "b2c1.html"}, {"t": "tf", "q": "縣這種地方單位是秦始皇統一天下以後才首次出現的。", "a": false, "e": "春秋戰國各國早已在新占領地設縣、派官治理。秦的貢獻在於統一後把郡縣推行到全國，成為唯一的地方制度。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 1 章 國家的統治", "_u": "b2c1.html"}, {"t": "tf", "q": "《唐律疏議》逐條附有解釋，是現存最完整的早期東亞法典，日本、朝鮮與越南的法制都曾大量參考唐代律令。", "a": true, "e": "律令把戶籍、土地、賦役、官制與刑罰整合成可操作的文本，對周邊新興政權而言，等於一份現成的建國說明書。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 1 章 國家的統治", "_u": "b2c1.html"}, {"t": "tf", "q": "清代設立軍機處以後，宰相的權力達到歷史高峰。", "a": false, "e": "恰好相反。宰相制度在 1380 年明太祖廢丞相時即告終結；軍機處的軍機大臣只是承旨辦事、沒有獨立決策權，設立後皇權更加集中。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 1 章 國家的統治", "_u": "b2c1.html"}, {"t": "order", "q": "請把下列選官制度依出現的時間先後排序：", "items": ["察舉與徵辟", "九品官人法", "隋設進士科", "宋確立殿試與糊名", "明清八股取士"], "e": "漢察舉 → 魏晉九品官人法 → 隋唐科舉成形 → 宋代制度化與防弊 → 明清標準化。這條線索也對應著統治階層從世族到士大夫的替換。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 1 章 國家的統治", "_u": "b2c1.html"}, {"t": "order", "q": "請把下列東亞國家制度發展的事件依時間先後排序：", "items": ["秦統一六國，全面推行郡縣", "日本大化革新", "日本頒行《大寶律令》", "高麗引進科舉", "越南李朝首次開科取士"], "e": "前 221 秦統一 → 645 大化革新 → 701 大寶律令 → 958 高麗開科 → 1075 越南開科。可以看出制度的擴散大致是由中國向外、由早到晚。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 1 章 國家的統治", "_u": "b2c1.html"}, {"t": "match", "q": "請把制度與其主要作用配對：", "pairs": [["推恩令", "令諸侯王分封所有子弟，使王國自行縮小"], ["通判", "與知州共同署名文書，代中央監督地方"], ["糊名與謄錄", "遮蔽姓名並另抄試卷，防止考官徇私"], ["行省", "中央派出機構，後固定為地方最高行政區"], ["軍機處", "承旨辦事、快速決策，使皇權高度集中"], ["班田收授", "日本大化革新後依戶籍授田的土地制度"]], "e": "前五項都是中國歷代解決「中央如何管住地方、皇帝如何管住官僚」的辦法；最後一項則是日本引進中國制度後的在地版本。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 1 章 國家的統治", "_u": "b2c1.html"}, {"t": "fill", "q": "魏晉時期由中正官依家世與品行把人才評為九等、作為授官依據的制度，稱為 ______。", "a": ["九品官人法", "九品中正制"], "e": "此制原為戰亂後重建選才秩序而設，但中正官多由世族擔任，最終造成門第壟斷仕途的局面。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 1 章 國家的統治", "_u": "b2c1.html"}, {"t": "fill", "q": "清廷於 ______ 年下詔停止科舉考試，讀書人的出路被迫轉向新式學堂、留學與軍校。", "a": ["1905"], "e": "廢科舉是清末新政中影響最深遠的一步。它不只改變了取才辦法，也瓦解了士人與國家之間延續千年的聯繫方式。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 1 章 國家的統治", "_u": "b2c1.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "某博物館的東亞制度史特展設計了三個並列的展櫃。甲櫃展示唐代官員的告身文書複製品，說明牌寫著：「官職來自任命，可調可撤。」乙櫃展示日本平安時代貴族的系譜圖，說明牌寫著：「即使律令規定了官階，實際敘位仍多依門第。」丙櫃展示朝鮮王朝的榜目（進士名冊）複製品，說明牌寫著：「及第名單中，絕大多數出自少數幾個家族。」策展人在展區入口寫下一句話：「同一份藍圖，蓋出三棟不同的房子。」", "subs": [{"q": "策展人所謂「同一份藍圖」，最可能指的是：", "o": ["西方的三權分立", "源自唐代的律令與官僚制度", "蒙古帝國的驛站系統", "佛教的寺院組織"], "a": 1, "e": "三個展櫃分別呈現中國、日本與朝鮮如何運用同一套源自唐代的律令官僚架構。展覽的重點正是：制度文本相同，實際運作卻因各地社會結構而不同。"}, {"q": "根據三個展櫃的說明，下列推論何者最恰當？", "o": ["日本與朝鮮完全沒有採用中國制度", "制度能否改變社會，取決於它與當地既有權力結構如何互動", "唐代的官員其實也都靠家世取得官職", "朝鮮的科舉完全不受家族背景影響"], "a": 1, "e": "唐代強調任命與調動，日本的敘位仍受門第左右，朝鮮的及第者集中在少數家族。三者對照顯示：外來制度落地後會被既有的權力結構重新塑形，未必產生預期的效果。"}], "_v": "b2", "_vn": "中國與東亞史", "_c": "第 1 章 國家的統治", "_u": "b2c1.html"}, {"t": "mc", "q": "宋代士大夫重建宗族組織時，范仲淹設置義莊的主要作用是：", "o": ["作為朝廷徵稅的單位", "以族田收入贍養族人、支助子弟應考，等於族內的互助基金", "訓練族人參加科舉舞弊", "取代地方官府的司法權"], "a": 1, "e": "義莊以族田的收益贍養貧困族人、支持婚喪與應考。它的意義在於：宗族不再只靠血緣情感，而是有了穩定的經濟基礎，才可能長期運作。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 2 章 社會組織", "_u": "b2c2.html"}, {"t": "mc", "q": "一個發展完整的明清宗族，通常同時具備下列哪一組配備？", "o": ["族譜、祠堂、族田、家訓", "城牆、市舶司、驛站、關稅", "科舉、律令、三省、六部", "會館、公所、票號、鏢局"], "a": 0, "e": "族譜記世系、祠堂行祭祀、族田供經費、家訓族規定賞罰，四者構成宗族運作的基本架構。其他選項分別屬於國家制度或商人組織。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 2 章 社會組織", "_u": "b2c2.html"}, {"t": "mc", "q": "唐代長安實施坊市制，最主要的考量是：", "o": ["促進夜間商業活動", "便於管理與維持治安，因此限制商業的時間與空間", "保護外國商人的安全", "讓所有居民都能住在市場旁邊"], "a": 1, "e": "坊市制把住宅區與商業區分開、市有定時並實施宵禁，重點在管理與治安。宋代以後這套限制瓦解，店鋪臨街、夜市興盛，城市生活的節奏才徹底改變。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 2 章 社會組織", "_u": "b2c2.html"}, {"t": "mc", "q": "明清時期景德鎮、佛山鎮、漢口鎮等「市鎮」興起，最能說明什麼？", "o": ["行政中心的地位更加鞏固", "經濟活動開始跟著市場與交通條件走，而不必然依附行政中心", "農業生產已完全停止", "朝廷主動規劃建設了這些城市"], "a": 1, "e": "這些市鎮多在縣城以下，卻因特定產業或轉運機能而繁榮，人口財富有時超過縣城。這顯示市場與交通取代行政層級，成為聚落發展的主要動力。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 2 章 社會組織", "_u": "b2c2.html"}, {"t": "mc", "q": "下列關於明清「士紳」的敘述，何者最正確？", "o": ["全部都是現任官員", "多數終生未做官，卻長期居鄉並擔任官府與百姓之間的中介", "只負責讀書，不參與地方事務", "地位來自家族血統，與科舉無關"], "a": 1, "e": "士紳指取得生員以上功名者，人數遠多於實際任官者。他們長住地方，辦義學、修水利、調解爭訟、辦團練，是地方治理不可或缺的一層，但也可能把持資源。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 2 章 社會組織", "_u": "b2c2.html"}, {"t": "mc", "q": "北宋藍田呂氏鄉約提出的四項原則，性質上最接近：", "o": ["朝廷強制推行的刑法", "鄉里人自願參加、互相勸誡的自治公約", "商人同業之間的價格協定", "宗族內部的財產分配辦法"], "a": 1, "e": "鄉約以德業相勸、過失相規、禮俗相交、患難相恤為原則，由鄉人自願參加並定期集會。它是社會的自我約束，與國家強制編組的保甲性質不同，直到明代王守仁推行後才逐漸帶有官方色彩。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 2 章 社會組織", "_u": "b2c2.html"}, {"t": "mc", "q": "日本的「家」制度與中國宗族最明顯的差異是：", "o": ["日本完全沒有繼承制度", "日本重視家名與家業的延續，廣泛使用養子，繼承人不必然是親生兒子", "中國允許女性繼承一切財產", "日本禁止家族從事商業"], "a": 1, "e": "中國宗族強調父系血緣的純正，日本的「家」則把家業存續放在首位，因此養子與婿養子相當普遍，商家甚至可以把經營能力當成挑選繼承人的標準。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 2 章 社會組織", "_u": "b2c2.html"}, {"t": "mc", "q": "關於朝鮮王朝後期社會的變化，下列敘述何者正確？", "o": ["祭祀責任逐漸集中於長子，女兒退出繼承與奉祀，父系色彩加強", "女性取得與男性完全相同的繼承權", "宗族組織完全消失", "科舉向全體人民開放"], "a": 0, "e": "高麗時期的繼承與祭祀原本較具雙系色彩，朝鮮後期在性理學影響下明顯父系化，長子承擔奉祀責任、族譜編纂大盛。這提醒我們：社會規範是歷史變化的結果，不是固定不變的傳統。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 2 章 社會組織", "_u": "b2c2.html"}, {"t": "tf", "q": "宋代以後坊市制度瓦解，店鋪可以臨街開設，夜市與瓦舍勾欄等市民娛樂隨之興盛。", "a": true, "e": "唐代的坊市與宵禁限制了商業的時間與空間，宋代打破這些限制後，城市面貌與生活節奏大幅改變，《清明上河圖》即為生動的視覺紀錄。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 2 章 社會組織", "_u": "b2c2.html"}, {"t": "tf", "q": "明清時期「重農抑商」是官方說法，因此商人在社會上毫無影響力。", "a": false, "e": "重農抑商是政策傾向與價值宣示，實際上晉商、徽商等商幫財力雄厚，會館公所遍布各地，許多商人也讓子弟讀書應考，影響力相當可觀。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 2 章 社會組織", "_u": "b2c2.html"}, {"t": "tf", "q": "明清的里甲與保甲編組整齊，因此留下的戶口數字可以直接當成當時的人口統計使用。", "a": false, "e": "編組在紙面上整齊，實際執行卻受人口流動、隱匿戶口與地方敷衍的影響。使用這類數字必須先做史料批判，不能直接當成精確的人口普查。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 2 章 社會組織", "_u": "b2c2.html"}, {"t": "order", "q": "請把下列社會組織的發展依時間先後排序：", "items": ["九品官人法施行，門第社會形成", "唐末五代戰亂，世族瓦解", "范仲淹設置范氏義莊", "明代中期祠堂在華南大量興建", "廢科舉，士紳的功名來源消失"], "e": "220 以後門第社會 → 唐末五代世族瓦解 → 1049 范氏義莊 → 明代中期祠堂普及 → 1905 廢科舉。這條線索說明宗族與士人階層都是被歷史反覆重塑的。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 2 章 社會組織", "_u": "b2c2.html"}, {"t": "order", "q": "請把一件清代村莊水利糾紛的處理過程，依最常見的順序排列：", "items": ["兩村因埤圳分水發生爭執", "村中耆老與地方士紳出面調解", "依既有的分水石碑與鄉約條款議定辦法", "調解不成，其中一方向縣衙具狀", "知縣傳訊兩造並參酌地方慣例裁斷"], "e": "傳統社會的糾紛多先由地方自行處理，動用鄉約、碑約與士紳的權威；官府通常是最後一道關卡，且判決時仍會參考地方慣例。這正是「國家與社會互相補充」的具體樣貌。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 2 章 社會組織", "_u": "b2c2.html"}, {"t": "match", "q": "請把組織或制度與其主要功能配對：", "pairs": [["義莊", "以族田收入贍養族人、支助應考"], ["會館", "商人依同鄉組成，提供住宿議事與互助"], ["公所", "商人依同業組成，協調行規與價格"], ["里甲", "明代基層編組，催徵賦役與管理戶口"], ["鄉約", "鄉人自願參加的自律公約，互相勸誡"], ["書院", "講學與培養應考人才的教育機構"]], "e": "這六項可分成三組：家族的（義莊）、商業的（會館、公所）、地方治理與教育的（里甲、鄉約、書院）。里甲屬國家強制編組，鄉約則屬社會自律，兩者性質不同。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 2 章 社會組織", "_u": "b2c2.html"}, {"t": "fill", "q": "明清取得生員以上功名、享有免役等特權，並在地方擔任官府與百姓中介的階層，稱為 ______。", "a": ["士紳", "紳士"], "e": "士紳長住地方、熟悉人情與慣例，官員因任期短又須迴避本籍，必須倚賴他們才能把政令推到基層。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 2 章 社會組織", "_u": "b2c2.html"}, {"t": "fill", "q": "北宋 ______ 推行保甲法，將民戶編組、輪流值勤巡警並接受訓練，兼具治安與兵源儲備的作用。", "a": ["王安石"], "e": "保甲法是王安石變法的一環。它把國家的控制能力延伸到戶，與後來明清的里甲、保甲一脈相承。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 2 章 社會組織", "_u": "b2c2.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "某研究生整理一份清代華南族譜時，發現三處值得注意的線索。其一，族譜開頭追溯的始祖，據稱是宋代自中原南遷的官員，但中間數代的資料明顯簡略、年代也有出入。其二，族規明文規定：族田收益優先支應祭祀與族中子弟應考的盤纏，其次才是貧戶救濟。其三，附錄的分關（分家文書）顯示，某房因無子而以侄子入繼，並載明入繼後須負擔祖先祭祀。研究生在筆記上寫道：「這本族譜與其說是家族的紀錄，不如說是家族想讓人看見的自己。」", "subs": [{"q": "族譜開頭追溯到宋代中原南遷的官員，但中間數代資料簡略。對此最恰當的解讀是：", "o": ["族譜必定全屬偽造，沒有史料價值", "族譜兼具紀錄與宣示的功能，追溯顯赫始祖有助於提升家族聲望，使用時須加以考證", "證明這個家族確實源自中原", "中間數代的族人一定都沒有子嗣"], "a": 1, "e": "族譜既是親屬名冊，也是宗族對外宣示身分與正統的工具。追溯顯赫祖先是常見做法，但這不等於整本都不可信，而是提醒使用者必須分辨哪些部分有旁證支持。"}, {"q": "族規把族田收益的第一順位放在祭祀與子弟應考，最能說明什麼？", "o": ["宗族的首要目標是讓每位族人平均富裕", "宗族把維繫共同象徵與爭取功名視為最重要的投資", "宗族不允許族人讀書", "清代已經廢除科舉"], "a": 1, "e": "祭祀維繫宗族的認同，功名則能為整族帶來特權與資源，兩者都屬於「集體投資」。救濟貧戶排在其後，也提醒我們宗族內部並不平等。"}], "_v": "b2", "_vn": "中國與東亞史", "_c": "第 2 章 社會組織", "_u": "b2c2.html"}, {"t": "mc", "q": "中國經濟重心由北方移向南方，最主要的推動因素是：", "o": ["南方氣候突然變得適合農耕", "北方戰亂促成三波大規模人口南遷，帶動江南開發", "朝廷明令禁止在北方耕作", "南方發現了大量金礦"], "a": 1, "e": "永嘉之亂、安史之亂與靖康之變三波南遷，把人口、技術與資本帶到長江流域，加上水利開發與稻作推廣，江南因而成為全國的經濟重心。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 3 章 近代以前中國人群移動與交流", "_u": "b2c3.html"}, {"t": "mc", "q": "遼朝實施南北面官制，最能反映的統治考量是：", "o": ["境內同時存在游牧與農耕兩種社會，必須以不同方式治理", "契丹人完全放棄了自己的傳統", "打算把所有人民都改成農耕", "南北兩地的官員互相競爭以提高效率"], "a": 0, "e": "遼統治著游牧部族與農耕人口兩種截然不同的社會。以北面官治部族、南面官治漢人，是承認差異並分別管理的務實設計，與後來金、元、清的做法可互相對照。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 3 章 近代以前中國人群移動與交流", "_u": "b2c3.html"}, {"t": "mc", "q": "關於元代的「四等人制」，下列敘述何者最正確？", "o": ["元朝頒布了名為四等人制的正式法令", "這是後世學者歸納元代在任官、科舉與刑罰上的差別待遇而提出的說法", "四等人指的是四種職業", "蒙古人被列為最低等"], "a": 1, "e": "元代確實存在差別待遇，但並沒有一部叫做「四等人制」的法令。這個名稱是後人歸納出來的概括，使用時應說明其性質，避免把學者的整理當成當時的成文制度。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 3 章 近代以前中國人群移動與交流", "_u": "b2c3.html"}, {"t": "mc", "q": "宋代政府相當重視市舶司的運作，最直接的原因是：", "o": ["想要傳播儒學到海外", "北方戰事使陸路收入減少，海上貿易成為重要財源", "希望把人口遷往海外", "打算禁止一切對外貿易"], "a": 1, "e": "宋代長期面對北方軍事壓力，陸上通道受阻、軍費龐大。市舶司的抽解與博買帶來可觀收入，政府因此積極管理甚至招徠外商，海上貿易的地位空前提高。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 3 章 近代以前中國人群移動與交流", "_u": "b2c3.html"}, {"t": "mc", "q": "下列關於鄭和下西洋的敘述，何者最正確？", "o": ["目的是占領海外土地並建立殖民地", "是國家主導的政治性航行，重在宣揚國威與擴大朝貢關係", "船隊全由民間商人自費組成", "停止之後中國民間就完全不再出海"], "a": 1, "e": "下西洋由朝廷組織與支付，重點在政治與外交，與追求利潤的民間貿易性質不同。航行停止後，民間海商仍持續活動，只是失去了官方的規模與保護。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 3 章 近代以前中國人群移動與交流", "_u": "b2c3.html"}, {"t": "mc", "q": "十六世紀嘉靖年間的「倭寇」，成員組成的實際情況是：", "o": ["全部是日本武士", "成員複雜，其中有相當比例是被海禁逼上海上的中國沿海居民與商人", "全部是葡萄牙人", "全部是朝鮮漁民"], "a": 1, "e": "十四世紀的倭寇以日本沿海人群為主，但十六世紀的情況不同：海禁斷絕了沿海居民的生計，走私與武裝集團因而壯大。把倭寇一律當成日本海盜，會遮蔽政策與社會之間的真正矛盾。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 3 章 近代以前中國人群移動與交流", "_u": "b2c3.html"}, {"t": "mc", "q": "十六世紀以後大量白銀流入中國，最直接的原因是：", "o": ["中國政府強制外商以白銀付款以外別無選擇，且賦役折銀使國內對白銀需求極大", "中國本身盛產白銀，需要向外輸出", "白銀在中國沒有任何用途，只是被當成裝飾", "歐洲國家以白銀作為給中國的貢品"], "a": 0, "e": "一條鞭法之後賦役折收銀兩，白銀成為財政核心，但中國產銀有限，需求只能靠進口滿足。日本與美洲的白銀因此大量流入，中國也被牢牢綁進全球貿易體系。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 3 章 近代以前中國人群移動與交流", "_u": "b2c3.html"}, {"t": "mc", "q": "用「鎖國」描述十七世紀中期以後的日本，需要補充說明的是：", "o": ["日本其實完全沒有限制對外往來", "日本仍保有長崎、對馬、薩摩、松前四個對外窗口", "日本當時被中國直接統治", "日本只與美國往來"], "a": 1, "e": "幕府確實大幅限制對外往來，但長崎（荷蘭與中國）、對馬（朝鮮）、薩摩（琉球）、松前（蝦夷地）四個管道持續運作，經由長崎輸入的西書更催生了蘭學。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 3 章 近代以前中國人群移動與交流", "_u": "b2c3.html"}, {"t": "tf", "q": "所謂「絲路」是一條由長安直達羅馬的固定道路，商人通常會走完全程。", "a": false, "e": "絲路是由綠洲串連的多條路線所構成的網絡，商品經層層轉手，絕大多數商人只負責其中一段，少有人走完全程。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 3 章 近代以前中國人群移動與交流", "_u": "b2c3.html"}, {"t": "tf", "q": "番薯、玉米、花生等作物在十六世紀以後由海路傳入中國，因耐旱且適合山地，促進了丘陵地區的開發。", "a": true, "e": "這些美洲作物擴大了可耕地的範圍，對明清人口增長與山區開發有明顯影響，也改變了許多地方的飲食結構。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 3 章 近代以前中國人群移動與交流", "_u": "b2c3.html"}, {"t": "tf", "q": "清朝在 1757 年後限定歐洲貿易於廣州一口，代表清朝從此完全斷絕對外貿易。", "a": false, "e": "一口通商是把貿易集中管理，不是停止貿易。廣州的貿易量在此後仍然很大，公行制度也持續運作，直到鴉片戰爭後才被條約體制取代。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 3 章 近代以前中國人群移動與交流", "_u": "b2c3.html"}, {"t": "order", "q": "請把下列事件依時間先後排序：", "items": ["張騫出使西域", "永嘉之亂與衣冠南渡", "鄭和首次下西洋", "隆慶開關", "清限定廣州一口通商"], "e": "前 138 張騫 → 311 前後永嘉之亂 → 1405 鄭和首航 → 1567 前後隆慶開關 → 1757 一口通商。這條線大致呈現交流管道由陸轉海、由官方轉民間又被重新管制的過程。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 3 章 近代以前中國人群移動與交流", "_u": "b2c3.html"}, {"t": "order", "q": "請把「一批生絲從江南運到墨西哥」的流程依合理順序排列：", "items": ["江南農家繅絲，交給收購的牙行", "絲貨運至福建或廣東港口，由海商裝船", "船隻趁季風南下，抵達馬尼拉交易", "西班牙商人以美洲白銀購入絲貨", "絲貨裝上大帆船橫渡太平洋運往美洲"], "e": "這條路線把江南農村、閩粵海商、馬尼拉轉口與美洲白銀連在一起。理解它，才能明白為什麼十六世紀以後的中國經濟會受國際銀價影響。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 3 章 近代以前中國人群移動與交流", "_u": "b2c3.html"}, {"t": "match", "q": "請把名詞與說明配對：", "pairs": [["市舶司", "宋代管理海外貿易、抽稅與發給公憑的機構"], ["蕃坊", "唐宋港口供外商聚居並設蕃長管理的區域"], ["遷界令", "清初強迫沿海居民內遷以斷絕接濟的政策"], ["公行", "清代廣州代辦外商交易與稅務的商人組織"], ["朱印船", "持幕府憑證前往東南亞貿易的日本商船"], ["蘭學", "日本經長崎輸入荷蘭書籍而發展的西方知識研究"]], "e": "前四項屬於中國管理海上貿易的制度演變，後兩項則是日本在限制往來的同時仍保留交流管道的證據。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 3 章 近代以前中國人群移動與交流", "_u": "b2c3.html"}, {"t": "fill", "q": "明代把各項賦役合併、折收銀兩的稅制改革稱為 ______，於 1581 年前後推行全國。", "a": ["一條鞭法"], "e": "一條鞭法使白銀成為國家財政的核心，也讓中國對進口白銀產生結構性依賴，是理解白銀大量流入的關鍵背景。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 3 章 近代以前中國人群移動與交流", "_u": "b2c3.html"}, {"t": "fill", "q": "1567 年前後，明朝在福建 ______ 部分開放民間出海貿易，史稱隆慶開關。", "a": ["月港"], "e": "月港的開放使民間海外貿易取得有限的合法空間，也反映官方逐漸承認：嚴格海禁無法阻止沿海社會的生計需求。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 3 章 近代以前中國人群移動與交流", "_u": "b2c3.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "某地方文史工作者整理一座清代閩南僑鄉的宗祠時，發現三件事物並列陳放。其一是一面航海羅盤，背面刻著某位族人的名字與「順風相送」四字。其二是一疊以番薯籤充作主食時期的家書抄本，信中反覆提到「米貴，勉力寄銀回家」。其三是一塊寫著南洋某埠會館名稱的木匾，落款是幾位同姓族人。文史工作者在導覽手冊上寫道：「這三件東西合起來，就是一個家族兩百年的移動史。」", "subs": [{"q": "這三件事物合起來，最能說明的歷史現象是：", "o": ["閩南沿海居民因人口壓力與生計需求出洋，並在海外以同鄉同姓組織互助", "清朝政府主動組織人民移民南洋", "南洋的華人全都來自同一個家族", "羅盤是清代才發明的航海工具"], "a": 0, "e": "羅盤代表航海，家書反映家鄉的糧食壓力與僑匯，會館木匾則顯示海外的同鄉同姓組織。三者串起來，正是閩粵沿海「因生計出洋、在海外重建社會」的典型過程。"}, {"q": "如果要進一步查證這個家族的移動路線，下列哪一種材料最有幫助？", "o": ["同時期歐洲的宮廷繪畫", "族譜中的遷徙記載，以及南洋該埠會館的碑記與名冊", "現代旅遊指南", "清代中央的科舉榜單"], "a": 1, "e": "族譜記錄家族內部的遷徙與分房，海外會館的碑記與名冊則記錄成員來源與活動。兩者互相對照，可以重建移民的路線與網絡，這也是僑鄉研究常用的方法。"}], "_v": "b2", "_vn": "中國與東亞史", "_c": "第 3 章 近代以前中國人群移動與交流", "_u": "b2c3.html"}, {"t": "mc", "q": "1860 年《北京條約》中與人群移動最直接相關的規定是：", "o": ["割讓香港島", "明文允許華工出洋，使招工活動取得條約依據", "開放五口通商", "廢除公行制度"], "a": 1, "e": "割香港島與五口通商、廢公行屬於 1842 年《南京條約》。1860 年的條約使華工出洋合法化，此後招工產業鏈迅速擴張，苦力貿易也進入高峰。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 4 章 近代以後東亞人群移動與交流", "_u": "b2c4.html"}, {"t": "mc", "q": "十九世紀中期契約華工大量外流，與下列哪一項國際變化關係最直接？", "o": ["歐美殖民地陸續廢除奴隸制，種植園與礦場出現勞動力缺口", "歐洲爆發黑死病", "美洲白銀停止開採", "中國禁止一切對外貿易"], "a": 0, "e": "廢奴之後，種植園與礦場仍需要大量廉價勞動力，契約勞工制度因此興起。中國沿海的人口壓力與生計困境，正好與這個需求接上，形成規模龐大的苦力貿易。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 4 章 近代以後東亞人群移動與交流", "_u": "b2c4.html"}, {"t": "mc", "q": "下列關於契約華工法律地位的敘述，何者最準確？", "o": ["他們在法律上就是奴隸", "他們在法律上不是奴隸，但債務束縛與人身限制使其處境與奴役界線模糊", "他們享有與當地工人完全相同的權利", "他們可以隨時解約返鄉"], "a": 1, "e": "契約勞工制度形式上以自願簽約為基礎，實際運作中卻常有誘拐、預支債務、扣押證件與限制行動的情形。分辨「法律形式」與「實際處境」，是理解這段歷史的關鍵。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 4 章 近代以後東亞人群移動與交流", "_u": "b2c4.html"}, {"t": "mc", "q": "美國在 1882 年通過排華法案，最主要的社會背景是：", "o": ["華工在美國人數已超過白人", "經濟不景氣時華工成為輿論與政治動員的替罪對象", "中國政府要求美國限制移民", "華工拒絕參與鐵路修築"], "a": 1, "e": "華工在鐵路與礦業中承擔危險工作、工資偏低，景氣轉壞後反而被指責搶走工作。排華法案把種族歧視寫入法律，長期形塑了北美華人社群的處境。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 4 章 近代以後東亞人群移動與交流", "_u": "b2c4.html"}, {"t": "mc", "q": "第一次世界大戰期間中國採取「以工代兵」策略，主要目的是：", "o": ["減少國內人口", "以派遣勞工參與協約國，期望在戰後和會取得發言權", "為華工爭取歐洲國籍", "協助歐洲國家殖民非洲"], "a": 1, "e": "中國藉由提供十餘萬名勞工支援協約國，希望以參戰國身分在戰後取得有利地位。巴黎和會未回應中國的主要訴求，這份落差直接引爆了五四運動。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 4 章 近代以後東亞人群移動與交流", "_u": "b2c4.html"}, {"t": "mc", "q": "僑批在近代僑鄉社會中的作用是：", "o": ["外國政府發給華僑的居留證", "附有匯款的家書，由專門批局遞送，兼具通訊與匯兌功能", "海外華人組成的政黨", "清廷發給出洋者的通行證"], "a": 1, "e": "僑批把家書與匯款結合，經由批局與水客組成的網絡送達僑鄉。它既維繫親情，也是僑鄉經濟的命脈，留存的僑批因此成為研究移民社會的珍貴史料。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 4 章 近代以後東亞人群移動與交流", "_u": "b2c4.html"}, {"t": "mc", "q": "關於日本帝國時期的人群移動，下列敘述何者最正確？", "o": ["日本只輸出移民，不接收任何外來人口", "日本同時是移民輸出國與殖民地人口的接收國", "殖民地人民完全不能前往日本本土", "日本人從未移民到南美洲"], "a": 1, "e": "同一時期，日本人前往夏威夷、巴西等地當移民，朝鮮人與臺灣人則大量進入日本本土工作或求學。兩種身分並存，正說明帝國內部的人口流動是多向而非單向的。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 4 章 近代以後東亞人群移動與交流", "_u": "b2c4.html"}, {"t": "mc", "q": "臺灣引進外籍移工的制度化過程，下列敘述何者正確？", "o": ["自 1989 年因重大工程專案首度引進，1992 年《就業服務法》公布施行後提供制度依據", "自 1949 年起即大量引進", "由聯合國指定臺灣接收", "一開始就完全適用勞動基準法"], "a": 0, "e": "臺灣在 1989 年以重大工程專案名義首次引進外籍勞工，1992 年《就業服務法》提供法源。家庭看護工長期未被納入勞基法的工時規範，是至今仍在討論的議題。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 4 章 近代以後東亞人群移動與交流", "_u": "b2c4.html"}, {"t": "tf", "q": "條約港開放的只是貨物貿易，與人的移動沒有關係。", "a": false, "e": "條約港同時是人員流動的節點：傳教士、領事、買辦、船員與勞工都循同一條航線移動，招工館、匯兌莊與船票代理更構成完整的移民產業鏈。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 4 章 近代以後東亞人群移動與交流", "_u": "b2c4.html"}, {"t": "tf", "q": "「華僑」與「華人」意思完全相同，可以互相替換使用。", "a": false, "e": "華僑通常指仍具母國國籍的旅外者，華人（或華裔）則多指已取得所在國國籍的族裔群體。戰後東南亞各國獨立，這個區別在法律與認同上都變得重要。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 4 章 近代以後東亞人群移動與交流", "_u": "b2c4.html"}, {"t": "tf", "q": "戰後臺灣在短時間內同時經歷大量日本人離開與大量外省族群移入，人口結構因此出現巨大變動。", "a": true, "e": "1945 年後在臺日本軍民陸續被遣返，1945 至 1950 年代初又有約一百餘萬軍公教人員與眷屬自中國大陸遷入，兩股方向相反的人口移動集中在數年之間發生。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 4 章 近代以後東亞人群移動與交流", "_u": "b2c4.html"}, {"t": "order", "q": "請把下列事件依時間先後排序：", "items": ["《南京條約》開五口通商", "美國通過排華法案", "日本併吞大韓帝國", "英法在中國招募華工赴歐", "臺灣公布施行《就業服務法》"], "e": "1842 南京條約 → 1882 排華法案 → 1910 日本併吞大韓帝國 → 1916 起招募華工 → 1992 就業服務法。這條線索橫跨一百五十年，顯示移動的性質從被迫輸出轉為制度化引進。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 4 章 近代以後東亞人群移動與交流", "_u": "b2c4.html"}, {"t": "order", "q": "請把一名十九世紀後期閩南男子「出洋做工」的過程，依合理順序排列：", "items": ["家鄉歉收，經同鄉介紹前往廈門的招工館", "簽下數年期契約，預支船票與安家費", "搭乘輪船前往南洋的種植園或礦場", "以僑批寄回工資，供家人贍養與購地", "數年後返鄉建屋，或把子姪再帶出洋"], "e": "這條流程顯示移民不是單次事件，而是一個會自我複製的循環：僑匯改善家計，返鄉者又把新的人帶出去，形成連鎖移民。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 4 章 近代以後東亞人群移動與交流", "_u": "b2c4.html"}, {"t": "match", "q": "請把名詞與說明配對：", "pairs": [["買辦", "受僱於外商、熟悉地方商情的中介商人"], ["苦力貿易", "以招募契約勞工為名的跨洋人口運送"], ["僑批", "附有匯款的家書，由專門批局遞送"], ["開拓團", "1932 年後前往中國東北的日本農業移民組織"], ["引揚", "戰後海外日本軍民被遣返回國的過程"], ["離散家族", "因戰爭或分斷而長期無法團聚的家庭"]], "e": "前三項屬於條約體制下的華人移動，後三項則屬於帝國擴張與戰爭造成的人口重組。兩組並置，可看出「移動」背後的力量從市場逐漸轉為國家與戰爭。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 4 章 近代以後東亞人群移動與交流", "_u": "b2c4.html"}, {"t": "fill", "q": "廣東四邑、潮汕與福建閩南等因長期大量移民海外、經濟高度依賴僑匯的地區，統稱為 ______。", "a": ["僑鄉"], "e": "僑鄉的洋樓與碉樓、僑批局與僑資學校，都是僑匯帶回故鄉的具體痕跡，也是研究近代移民史的重要現場。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 4 章 近代以後東亞人群移動與交流", "_u": "b2c4.html"}, {"t": "fill", "q": "第二次世界大戰結束後，散布在臺灣、朝鮮與中國東北等地的日本軍民被遣返回國，這個過程稱為 ______。", "a": ["引揚"], "e": "引揚是戰後東亞人口重組的一環。同一時期臺灣既送走日本人，又接收自中國大陸遷入的軍公教人員與眷屬。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 4 章 近代以後東亞人群移動與交流", "_u": "b2c4.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "某高中的地方史社團訪問了三位長輩。第一位是九十多歲的老先生，他說父親在他出生前就「去南洋」，每年只靠一封信和一點錢回來，母親帶著三個孩子種田到天亮。第二位是六十多歲的阿姨，她 1990 年代嫁到臺灣，說當時語言不通，去市場買菜都要帶紙筆。第三位是三十多歲的看護工，她說自己每個月匯錢回國給讀書的妹妹，休假時和同鄉在車站聚會。社團在報告結語寫道：「三個人相隔八十年，說的卻是同一件事。」", "subs": [{"q": "社團所謂「同一件事」，最貼切的說法是：", "o": ["三人都出生在同一個村莊", "三人都以跨國移動來支撐家庭的生計與下一代的機會", "三人都在同一家工廠工作", "三人都曾參與戰爭"], "a": 1, "e": "父親去南洋、阿姨嫁到臺灣、看護工匯錢回國，形式不同，但核心都是以個人的移動換取家庭的生存與子女的教育機會。這正是近代以來東亞移動史的長期主線。"}, {"q": "如果社團想比較三個時代移動條件的差異，最應該補充的是：", "o": ["三人的星座與血型", "各時期的法律與制度，例如契約勞工規範、婚姻移民法規與移工聘僱制度", "三人最喜歡的食物", "三人居住地的降雨量"], "a": 1, "e": "移動的可能性與代價，很大程度由制度決定：能不能合法入境、契約如何簽訂、能否轉換雇主、是否適用勞動法規。比較制度，才能解釋為何同樣是為家庭而移動，處境卻差異甚大。"}], "_v": "b2", "_vn": "中國與東亞史", "_c": "第 4 章 近代以後東亞人群移動與交流", "_u": "b2c4.html"}, {"t": "mc", "q": "下列哪一項最能說明「條約體制」與「朝貢體制」的根本差異？", "o": ["條約體制以主權國家的平等形式運作，朝貢體制則以上下尊卑的儀式安排關係", "朝貢體制允許自由貿易，條約體制禁止貿易", "條約體制不需要簽署文件", "朝貢體制由歐洲國家設計"], "a": 0, "e": "朝貢以冊封與儀式安排上下關係，但中國一般不干涉內政；條約體制形式上是平等主權國家之間的約定，實際內容卻透過領事裁判權、協定關稅等條款造成嚴重不平等。兩者的邏輯完全不同。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 5 章 傳統與現代的交會", "_u": "b2c5.html"}, {"t": "mc", "q": "「片面最惠國待遇」對近代中國最不利的影響是：", "o": ["中國必須派學生出國留學", "任何一國取得的權益會自動適用於其他締約國，使讓步不斷擴散且難以收回", "中國不能設立海關", "外國商品必須課徵高關稅"], "a": 1, "e": "片面最惠國待遇讓利益單向擴散：只要對任一國讓步，其他國家自動比照。這使中國在後續交涉中幾乎無法個別退讓，也難以透過談判收回既失的權益。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 5 章 傳統與現代的交會", "_u": "b2c5.html"}, {"t": "mc", "q": "自強運動採「官督商辦」形式經營民用企業，最常出現的問題是：", "o": ["商人資金過於充裕", "官員干預人事與經營，企業難以依商業原則運作", "完全沒有政府監督", "產品品質遠勝外國同業"], "a": 1, "e": "官督商辦讓企業同時背負官方任務與商業經營，官員干預人事、挪用資金、冗員充斥的情形常見，因而難以形成有競爭力的近代企業。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 5 章 傳統與現代的交會", "_u": "b2c5.html"}, {"t": "mc", "q": "甲午戰敗對中國改革思潮最重要的影響是：", "o": ["證明船砲已經足夠，不需再改革", "促使改革論述從器物層次轉向制度與思想層次", "使中國放棄一切西方技術", "促成清廷立即實施君主立憲"], "a": 1, "e": "輸給同樣曾被迫開港的鄰國，使「只學技術就能自強」的想法破產。戊戌變法主張仿效日本改革制度，正是在這種衝擊下出現的。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 5 章 傳統與現代的交會", "_u": "b2c5.html"}, {"t": "mc", "q": "日本明治政府在 1873 年同時推行地租改正與徵兵令，這兩項政策的共同意義是：", "o": ["恢復武士的特權", "使國家能直接掌握全國的財源與兵源，不再透過藩或身分集團", "把土地全部收歸國有", "讓幕府重新掌權"], "a": 1, "e": "地租改正提供穩定可預測的現金稅收，徵兵令建立不分身分的國民軍隊。兩者都繞過舊有的中間層，讓中央直接面對全體國民，這正是近代國家的核心特徵。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 5 章 傳統與現代的交會", "_u": "b2c5.html"}, {"t": "mc", "q": "下列關於戊戌變法的敘述，何者最正確？", "o": ["變法持續了十餘年", "變法推行約百日即被終止，但其內容後來大量被清末新政採用", "變法由慈禧太后主導", "變法成功建立了君主立憲體制"], "a": 1, "e": "百日維新雖被終止，卻把制度改革推上檯面。1901 年起的清末新政在興學堂、練新軍、改官制、獎勵實業等方面，與戊戌變法的主張高度重疊。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 5 章 傳統與現代的交會", "_u": "b2c5.html"}, {"t": "mc", "q": "清末新政擴大新軍、新式學堂與地方議會，結果卻不利於清廷。最合理的解釋是：", "o": ["這些新設施完全沒有人參與", "新政培養出的新式軍人、學生與立憲派，後來成為批判甚至推翻清廷的力量", "新政耗費太少，引起百姓不滿", "外國強迫清廷停止新政"], "a": 1, "e": "改革同時創造了新的社會力量與新的期待。當皇族內閣讓立憲派失望、新軍又成為革命的溫床時，這些原本為挽救政權而設的機制，反而加速了政權的崩解。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 5 章 傳統與現代的交會", "_u": "b2c5.html"}, {"t": "mc", "q": "廣義的「五四」與狹義的「五四」差別在於：", "o": ["兩者完全相同", "狹義指 1919 年的政治抗議，廣義涵蓋新文化運動整體的思想變革", "狹義指文學改良，廣義指軍事改革", "狹義發生在日本，廣義發生在中國"], "a": 1, "e": "狹義的五四是 1919 年因巴黎和會山東問題引發的抗議行動；廣義的五四則包含白話文、民主與科學、批判舊禮教等整個新文化運動的內容。答題時要先看題目問的是哪一層。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 5 章 傳統與現代的交會", "_u": "b2c5.html"}, {"t": "tf", "q": "自強運動雖未達成「自強」目標，但它奠定的近代工業、新式學堂與技術人才，對二十世紀仍有長期影響。", "a": true, "e": "評價改革不能只看單一目標是否達成。江南製造局、船政學堂與留美學生所累積的技術與人才，在往後數十年持續發揮作用。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 5 章 傳統與現代的交會", "_u": "b2c5.html"}, {"t": "tf", "q": "日本倒幕勢力原本高喊「攘夷」，掌權後卻積極推行西化政策。", "a": true, "e": "長州、薩摩等藩在嘗試攘夷受挫後認清實力差距，轉而主張先學習西方。這提醒我們：政治口號與實際政策之間可能存在很大的落差。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 5 章 傳統與現代的交會", "_u": "b2c5.html"}, {"t": "tf", "q": "《馬關條約》規定清朝割讓臺灣與澎湖，並允許日本在中國通商口岸設立工廠。", "a": true, "e": "設廠權尤其重要：它讓外國資本可以直接在中國生產，利用當地原料與勞動力，對中國本土的手工業與新興工業造成更大壓力。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 5 章 傳統與現代的交會", "_u": "b2c5.html"}, {"t": "order", "q": "請把下列事件依時間先後排序：", "items": ["鴉片戰爭爆發", "日本大政奉還", "甲午戰爭爆發", "戊戌變法", "武昌起義"], "e": "1840 鴉片戰爭 → 1867 大政奉還 → 1894 甲午戰爭 → 1898 戊戌變法 → 1911 武昌起義。把中日兩條線放在同一軸上，更能看出兩國回應速度的差距。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 5 章 傳統與現代的交會", "_u": "b2c5.html"}, {"t": "order", "q": "請把明治維新的主要措施依推行的時間先後排序：", "items": ["大政奉還", "版籍奉還", "廢藩置縣", "地租改正與徵兵令", "頒布憲法"], "e": "1867 大政奉還 → 1869 版籍奉還 → 1871 廢藩置縣 → 1873 地租改正與徵兵令 → 1889 頒布憲法。次序本身就說明了改革的邏輯：先取得權力，再拆舊制度，最後建立新體制。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 5 章 傳統與現代的交會", "_u": "b2c5.html"}, {"t": "match", "q": "請把人物或機構與其相關事項配對：", "pairs": [["總理各國事務衙門", "1861 年設立，以近代外交方式處理對外事務"], ["江南製造局", "自強運動時期的軍事工業，兼設學堂"], ["岩倉使節團", "日本派往歐美的大型考察團"], ["康有為與梁啟超", "主張仿效明治維新推動制度改革"], ["同盟會", "1905 年於東京整合各革命團體而成立"], ["《新青年》", "鼓吹民主與科學、推廣白話文的刊物"]], "e": "六個選項橫跨自強運動、明治維新、戊戌變法、革命運動與新文化運動，正好可以當成本章的骨架複習。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 5 章 傳統與現代的交會", "_u": "b2c5.html"}, {"t": "fill", "q": "1871 年日本取消藩、改設府縣，把地方權力收歸中央，這項關鍵改革稱為 ______。", "a": ["廢藩置縣"], "e": "廢藩置縣拆掉了幕藩體制的地方權力基礎，是明治維新能夠推行全國性改革的前提。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 5 章 傳統與現代的交會", "_u": "b2c5.html"}, {"t": "fill", "q": "1919 年因巴黎和會決定將山東的德國權益轉給日本，北京學生於 5 月 4 日發起抗議，史稱 ______ 運動。", "a": ["五四"], "e": "五四把知識分子的主張與群眾行動結合，商人罷市、工人罷工，中國代表最終未在對德和約上簽字。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 5 章 傳統與現代的交會", "_u": "b2c5.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "某報在 1896 年刊出一篇讀者投書，作者自稱是一名曾在船政學堂讀書的年輕人。他寫道：「去年之敗，人皆咎海軍怯戰。然學堂所授，算學、輪機、駕駛皆備，同窗亦非不用命。所患者，煤有定額而不足，砲有定式而彈不合，購艦之議數上而不行。器可購自外洋，章程與度支則不能購。今日若仍只議添船添砲，恐十年之後，猶是今日。」（本文為配合教學需要所撰寫的示例，非實際史料。）", "subs": [{"q": "這位作者對甲午戰敗的診斷，重點在於：", "o": ["士兵訓練不足，應加強操練", "問題不在技術與人員，而在制度、財政與決策未能配合", "應該完全放棄海軍", "西方技術本身不可靠"], "a": 1, "e": "作者指出學堂課程完備、同窗也肯拚命，真正的問題是煤額不足、砲彈規格不合、購艦議案無法通過。他的結論「章程與度支則不能購」，正是在說制度與財政無法靠買進口設備解決。"}, {"q": "這段文字最能支持下列哪一個歷史論點？", "o": ["自強運動只改器物而不動制度，因此難以達成自強的目標", "自強運動完全沒有培養人才", "甲午戰爭是因為天候不佳而失敗", "清朝當時已經完成了制度改革"], "a": 0, "e": "文中同時承認自強運動培養了具備專業能力的人才，又指出制度與財政未同步改革。這正好對應本章的核心論點：改革若停在器物層次，新機構仍會被舊體制拖住。"}], "_v": "b2", "_vn": "中國與東亞史", "_c": "第 5 章 傳統與現代的交會", "_u": "b2c5.html"}, {"t": "mc", "q": "1592 至 1598 年的朝鮮戰爭，在中國、朝鮮與日本有三個不同名稱。這個現象最適合用來說明：", "o": ["三國記錄的是三場不同的戰爭", "同一事件的命名反映各自的立場與記憶重點", "其中兩國的記載一定是偽造的", "戰爭的年代無法確定"], "a": 1, "e": "萬曆朝鮮之役以明朝年號為座標，壬辰倭亂強調外來侵擾，文祿、慶長之役則以日本年號記述。三者指向同一場戰爭，但命名的角度不同，是觀察歷史記憶的絕佳入門。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 6 章 戰爭與和平", "_u": "b2c6.html"}, {"t": "mc", "q": "《馬關條約》簽訂後，俄、德、法三國干涉還遼，其後續影響是：", "o": ["日本從此退出中國事務", "列強在中國的競爭升高，清朝並須另付贖遼費用", "清朝收回了臺灣與澎湖", "朝鮮重新成為清朝的藩屬"], "a": 1, "e": "三國干涉使日本歸還遼東，卻也顯示列強介入的力度。此後各國在中國劃分勢力範圍的競爭更為激烈，清朝的處境並未因此改善。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 6 章 戰爭與和平", "_u": "b2c6.html"}, {"t": "mc", "q": "關於日俄戰爭，下列敘述何者最完整？", "o": ["戰場在日本本土，中國未受影響", "主要戰場在中國東北與周邊海域，清朝宣布中立卻無力阻止戰火", "俄國取得了南滿鐵路權益", "戰後朝鮮取得完全獨立"], "a": 1, "e": "日俄兩國在中國領土上作戰，清朝宣布中立卻無法保護當地居民。戰後日本取得南滿權益與旅大租借權，朝鮮則在同年成為日本保護國，五年後被併吞。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 6 章 戰爭與和平", "_u": "b2c6.html"}, {"t": "mc", "q": "1943 年的《開羅宣言》，就東亞戰後安排而言最重要的內容是：", "o": ["宣布日本可保留所有占領地", "聲明日本應歸還其奪取的中國領土，包括東北與臺灣、澎湖", "決定成立聯合國", "要求蘇聯立即對日宣戰"], "a": 1, "e": "開羅會議由美、英、中三方領袖出席，會後宣言聲明日本應歸還奪取的中國領土。1945 年的《波茨坦宣言》又重申其條款應被履行，兩者是戰後領土安排討論的重要文件。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 6 章 戰爭與和平", "_u": "b2c6.html"}, {"t": "mc", "q": "關於遠東國際軍事法庭（東京審判）受到的批評，下列何者最常被提出？", "o": ["審判時間太短，只開了一天", "由戰勝國主導、未追究天皇責任，且部分戰爭行為未被納入審理", "被告全部獲判無罪", "審判在中國舉行，程序不公"], "a": 1, "e": "這三點是學界長期討論的爭議。要注意的是：指出程序上的問題，與否定審判所認定的具體事實，是兩件不同的事，答題與討論時都應分開處理。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 6 章 戰爭與和平", "_u": "b2c6.html"}, {"t": "mc", "q": "《舊金山和約》關於臺灣的條文，其特殊之處在於：", "o": ["明確把臺灣移交給某一特定國家", "規定日本放棄臺灣與澎湖等權利，但未載明移交給哪一國", "規定臺灣由聯合國直接管理", "完全沒有提到臺灣"], "a": 1, "e": "和約載明日本放棄相關權利，卻未指定接收國。這一留白與其後各方的不同解釋，成為日後關於臺灣國際地位爭論的重要源頭之一。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 6 章 戰爭與和平", "_u": "b2c6.html"}, {"t": "mc", "q": "韓戰在 1953 年結束交戰，但至今仍被說成「法律上尚未結束」，原因是：", "o": ["雙方只簽訂停戰協定，並未締結和平條約", "戰爭實際上仍在進行", "聯合國尚未承認停戰", "雙方拒絕撤軍到分界線後方"], "a": 0, "e": "1953 年簽署的是停戰協定，作用是停止交戰並劃定軍事分界線。由於未簽和平條約，朝鮮半島在法律上仍處於停戰狀態，這也是理解當地緊張局勢的基本背景。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 6 章 戰爭與和平", "_u": "b2c6.html"}, {"t": "mc", "q": "處理「歷史認識問題」時，較恰當的課堂做法是：", "o": ["直接宣布哪一國的說法是唯一正確的", "先分辨哪些部分已有史料共識、哪些仍在爭論，再檢視各方使用的證據", "避免提及任何爭議，只背年代", "以票選方式決定歷史真相"], "a": 1, "e": "歷史教育的目標不是替爭議下政治結論，而是培養判斷證據的能力。先分辨事實與解釋、再檢視各方的資料來源與推論方式，才能讓討論有意義。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 6 章 戰爭與和平", "_u": "b2c6.html"}, {"t": "tf", "q": "1937 年南京陷落後日軍對戰俘與平民的大規模殺害有充分史料佐證，但關於遇難人數的估計，各方差距很大。", "a": true, "e": "事件本身有當時外籍人士的日記、照片、報告與戰後審判紀錄等多重佐證。至於人數估計，因統計範圍、時間界線與資料來源不同，中國方面、日本部分研究者與國際學界之間存在明顯差距。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 6 章 戰爭與和平", "_u": "b2c6.html"}, {"t": "tf", "q": "日俄戰爭因為是「亞洲國家戰勝歐洲強權」，所以對當時的中國東北居民而言也是一件好事。", "a": false, "e": "這場戰爭確實鼓舞了部分亞洲民族主義者，但主戰場就在中國東北，當地居民承受了戰火、徵發與財產損失。評價歷史事件時，必須同時看見不同群體的處境。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 6 章 戰爭與和平", "_u": "b2c6.html"}, {"t": "tf", "q": "1972 年日本與中華人民共和國建交時，中方在聯合聲明中放棄戰爭賠償要求，因此個別受害者的求償訴訟也從此完全消失。", "a": false, "e": "國家之間的協定未必涵蓋個人的請求權，戰後數十年間仍有受害者或其家屬提起訴訟。這正好說明：國家層次的解決與受害者層次的接受，並不是同一件事。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 6 章 戰爭與和平", "_u": "b2c6.html"}, {"t": "order", "q": "請把下列戰爭與事件依時間先後排序：", "items": ["甲午戰爭爆發", "日俄戰爭爆發", "九一八事變", "盧溝橋事變", "韓戰爆發"], "e": "1894 甲午 → 1904 日俄 → 1931 九一八 → 1937 盧溝橋 → 1950 韓戰。這五個點串起來，就是東亞從朝貢秩序崩解走到冷戰分斷的主軸。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 6 章 戰爭與和平", "_u": "b2c6.html"}, {"t": "order", "q": "請把第二次世界大戰末期至戰後處置的事件依時間先後排序：", "items": ["開羅會議發表宣言", "《波茨坦宣言》發布", "日本宣布接受《波茨坦宣言》", "東京審判判決", "《舊金山和約》生效"], "e": "1943 開羅宣言 → 1945 年 7 月波茨坦宣言 → 1945 年 8 月日本接受 → 1948 東京審判判決 → 1952 舊金山和約生效。戰爭的結束與戰後秩序的建立之間，隔了好幾年。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 6 章 戰爭與和平", "_u": "b2c6.html"}, {"t": "match", "q": "請把文件或機構與其內容配對：", "pairs": [["《馬關條約》", "清朝承認朝鮮獨立、割讓臺澎並賠款"], ["《開羅宣言》", "聲明日本應歸還其奪取的中國領土"], ["《波茨坦宣言》", "要求日本投降並重申開羅宣言條款"], ["遠東國際軍事法庭", "審判日本戰爭領導階層"], ["《舊金山和約》", "日本放棄臺澎等權利，未載明移交對象"], ["韓戰停戰協定", "停止交戰並劃定軍事分界線，未締結和平條約"]], "e": "這六份文件與機構依序構成從戰爭到戰後處置的骨架。要特別留意條約「寫了什麼」與「沒寫什麼」，後者往往才是爭議的來源。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 6 章 戰爭與和平", "_u": "b2c6.html"}, {"t": "fill", "q": "1937 年 7 月 7 日發生 ______ 事變，中日由此進入全面戰爭狀態。", "a": ["盧溝橋"], "e": "盧溝橋事變後衝突迅速擴大，同年 8 月的淞滬會戰持續約三個月，國民政府隨後遷都重慶進行長期抗戰。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 6 章 戰爭與和平", "_u": "b2c6.html"}, {"t": "fill", "q": "1953 年韓戰交戰方簽訂的是 ______ 協定，而非和平條約，因此朝鮮半島在法律上仍處於這個狀態。", "a": ["停戰"], "e": "停戰協定的作用是停止交戰並劃定軍事分界線。理解這一點，才能明白為何朝鮮半島的緊張局勢會長期存在。", "_v": "b2", "_vn": "中國與東亞史", "_c": "第 6 章 戰爭與和平", "_u": "b2c6.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "某線上交流營請三地高中生各寫一段「我的教科書怎麼寫這場戰爭」。甲同學說：「我們的課本花很多篇幅描述平民傷亡與城市破壞，章名是『不能忘記的傷痕』。」乙同學說：「我們的課本主要談國際局勢與決策過程，對戰場細節著墨較少，章名是『走向戰爭的十五年』。」丙同學說：「我們的課本從殖民統治講起，把這場戰爭放進爭取獨立的脈絡。」三人發現彼此的年代與地名幾乎都對得上，讀完之後對「這場戰爭是什麼」的感受卻完全不同。", "subs": [{"q": "三本教科書的年代與地名大致相符，感受卻差異很大。最合理的解釋是：", "o": ["其中兩本捏造了史實", "三者在史實之外，各自選擇了不同的敘事起點與強調重點", "歷史沒有客觀事實，因此怎麼寫都可以", "三人讀的其實是不同戰爭"], "a": 1, "e": "史實層次（年代、地名、主要事件）可以一致，但選擇從哪裡講起、強調哪一方的經驗、用什麼章名，都會塑造讀者的整體印象。這正是史實與歷史解釋的差別。"}, {"q": "如果三人想合寫一份共同報告，最可行的做法是：", "o": ["投票決定採用哪一本教科書的說法", "並列三種敘述並說明各自的依據與關切，再標示出哪些部分已有共識", "刪掉所有有爭議的內容", "請老師指定一個標準答案"], "a": 1, "e": "共同歷史教材的常見做法，正是並陳各方觀點、說明差異的來源，並清楚區分「有共識的事實」與「仍在爭論的解釋」。這不是回避爭議，而是讓爭議可以被檢驗與討論。"}], "_v": "b2", "_vn": "中國與東亞史", "_c": "第 6 章 戰爭與和平", "_u": "b2c6.html"}, {"t": "mc", "q": "泰利斯主張「水」是萬物構成的基本元素。這個主張在思想史上最重要的意義是什麼？", "o": ["證明了水確實是化學上的基本元素", "把解釋世界的方式從神話思維轉向理性探討", "否定了希臘眾神的存在，開啟無神論", "建立了雅典城邦的民主制度"], "a": 1, "e": "泰利斯的貢獻不在答案正確與否，而在方法：他企圖破除以神話、迷信解釋萬象，改以人的理性探討宇宙本源，奠定理性研究的基礎。", "_v": "b3", "_vn": "世界史", "_c": "第 1 章 古代文化與基督教傳統", "_u": "b3c1.html"}, {"t": "mc", "q": "下列關於辯士學派與希臘三哲的比較，何者正確？", "o": ["兩者都主張世界存在絕對真理", "辯士學派強調絕對真理，三哲則予以否定", "辯士學派質疑絕對真理，三哲則反對此說、強調真理存在", "兩者都拒絕參與城邦的公共事務"], "a": 2, "e": "辯士學派（普羅塔哥拉斯）強調世界不存在絕對真理與正義；蘇格拉底、柏拉圖、亞里斯多德正是反對這種懷疑主義，強調真理的存在。", "_v": "b3", "_vn": "世界史", "_c": "第 1 章 古代文化與基督教傳統", "_u": "b3c1.html"}, {"t": "mc", "q": "希臘化時代的哲學（伊比鳩魯學派、斯多噶學派）為何轉向關注個人內心，而非城邦政治？", "o": ["因為希臘人不再識字，無法討論政治", "因為希臘化王國實行中央集權，城邦失去政治獨立性", "因為亞歷山大禁止哲學家討論任何議題", "因為羅馬已經征服希臘全境"], "a": 1, "e": "希臘化王國尊重各地文化但採中央集權，城邦淪為單純城市、必須聽從國王指示，人民不再需要在公共場所辯論政策，哲學遂轉向個人內在的平靜。", "_v": "b3", "_vn": "世界史", "_c": "第 1 章 古代文化與基督教傳統", "_u": "b3c1.html"}, {"t": "mc", "q": "羅馬共和時期設置護民官與平民會議、制定《十二表法》，最主要反映的是：", "o": ["貴族與平民的抗爭與權力制衡", "羅馬已經走向君主專制", "羅馬接受了基督教的平等觀念", "元老院被徹底廢除"], "a": 0, "e": "共和初期元老院、公民大會與執政官皆由貴族掌控，在平民長期抗爭下才設置平民會議、護民官並制定《十二表法》。這種制衡與法治概念成為現代政治的重要精神。", "_v": "b3", "_vn": "世界史", "_c": "第 1 章 古代文化與基督教傳統", "_u": "b3c1.html"}, {"t": "mc", "q": "君士坦丁大帝召開尼西亞會議、確立「三位一體」概念，在政教關係史上的特殊意義是：", "o": ["教會首次取得高於皇帝的權力", "開創了政治權力干預宗教事務的先例", "正式宣布基督教為羅馬國教", "結束了東西教會的分裂"], "a": 1, "e": "宣布為國教的是 380 年的狄奧多西一世；君士坦丁召開尼西亞會議、介入教義爭論，是政治干預宗教的先例。", "_v": "b3", "_vn": "世界史", "_c": "第 1 章 古代文化與基督教傳統", "_u": "b3c1.html"}, {"t": "mc", "q": "中古西歐的「主教座堂學校」在十二世紀後的重要發展是：", "o": ["演變為現代大學的前身", "被教宗下令全面關閉", "轉型為修道院的抄寫所", "成為專門培養騎士的機構"], "a": 0, "e": "十二世紀主教座堂學校允許具專業知識的非神職人員執教並頒授學位，逐漸發展為現代大學的前身，也為各國王廷培育法學人才。", "_v": "b3", "_vn": "世界史", "_c": "第 1 章 古代文化與基督教傳統", "_u": "b3c1.html"}, {"t": "mc", "q": "文藝復興時期的人文主義者對宗教的態度，下列敘述何者最正確？", "o": ["全面反對宗教，主張無神論", "不反對宗教，但把焦點從「神」轉向「人」與現世成就", "主張恢復希臘羅馬的多神信仰", "要求解散所有修道院"], "a": 1, "e": "人文主義者不反對宗教，也研究早期基督教著作；轉變在於從中古以「神」為中心，逐漸轉為對「人」與「人性」的重新思考與肯定。", "_v": "b3", "_vn": "世界史", "_c": "第 1 章 古代文化與基督教傳統", "_u": "b3c1.html"}, {"t": "tf", "q": "1054 年東西教會分裂後，西方稱為希臘正教、東方稱為羅馬公教。", "a": false, "e": "相反。西方是羅馬公教（Roman Catholic Church），東方是希臘正教（Greek Orthodox Church）。", "_v": "b3", "_vn": "世界史", "_c": "第 1 章 古代文化與基督教傳統", "_u": "b3c1.html"}, {"t": "tf", "q": "《查士丁尼法典》是歐洲第一部完整的法律彙編。", "a": true, "e": "東羅馬皇帝查士丁尼一世將羅馬法律彙集編成，對日後歐洲各國法制影響深遠。", "_v": "b3", "_vn": "世界史", "_c": "第 1 章 古代文化與基督教傳統", "_u": "b3c1.html"}, {"t": "tf", "q": "哥德式建築的特色是厚重石牆、小窗與圓拱門。", "a": false, "e": "那是「仿羅馬式」。哥德式的特色是高聳尖頂、尖拱、拱肋、飛扶壁與彩繪玻璃。", "_v": "b3", "_vn": "世界史", "_c": "第 1 章 古代文化與基督教傳統", "_u": "b3c1.html"}, {"t": "order", "q": "請把下列事件依時間先後排序：", "items": ["羅馬共和開始", "屋大維獲「奧古斯都」稱號", "君士坦丁頒布《米蘭詔令》", "西羅馬帝國滅亡", "東西教會正式分裂"], "e": "509 B.C. 共和開始 → 27 B.C. 奧古斯都 → 313 米蘭詔令 → 476 西羅馬滅亡 → 1054 東西教會分裂。", "_v": "b3", "_vn": "世界史", "_c": "第 1 章 古代文化與基督教傳統", "_u": "b3c1.html"}, {"t": "order", "q": "請把文藝復興相關發展依時間先後排序：", "items": ["十字軍運動開始", "拜占庭帝國滅亡", "古騰堡改良活字印刷術", "馬丁‧路德提出《九十五條論綱》"], "e": "1096 十字軍 → 1453 拜占庭滅亡 → 約1455 活字印刷 → 1517 九十五條論綱。", "_v": "b3", "_vn": "世界史", "_c": "第 1 章 古代文化與基督教傳統", "_u": "b3c1.html"}, {"t": "match", "q": "請把人物與其主張／作品配對：", "pairs": [["柏拉圖", "《理想國》：哲學家治國"], ["亞里斯多德", "感官經驗與抽象觀念同等重要"], ["芝諾", "以理性克制慾望，順應宇宙秩序"], ["伊比鳩魯", "趨樂避苦，心靈平靜才是真快樂"], ["薄伽丘", "《十日談》諷刺教士與貴族"], ["摩爾", "《烏托邦》主張財產共有"]], "e": "注意區分希臘三哲（真理導向）與希臘化時代哲學（個人內心導向），以及義大利與北方文藝復興的代表作。", "_v": "b3", "_vn": "世界史", "_c": "第 1 章 古代文化與基督教傳統", "_u": "b3c1.html"}, {"t": "fill", "q": "西元 ______ 年，法蘭克國王查理曼接受教宗利奧三世加冕，被高呼為「羅馬人的皇帝」。", "a": ["800"], "e": "這代表法蘭克繼承羅馬帝國統治地位獲得承認，同時也給了教會干預世俗政權的理由。", "_v": "b3", "_vn": "世界史", "_c": "第 1 章 古代文化與基督教傳統", "_u": "b3c1.html"}, {"t": "fill", "q": "聖本篤所立的修院規範強調安貧、______ 與服從三大原則。", "a": ["守貞"], "e": "《聖本篤清規》強調安貧、守貞、服從，成為西方修院的準則。", "_v": "b3", "_vn": "世界史", "_c": "第 1 章 古代文化與基督教傳統", "_u": "b3c1.html"}, {"t": "read", "q": "素養題組：閱讀下列材料後作答。", "passage": "六世紀，東羅馬皇帝查士丁尼一世發布詔令，要求主教、神父在舉行聖祭及洗禮時不可低聲，而應朗誦經文，使教友能因聆聽而感動懺悔。詔令並命令地方首長監督執行，如有神職人員疏忽此法令而地方首長不予舉發，「亦必將受嚴罰」。", "subs": [{"q": "這份詔令最能反映拜占庭帝國的哪一項特徵？", "o": ["政教分離，皇帝不干涉教務", "政教合一，皇帝同時是教會領袖", "教宗權威高於皇帝", "地方首長由教會任命"], "a": 1, "e": "皇帝直接規範神職人員的禮儀細節，並動用世俗官僚體系執行，正是拜占庭「政教合一」的典型表現。"}, {"q": "與同時期的西歐相比，這份詔令顯示的最大差異是：", "o": ["西歐皇帝也能直接下詔規範彌撒細節", "西歐由羅馬教宗主張至高權威，皇帝無法如此指揮教會", "西歐完全沒有基督教會組織", "西歐的教會使用希臘語"], "a": 1, "e": "西方教會主張羅馬教宗具至高權威，形成政教二元的拉鋸（授職之爭即為代表）；東方則是皇帝領導教會。"}], "_v": "b3", "_vn": "世界史", "_c": "第 1 章 古代文化與基督教傳統", "_u": "b3c1.html"}, {"t": "mc", "q": "馬丁‧路德把《聖經》譯成日耳曼文，最直接的用意是：", "o": ["向教宗證明自己的學問", "讓信徒能自行閱讀聖經、與上帝直接對話", "替神聖羅馬帝國制定官方語言", "推廣印刷術以獲取商業利益"], "a": 1, "e": "路德主張「因信得救」，人不需透過教會中介即可得救；譯經正是要讓一般信徒能自己讀經，這在實質上動搖了教會的權威。", "_v": "b3", "_vn": "世界史", "_c": "第 2 章 個人自由理性的追尋", "_u": "b3c2.html"}, {"t": "mc", "q": "《西發里亞和約》（1648）對近代歐洲最深遠的影響是：", "o": ["確立教宗對各國君主的統治權", "奠定「主權國家」體系，各邦自行決定宗教", "使天主教成為全歐唯一合法宗教", "建立歐洲統一的常備軍"], "a": 1, "e": "和約結束三十年戰爭，承認各邦自主決定宗教，並確認邦國的主權地位，被視為近代國際體系的起點。", "_v": "b3", "_vn": "世界史", "_c": "第 2 章 個人自由理性的追尋", "_u": "b3c2.html"}, {"t": "mc", "q": "下列哪一位思想家的主張，最直接成為美國《獨立宣言》「人民有權推翻政府」的理論依據？", "o": ["洛克", "孟德斯鳩", "亞當斯密", "馬克思"], "a": 0, "e": "洛克《政府論》主張政府源於人民同意、目的在保障自然權利，若違反契約人民有權反抗。傑佛遜起草《獨立宣言》時明顯承襲此說。", "_v": "b3", "_vn": "世界史", "_c": "第 2 章 個人自由理性的追尋", "_u": "b3c2.html"}, {"t": "mc", "q": "科學革命對啟蒙運動最關鍵的貢獻是：", "o": ["發明了印刷術，使書籍便宜", "證明上帝不存在", "建立「理性可以認識世界並發現普遍法則」的信念", "讓歐洲國家取得軍事優勢"], "a": 2, "e": "牛頓等人證明自然依循可被發現的法則；啟蒙思想家據此相信人類社會也能用理性加以檢視與改造。", "_v": "b3", "_vn": "世界史", "_c": "第 2 章 個人自由理性的追尋", "_u": "b3c2.html"}, {"t": "mc", "q": "關於義大利與德意志的統一，下列比較何者正確？", "o": ["兩者都由教宗主導完成", "義大利由薩丁尼亞王國主導，德意志由普魯士主導", "兩者都在拿破崙統治期間完成", "兩者都經由公民投票和平達成，未發生戰爭"], "a": 1, "e": "義大利由薩丁尼亞王國（加富爾、加里波底）主導，1861 年建國；德意志由普魯士（俾斯麥鐵血政策）主導，經三次戰爭後於 1871 年建立帝國。", "_v": "b3", "_vn": "世界史", "_c": "第 2 章 個人自由理性的追尋", "_u": "b3c2.html"}, {"t": "mc", "q": "亞當斯密所說的「看不見的手」，指的是：", "o": ["國王對經濟的祕密掌控", "教會對商業活動的道德規範", "市場中個人追求自利，反而促成整體資源有效配置的機制", "殖民地總督的行政權力"], "a": 2, "e": "《國富論》主張分工與市場機制能協調個人利益與社會利益，因此政府應減少不必要的干預。", "_v": "b3", "_vn": "世界史", "_c": "第 2 章 個人自由理性的追尋", "_u": "b3c2.html"}, {"t": "mc", "q": "十九世紀民族主義「一體兩面」的性質，最貼切的描述是：", "o": ["只會帶來國家統一，沒有負面影響", "對內凝聚國民認同，對外可能導向排他與擴張", "只存在於東歐，西歐並不受影響", "與工業革命完全無關"], "a": 1, "e": "民族主義推動了義、德統一與被統治民族的獨立運動，但其排他性也助長列強競爭，成為兩次世界大戰的遠因之一。", "_v": "b3", "_vn": "世界史", "_c": "第 2 章 個人自由理性的追尋", "_u": "b3c2.html"}, {"t": "tf", "q": "英國宗教改革的直接起因是亨利八世的婚姻問題，屬於政治因素多於神學爭論。", "a": true, "e": "亨利八世因婚姻問題與羅馬決裂，另立英國國教會（聖公會），與路德、喀爾文由神學出發的改革性質不同。", "_v": "b3", "_vn": "世界史", "_c": "第 2 章 個人自由理性的追尋", "_u": "b3c2.html"}, {"t": "tf", "q": "光榮革命之所以稱為「光榮」，是因為它是一場大規模的軍事勝利。", "a": false, "e": "稱「光榮」是因為幾乎沒有流血就完成政權更替，並在次年以《權利法案》確立議會高於國王。", "_v": "b3", "_vn": "世界史", "_c": "第 2 章 個人自由理性的追尋", "_u": "b3c2.html"}, {"t": "tf", "q": "喀爾文的「預選說」主張人可以透過購買贖罪券改變自己是否得救。", "a": false, "e": "恰好相反。預選說認為得救與否早已由上帝決定，人無法以任何行為改變，只能以勤奮節儉的生活榮耀上帝。", "_v": "b3", "_vn": "世界史", "_c": "第 2 章 個人自由理性的追尋", "_u": "b3c2.html"}, {"t": "order", "q": "請依時間先後排序：", "items": ["馬丁‧路德提出《九十五條論綱》", "《西發里亞和約》簽訂", "英國光榮革命", "北美發布《獨立宣言》", "法國大革命爆發"], "e": "1517 → 1648 → 1688 → 1776 → 1789。", "_v": "b3", "_vn": "世界史", "_c": "第 2 章 個人自由理性的追尋", "_u": "b3c2.html"}, {"t": "order", "q": "請依時間先後排序：", "items": ["哥白尼提出《天體運行論》", "牛頓發表《自然哲學的數學原理》", "亞當斯密出版《國富論》", "《共產黨宣言》發表", "德意志帝國成立"], "e": "1543 → 1687 → 1776 → 1848 → 1871。", "_v": "b3", "_vn": "世界史", "_c": "第 2 章 個人自由理性的追尋", "_u": "b3c2.html"}, {"t": "match", "q": "請把思想家與其主張／著作配對：", "pairs": [["洛克", "《政府論》：自然權利與人民同意"], ["孟德斯鳩", "三權分立與制衡"], ["盧梭", "《社會契約論》：主權在民與公意"], ["伏爾泰", "宗教寬容與言論自由"], ["亞當斯密", "《國富論》：市場與分工"], ["馬克思", "《共產黨宣言》：階級鬥爭"]], "e": "啟蒙思想家各有側重：洛克談權利來源、孟德斯鳩談權力結構、盧梭談主權歸屬、伏爾泰談自由空間。", "_v": "b3", "_vn": "世界史", "_c": "第 2 章 個人自由理性的追尋", "_u": "b3c2.html"}, {"t": "fill", "q": "1689 年英國通過《______ 法案》，確立議會權力高於國王。", "a": ["權利"], "e": "《權利法案》（Bill of Rights）是光榮革命的制度成果，奠定君主立憲基礎。", "_v": "b3", "_vn": "世界史", "_c": "第 2 章 個人自由理性的追尋", "_u": "b3c2.html"}, {"t": "fill", "q": "普魯士首相 ______ 以「鐵血政策」主導德意志統一，於 1871 年在凡爾賽宮宣布德意志帝國成立。", "a": ["俾斯麥"], "e": "俾斯麥先後透過對丹麥、奧地利、法國三次戰爭完成統一。", "_v": "b3", "_vn": "世界史", "_c": "第 2 章 個人自由理性的追尋", "_u": "b3c2.html"}, {"t": "read", "q": "素養題組：閱讀下列說明後作答。", "passage": "十八世紀的巴黎出現了一種新的空間。在貴族夫人主持的沙龍裡，作家、科學家、官員與外國訪客同席而坐，談論新出版的書籍與時事；在咖啡館裡，識字的市民一邊看報，一邊爭辯國王的財政政策。這些場合沒有官方身分，卻能讓一種意見在幾週之內傳遍全城。有學者認為，正是這樣的空間，讓「輿論」第一次成為君主必須顧慮的力量。", "subs": [{"q": "文中所描述的沙龍與咖啡館，最適合用下列哪一個概念來理解？", "o": ["封建莊園", "公共領域", "行會組織", "宗教裁判所"], "a": 1, "e": "沙龍、咖啡館與印刷品構成宮廷之外的討論空間，使意見得以公開流通並形成輿論，一般稱為「公共領域」。"}, {"q": "這段敘述最能說明啟蒙思想為何具有政治影響力的哪一個原因？", "o": ["因為國王親自參與辯論", "因為思想有了可以快速傳播並形成集體意見的管道", "因為教會全力支持啟蒙思想", "因為當時已有普選制度"], "a": 1, "e": "啟蒙思想的力量不只在內容，也在傳播：印刷品、沙龍與咖啡館讓思想跨越階層流通，使輿論成為政治壓力。"}], "_v": "b3", "_vn": "世界史", "_c": "第 2 章 個人自由理性的追尋", "_u": "b3c2.html"}, {"t": "mc", "q": "伊斯蘭曆以西元 622 年為元年，這一年發生的重要事件是：", "o": ["穆罕默德出生", "穆罕默德開始傳教", "穆罕默德由麥加遷往麥地那", "穆罕默德重返麥加"], "a": 2, "e": "622 年的「聖遷」使穆罕默德在麥地那建立宗教與政治共同體，被視為伊斯蘭社群的真正起點，故定為曆元。", "_v": "b3", "_vn": "世界史", "_c": "第 3 章 伊斯蘭與世界", "_u": "b3c3.html"}, {"t": "mc", "q": "遜尼派與什葉派分裂的最初原因是：", "o": ["對《古蘭經》文本的認定不同", "對哈里發繼承資格的看法不同", "對禮拜方向的爭議", "對是否可以經商的爭議"], "a": 1, "e": "分歧源於政治繼承：遜尼派承認由社群共議推舉，什葉派則主張領袖須出自先知後裔阿里一系。", "_v": "b3", "_vn": "世界史", "_c": "第 3 章 伊斯蘭與世界", "_u": "b3c3.html"}, {"t": "mc", "q": "伊斯蘭帝國對被征服地區的「有經人」採取的政策是：", "o": ["一律強制改信伊斯蘭教", "可保有原信仰，但須繳納人頭稅", "全部驅逐出境", "禁止從事任何商業活動"], "a": 1, "e": "寬容政策讓龐大的多元人口得以被有效統治，也是伊斯蘭能快速擴張並長期維持的原因之一。", "_v": "b3", "_vn": "世界史", "_c": "第 3 章 伊斯蘭與世界", "_u": "b3c3.html"}, {"t": "mc", "q": "下列哪一項最能說明伊斯蘭世界在東西文化交流上的「橋樑」角色？", "o": ["發明了印刷術並傳入中國", "在巴格達智慧宮翻譯希臘典籍，日後經西班牙回傳歐洲", "把基督教傳入印度", "首先提出日心說"], "a": 1, "e": "阿拔斯王朝的大規模翻譯運動保存了亞里斯多德等古典著作；這些文本經伊比利半島回流，直接滋養了歐洲的學術復興。", "_v": "b3", "_vn": "世界史", "_c": "第 3 章 伊斯蘭與世界", "_u": "b3c3.html"}, {"t": "mc", "q": "十字軍運動在軍事上失敗，但對歐洲最重要的長期影響是：", "o": ["歐洲各國從此不再信仰基督教", "促進東西貿易與文化交流，義大利城市因而致富", "教宗從此失去所有權威", "鄂圖曼帝國因此滅亡"], "a": 1, "e": "香料、絲織品、造紙術與古典學術隨之傳入西歐，威尼斯、熱那亞等城市因轉運貿易累積財富，成為文藝復興的經濟基礎。", "_v": "b3", "_vn": "世界史", "_c": "第 3 章 伊斯蘭與世界", "_u": "b3c3.html"}, {"t": "mc", "q": "歐洲人在十五世紀末積極尋找通往東方的新航路，與下列何者關係最密切？", "o": ["鄂圖曼帝國控制東西陸路貿易，使東方商品價格居高不下", "歐洲人已知美洲存在，想前往開採白銀", "教宗下令禁止陸路旅行", "歐洲人口過剩必須移民"], "a": 0, "e": "鄂圖曼居間控制使香料等商品價格高昂，歐洲臨海國家遂繞開伊斯蘭政權壟斷的陸路，開拓海上新航路。", "_v": "b3", "_vn": "世界史", "_c": "第 3 章 伊斯蘭與世界", "_u": "b3c3.html"}, {"t": "mc", "q": "凱末爾在土耳其推動的改革，最核心的方向是：", "o": ["恢復哈里發制度", "推行世俗化，將宗教與國家事務分離", "把國教改為基督教", "重建鄂圖曼帝國的版圖"], "a": 1, "e": "凱末爾廢除哈里發、改用拉丁字母、推動政教分離與西式法制，是伊斯蘭世界世俗化改革最著名的案例。", "_v": "b3", "_vn": "世界史", "_c": "第 3 章 伊斯蘭與世界", "_u": "b3c3.html"}, {"t": "tf", "q": "伊斯蘭教承認摩西與耶穌都是先知，並視穆罕默德為最後一位先知。", "a": true, "e": "這正是三個一神教「同源而分流」的關鍵：共同承認亞伯拉罕傳統，但對最終啟示者的認定不同。", "_v": "b3", "_vn": "世界史", "_c": "第 3 章 伊斯蘭與世界", "_u": "b3c3.html"}, {"t": "tf", "q": "1453 年鄂圖曼攻陷君士坦丁堡，結束了西羅馬帝國。", "a": false, "e": "結束的是東羅馬（拜占庭）帝國。西羅馬帝國早在 476 年就已滅亡。", "_v": "b3", "_vn": "世界史", "_c": "第 3 章 伊斯蘭與世界", "_u": "b3c3.html"}, {"t": "tf", "q": "阿拉伯數字其實源自印度，經由伊斯蘭世界傳入歐洲。", "a": true, "e": "穆斯林學者吸收印度數字系統並加以發展，歐洲人由阿拉伯文獻習得，因此稱之為「阿拉伯數字」。", "_v": "b3", "_vn": "世界史", "_c": "第 3 章 伊斯蘭與世界", "_u": "b3c3.html"}, {"t": "order", "q": "請依時間先後排序：", "items": ["聖遷（穆罕默德遷往麥地那）", "阿拔斯王朝建立", "十字軍運動開始", "鄂圖曼攻陷君士坦丁堡", "土耳其共和國成立"], "e": "622 → 750 → 1096 → 1453 → 1923。", "_v": "b3", "_vn": "世界史", "_c": "第 3 章 伊斯蘭與世界", "_u": "b3c3.html"}, {"t": "match", "q": "請把名詞與說明配對：", "pairs": [["五功", "念、禮、齋、課、朝"], ["智慧宮", "阿拔斯王朝的翻譯與學術機構"], ["米利特制", "鄂圖曼允許宗教社群自治的制度"], ["坦志麥特", "十九世紀鄂圖曼的西化改革"], ["有經人", "可保有原信仰但須納人頭稅的非穆斯林"]], "e": "注意區分「制度」（米利特、坦志麥特）與「信仰實踐」（五功）兩類概念。", "_v": "b3", "_vn": "世界史", "_c": "第 3 章 伊斯蘭與世界", "_u": "b3c3.html"}, {"t": "fill", "q": "伊斯蘭教徒一生若有能力，應至少前往 ______ 朝覲一次，此為五功之一。", "a": ["麥加"], "e": "朝（朝覲）是五功之一，地點為麥加的卡巴聖殿。", "_v": "b3", "_vn": "世界史", "_c": "第 3 章 伊斯蘭與世界", "_u": "b3c3.html"}, {"t": "fill", "q": "1258
